<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>農場紀事｜DHYANA 根本芳療</title>
<meta name="description" content="十七年來，我們跟著這些農家，認識一座島嶼的植物。植物、土地，和照顧它們的人。">
<meta property="og:title" content="農場紀事｜DHYANA 根本芳療">
<meta property="og:description" content="十七年來，我們跟著這些農家，認識一座島嶼的植物。植物、土地，和照顧它們的人。">
<meta property="og:type" content="website">
<meta property="og:image" content="https://i.ytimg.com/vi/GZSaEl9PHEc/maxresdefault.jpg">
<style>html,body{margin:0;padding:0;background:#EDE6D6}@media (prefers-color-scheme:dark){html,body{background:#161915}}</style>
</head>
<body>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400&display=swap">
<style>
#dhyana-series{
  --ground:#EDE6D6; --paper:#F5F0E3; --ink:#252220; --muted:#7A756D;
  --faint:#A8A29A; --gold:#B8965A; --line:#DBD2BE; --mat:#2D4A3E; --matink:#F5F0E3;
  --serif:"Noto Serif TC","Songti TC",serif;
  --latin:"Cormorant Garamond","Noto Serif TC",serif;
  --sans:"Noto Sans TC","PingFang TC",sans-serif;
  background:var(--ground); color:var(--ink);
  font-family:var(--serif); font-weight:300; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){
  #dhyana-series{ --ground:#161915; --paper:#1E221C; --ink:#EAE4D6; --muted:#9C9689;
    --faint:#6E6A60; --gold:#C9A96B; --line:#2F342C; --mat:#0E120F; --matink:#EAE4D6; }
}
#dhyana-series *{box-sizing:border-box}
#dhyana-series .wrap{max-width:44rem;margin:0 auto;padding:3rem 1.5rem 4rem}
#dhyana-series .lat{font-family:var(--latin);letter-spacing:.3em;text-transform:uppercase;
  font-weight:400;font-size:.7rem;color:var(--muted)}
#dhyana-series .brand{display:flex;align-items:center;gap:.7rem;color:var(--muted);margin-bottom:1.35rem}
#dhyana-series .brand .mk{font-family:var(--latin);letter-spacing:.34em;font-size:.72rem;text-transform:uppercase}
#dhyana-series .brand .zh{font-size:.78rem;letter-spacing:.14em}
#dhyana-series .brand .dot{width:3px;height:3px;border-radius:50%;background:var(--gold);flex:none}
#dhyana-series h1{margin:0 0 1.35rem;font-size:clamp(2.3rem,7.5vw,3.2rem);font-weight:400;
  letter-spacing:.07em;line-height:1.18;text-wrap:balance;color:var(--ink)}
#dhyana-series .lede{margin:0 0 1.1rem;max-width:29rem;color:var(--muted);font-size:1rem;line-height:1.95}
#dhyana-series .meta{display:flex;flex-wrap:wrap;gap:.5rem 1.4rem}
#dhyana-series .meta span{font-family:var(--sans);font-size:.73rem;letter-spacing:.09em;
  color:var(--faint);font-variant-numeric:tabular-nums}
#dhyana-series section{margin-top:3.4rem}
#dhyana-series .shead{display:flex;align-items:baseline;gap:.9rem;padding-bottom:.5rem;
  border-bottom:1px solid var(--ink)}
#dhyana-series .shead h2{margin:0;font-size:1.04rem;font-weight:500;letter-spacing:.16em;color:var(--ink)}
#dhyana-series .shead .lat{color:var(--gold)}
#dhyana-series .snote{margin:.85rem 0 .2rem;color:var(--faint);font-size:.85rem;line-height:1.8}
#dhyana-series .plink{display:inline-flex;align-items:center;gap:.4rem;margin:.15rem 0 .3rem;
  font-family:var(--sans);font-size:.75rem;letter-spacing:.07em;color:var(--gold);
  text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
#dhyana-series .plink:hover{border-bottom-color:var(--gold)}
#dhyana-series .arw{font-family:var(--latin);font-size:.9rem;line-height:1}
#dhyana-series .row{display:grid;grid-template-columns:2.7rem 1fr auto;gap:0 1.15rem;
  align-items:start;width:100%;text-align:left;padding:1.15rem 0;
  background:none;border:0;border-bottom:1px solid var(--line);
  color:inherit;font:inherit;cursor:pointer}
#dhyana-series .row:hover .term{color:var(--gold)}
#dhyana-series .row:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#dhyana-series .th{width:2.7rem;height:4.8rem;object-fit:cover;display:block;
  border:1px solid var(--line);background:var(--paper);margin-top:.15rem}
#dhyana-series .term{display:block;font-size:1.22rem;font-weight:400;letter-spacing:.1em;
  transition:color .18s;line-height:1.35;color:var(--ink)}
#dhyana-series .rom{display:block;font-family:var(--latin);font-size:.72rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--gold);margin-top:.2rem}
#dhyana-series .def{display:block;margin:.5rem 0 0;font-size:.9rem;color:var(--muted);
  line-height:1.82;max-width:25rem}
#dhyana-series .also{display:block;margin:.55rem 0 0;font-size:.76rem;color:var(--faint);
  letter-spacing:.03em;padding-left:.7rem;border-left:2px solid var(--line)}
#dhyana-series .dur{font-family:var(--sans);font-size:.75rem;color:var(--faint);
  font-variant-numeric:tabular-nums;letter-spacing:.06em;padding-top:.5rem;white-space:nowrap}
#dhyana-series .panel{display:none;padding:1.5rem 0 2rem;border-bottom:1px solid var(--line)}
#dhyana-series .panel.open{display:block}
#dhyana-series .stage{background:var(--mat);padding:1.1rem;display:flex;flex-direction:column;
  align-items:center;gap:.85rem}
#dhyana-series .frame{position:relative;aspect-ratio:9/16;height:min(68vh,29rem);width:auto;
  max-width:100%;background:#000;overflow:hidden}
#dhyana-series .frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#dhyana-series .cap{color:var(--matink);opacity:.6;font-size:.75rem;letter-spacing:.1em;
  font-family:var(--sans)}
#dhyana-series .xlink{display:flex;flex-direction:column;gap:.3rem;margin-top:3rem;
  padding:1.3rem 1.4rem;border:1px solid var(--line);text-decoration:none;
  background:var(--paper)}
#dhyana-series .xlink:hover{border-color:var(--gold)}
#dhyana-series .xlink .xzh{display:flex;align-items:center;gap:.5rem;font-size:1.05rem;
  letter-spacing:.1em;color:var(--ink)}
#dhyana-series .xlink:hover .xzh{color:var(--gold)}
#dhyana-series footer{margin-top:4.2rem;padding-top:1.5rem;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:.6rem 1.5rem;align-items:baseline}
#dhyana-series footer .zh{font-size:.83rem;letter-spacing:.12em;color:var(--muted)}
#dhyana-series footer .site{font-family:var(--sans);font-size:.75rem;color:var(--faint);
  letter-spacing:.06em;margin-left:auto}
@media (max-width:34rem){
  #dhyana-series .row{grid-template-columns:2.2rem 1fr;gap:0 .9rem}
  #dhyana-series .th{width:2.2rem;height:3.9rem}
  #dhyana-series .dur{grid-column:2;padding-top:.5rem}
  #dhyana-series .frame{height:min(64vh,25rem)}
}
@media (prefers-reduced-motion:reduce){#dhyana-series *{transition:none!important}}
</style>

<div id="dhyana-series"></div>
<noscript><p style="padding:2rem;font-family:sans-serif">請開啟 JavaScript 以檢視影片列表。</p></noscript>

<script>
/* ══════════════════════════════════════════════════════════
   農場紀事 ── 影片清單
   新增一集：複製 items 裡任一段 { … }, 改成新的內容即可。
   每段五個欄位：
     id   影片網址最後那串代碼（youtu.be/ 後面那串）
     term 中文詞　　rom 英文詞　　dur 長度 例 "2:56"
     def  說明文字　also 補充（不要就留 ""）
   注意：每個欄位結尾的逗號和引號不能刪。
   ══════════════════════════════════════════════════════════ */
var S = {
  h1: "農場紀事",
  zh: "農場紀事",  en: "Plants · Land · People",
  lede: "2009 年，我們從高雄大樹實驗農場，開始種自己要蒸餾的植物。後來，一塊田慢慢連上更多土地。他們認識土地的方法，在一雙手裡——知道什麼時候該種，什麼時候該等。",
  note: "十七年來，我們跟著這些農家，認識一座島嶼的植物。植物、土地，和照顧它們的人。",
  playlist: "PLK_6TSnMce-g",
  other: { zh: "純露詞典", en: "Hydrosol Lexicon", url: "https://feyond.muzen.store/lexicon.html" },

  /* ▼▼▼ 新增一集，複製下面一整段 { … }, 貼在最後一段後面 ▼▼▼ */
  items: [
    { id: "GZSaEl9PHEc",
      term: "採收的時辰",  rom: "Picked at Dusk",  dur: "2:56",
      def:  "這些年一直在說純露怎麼蒸餾、成份有什麼，卻很少說起——花是誰採的？什麼時候採？又為什麼，非得是那個時候？",
      also: "晚上七點，月亮剛爬上天際。對玉蘭而言，入夜不是一天的結束，而是採花的開始。" },
  ]
};

/* ══════════════════════════════════════════════════════════
   以下是版面程式，不用修改。
   ══════════════════════════════════════════════════════════ */
(function(){
  var esc=function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
  var root=document.getElementById('dhyana-series'); if(!root) return;
  var h=[];
  h.push('<div class="wrap">');
  h.push('<div class="brand"><span class="mk">Dhyana</span><span class="dot"></span><span class="zh">根本芳療</span></div>');
  h.push('<h1>'+esc(S.h1)+'</h1>');
  h.push('<p class="lede">'+esc(S.lede)+'</p>');
  h.push('<div class="meta"><span>'+S.items.length+' 則</span><span>每則 3 分鐘內</span><span>持續更新</span></div>');
  h.push('<section><div class="shead"><span class="lat">'+esc(S.en)+'</span><h2>'+esc(S.zh)+'</h2></div>');
  h.push('<p class="snote">'+esc(S.note)+'</p>');
  if(S.playlist){h.push('<a class="plink" href="https://www.youtube.com/playlist?list='+esc(S.playlist)+'" target="_blank" rel="noopener">在 YouTube 連續播放<span class="arw">&#8594;</span></a>');}
  S.items.forEach(function(it,i){
    var pid='p'+i;
    h.push('<button class="row" data-v="'+esc(it.id)+'" data-p="'+pid+'" aria-controls="'+pid+'" aria-expanded="false">'
      +'<img class="th" loading="lazy" alt="" src="https://i.ytimg.com/vi/'+esc(it.id)+'/maxresdefault.jpg">'
      +'<span><span class="term">'+esc(it.term)+'<span class="rom">'+esc(it.rom)+'</span></span>'
      +'<span class="def">'+esc(it.def)+'</span>'
      +(it.also?'<span class="also">'+esc(it.also)+'</span>':'')
      +'</span><span class="dur">'+esc(it.dur)+'</span></button>');
    h.push('<div class="panel" id="'+pid+'"><div class="stage"><div class="frame"></div>'
      +'<span class="cap">'+esc(it.term)+' '+esc(it.rom)+' &#183; '+esc(it.dur)+'</span></div></div>');
  });
  h.push('</section>');
  if(S.other && S.other.url && S.other.url.indexOf('http')===0){
    h.push('<a class="xlink" href="'+esc(S.other.url)+'"><span class="lat">'+esc(S.other.en)+'</span>'
      +'<span class="xzh">'+esc(S.other.zh)+'<span class="arw">&#8594;</span></span></a>');
  }
  h.push('<footer><span class="lat">Dhyana</span><span class="zh">根本芳療</span>'
    +'<span class="site">dhyana.store</span></footer>');
  h.push('</div>');
  root.innerHTML=h.join('');
  root.querySelectorAll('.row').forEach(function(b){
    b.addEventListener('click',function(){
      var p=document.getElementById(b.dataset.p);
      var open=p.classList.toggle('open');
      b.setAttribute('aria-expanded',open?'true':'false');
      var f=p.querySelector('.frame');
      if(open && !f.querySelector('iframe')){
        var ifr=document.createElement('iframe');
        ifr.src='https://www.youtube-nocookie.com/embed/'+b.dataset.v+'?rel=0&playsinline=1';
        ifr.allow='accelerometer; encrypted-media; picture-in-picture';
        ifr.allowFullscreen=true;
        ifr.setAttribute('title', b.querySelector('.term').textContent);
        f.appendChild(ifr);
      }
    });
  });
})();
</script>
</body>
</html>
