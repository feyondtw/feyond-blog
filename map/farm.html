<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>深根大地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<style>
:root{
  --ink:#2A2724; --cream:#FFF8F0; --line:#E2D9C8; --gold:#B8965A;
  --muted:#7A756D; --faint:#A8A29A;
  --serif:"Noto Serif TC","Songti TC",serif;
  --latin:"Cormorant Garamond",Georgia,serif;
  --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --shadow:0 2px 10px rgba(42,39,36,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#CBE0E6;color:var(--ink);
  font-family:var(--serif);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

#scene{position:fixed;inset:0;touch-action:none;cursor:grab}
#scene.grabbing{cursor:grabbing}
canvas{display:block}

/* ── 名牌 ─────────────────────────────── */
#tags{position:fixed;inset:0;pointer-events:none;z-index:2}
.tag{
  position:absolute;transform:translate(-50%,-100%);pointer-events:auto;
  background:var(--cream);border-radius:999px;padding:.4rem .85rem;
  box-shadow:var(--shadow);white-space:nowrap;cursor:pointer;
  font-family:var(--sans);font-size:.82rem;font-weight:500;letter-spacing:.05em;
  display:flex;align-items:center;gap:.45rem;
  transition:transform .18s,box-shadow .18s,opacity .25s
}
.tag:hover{transform:translate(-50%,-100%) scale(1.06);box-shadow:0 4px 16px rgba(42,39,36,.2)}
.tag .num{font-family:var(--latin);font-size:.78rem;color:var(--gold);font-weight:500}
.tag::after{
  content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--cream)
}
.tag.off{opacity:0;pointer-events:none}
body.notags .tag{opacity:0;pointer-events:none}

/* ── 片頭 ─────────────────────────────── */
.brand{position:fixed;top:0;left:0;z-index:3;padding:1.6rem 1.8rem;
  display:flex;flex-direction:column;gap:.45rem;pointer-events:none}
.brand .mk{font-family:var(--latin);letter-spacing:.34em;font-size:.72rem;
  text-transform:uppercase;color:#5E6B63}
.brand h1{margin:0;font-size:1.9rem;font-weight:500;letter-spacing:.14em;
  color:var(--ink);text-shadow:0 1px 10px rgba(255,255,255,.5)}
.brand p{margin:0;font-family:var(--sans);font-size:.76rem;letter-spacing:.07em;color:#5E6B63}

/* ── 工具列 ───────────────────────────── */
.tools{position:fixed;top:0;right:0;z-index:3;padding:1.6rem 1.8rem;
  display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.tool{background:var(--cream);border-radius:999px;padding:.42rem .9rem;
  box-shadow:var(--shadow);font-family:var(--sans);font-size:.76rem;
  letter-spacing:.06em;display:inline-flex;align-items:center;gap:.4rem;
  transition:transform .15s}
.tool:hover{transform:translateY(-1px)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.tool svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

.views{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:3;
  margin-top:1.6rem;display:flex;gap:.2rem;background:var(--cream);
  border-radius:999px;padding:.28rem;box-shadow:var(--shadow);
  font-family:var(--sans);font-size:.75rem;letter-spacing:.06em}
.views a,.views span{padding:.3rem .8rem;border-radius:999px;text-decoration:none;
  color:var(--muted);white-space:nowrap}
.views a:hover{color:var(--ink);background:#EFE7D9}
.views [aria-current]{background:var(--ink);color:var(--cream)}


/* 四段光線 */
.seg{display:inline-flex;align-items:center;background:var(--cream);border-radius:999px;
  padding:.22rem;box-shadow:var(--shadow);gap:.08rem}
.seg button{width:2.15rem;height:1.75rem;border-radius:999px;display:grid;place-items:center;
  color:var(--muted);transition:background .18s,color .18s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}

.hint{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:3;
  font-family:var(--sans);font-size:.74rem;letter-spacing:.07em;color:#5E6B63;
  background:rgba(255,248,240,.8);padding:.4rem .9rem;border-radius:999px;
  transition:opacity .4s;pointer-events:none}
.hint.gone{opacity:0}

/* ── 卡片 ─────────────────────────────── */
.card{
  position:fixed;z-index:4;right:1.8rem;top:50%;transform:translateY(-50%);
  width:min(23rem,calc(100vw - 3.6rem));max-height:min(32rem,calc(100vh - 8rem));
  background:var(--cream);border-radius:14px;box-shadow:0 10px 40px rgba(42,39,36,.22);
  display:flex;flex-direction:column;overflow:hidden
}
.card[hidden]{display:none}
.card-h{padding:1.5rem 1.5rem 1rem;border-bottom:1px solid var(--line);position:relative;flex:none}
.card-h .num{font-family:var(--latin);font-size:.76rem;letter-spacing:.24em;color:var(--gold)}
.card-h h2{margin:.3rem 0 0;font-size:1.4rem;font-weight:500;letter-spacing:.09em}
.card-h .en{font-family:var(--latin);font-size:.88rem;letter-spacing:.1em;color:var(--muted);font-style:italic}
.card-x{position:absolute;top:1rem;right:1rem;width:1.9rem;height:1.9rem;border-radius:50%;
  font-size:1.1rem;line-height:1;color:var(--muted)}
.card-x:hover{background:#EFE7D9}
/* flex:1 1 auto + min-height:0 缺一不可。少了它，內容一長
   就撐破 max-height 被 overflow:hidden 切掉，而不是變成捲動。 */
.card-b{padding:1.2rem 1.5rem 1.6rem;flex:1 1 auto;min-height:0;overflow-y:auto}
.card-b p{margin:0 0 1rem;font-size:.9rem;line-height:1.95}
.card-b p.lead{font-size:.95rem}
.card-b .quote{margin:0 0 1.1rem;padding-left:.9rem;border-left:2px solid var(--gold);
  font-size:.92rem;line-height:1.9;color:var(--ink)}
.card-b ul{margin:0 0 1.1rem;padding:0;list-style:none;
  font-family:var(--sans);font-size:.78rem;line-height:1.95;color:var(--muted)}
.card-b li{padding-left:1rem;position:relative}
.card-b li::before{content:"·";position:absolute;left:.2rem;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1.1rem}
.chips span{font-family:var(--sans);font-size:.72rem;letter-spacing:.05em;
  border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem;color:var(--muted)}
.flag{display:inline-block;font-family:var(--sans);font-size:.68rem;letter-spacing:.08em;
  border:1px solid var(--gold);color:var(--gold);border-radius:999px;
  padding:.18rem .6rem;margin-bottom:.9rem}
.verify{background:rgba(184,150,90,.12);border-left:2px solid var(--gold);
  padding:.8rem .95rem;margin:0 0 1.1rem;font-family:var(--sans);
  font-size:.78rem;line-height:1.85}

/* ── 跑不起來的時候 ─────────────────── */
.sorry{position:fixed;inset:0;z-index:5;display:flex;align-items:center;
  justify-content:center;padding:1.5rem}
.sorry[hidden]{display:none}
.sorry-box{background:var(--cream);border-radius:14px;box-shadow:0 10px 40px rgba(42,39,36,.18);
  padding:2rem 2rem 1.8rem;max-width:30rem;width:100%}
.sorry-box .num{font-family:var(--latin);letter-spacing:.24em;color:var(--gold);font-size:.78rem}
.sorry-box h2{margin:.35rem 0 .9rem;font-size:1.3rem;font-weight:500;letter-spacing:.08em}
.sorry-box p{margin:0 0 1.1rem;font-size:.9rem;line-height:1.9;color:var(--ink)}
.sorry-box ol{margin:0 0 1.1rem;padding-left:1.2rem;font-family:var(--sans);
  font-size:.82rem;line-height:2;color:var(--muted)}
.sorry-box b{font-weight:500;color:var(--ink)}
.sorry-box a{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--sans);
  font-size:.8rem;letter-spacing:.06em;color:var(--gold);text-decoration:none;
  border-bottom:1px solid transparent;padding-bottom:1px}
.sorry-box a:hover{border-bottom-color:var(--gold)}

@media (max-width:760px){
  .brand{padding:1rem 1.1rem}
  .brand h1{font-size:1.4rem}
  .tools{padding:1rem 1.1rem}
  .views{top:auto;bottom:3.2rem;margin-top:0;font-size:.72rem}
  .card{right:0;left:0;bottom:0;top:auto;transform:none;width:100%;
    max-height:62vh;border-radius:14px 14px 0 0}
  .hint{bottom:.8rem}
}
/* 小尺寸手機：控制列縮一排、提示收掉、字卡貼底留住地圖 */
@media (max-width:560px){
  .brand{padding:.75rem .9rem}
  .brand h1{font-size:1.08rem}
  .tools{padding:.75rem .9rem;gap:.3rem}
  .tool,.seg button{font-size:.66rem;padding:.28rem .5rem}
  .views{font-size:.66rem;gap:.55rem;bottom:2.6rem}
  .hint{display:none}
  .card{max-height:68dvh}
  .card-h{padding:1.05rem 1.05rem .8rem}
  .card-b{padding:.95rem 1.05rem 1.2rem}
}
@media (prefers-reduced-motion:reduce){.tag{transition:none}}
</style>
</head>
<body>

<div id="scene"></div>
<div id="tags"></div>

<header class="brand">
  <span class="mk">Dhyana</span>
  <h1>深根大地</h1>
  <p>實驗農場 ・ 高雄旗山 ・ 0.7102 公頃</p>
</header>

<nav class="views">
  <a href="index.html">香氣地圖</a>
  <a href="world.html">島群</a>
  <a href="taiwan.html">台灣島</a>
  <span aria-current="page">深根大地</span>
</nav>

<nav class="tools">
  <button class="tool" id="t-tags" aria-pressed="true">
    <svg viewBox="0 0 16 16"><rect x="2" y="5" width="12" height="6" rx="3"/></svg>名牌</button>
  <div class="seg" role="group" aria-label="光線">
    <button id="m-dawn" aria-pressed="false" title="清晨" aria-label="清晨">
      <svg viewBox="0 0 24 24"><path d="M3 19h18M6.5 19a5.5 5.5 0 0 1 11 0"/><path d="M12 3v4M9.2 6.2 12 3.4l2.8 2.8"/></svg></button>
    <button id="m-day" aria-pressed="true" title="白天" aria-label="白天">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.2M12 19.4v2.2M2.4 12h2.2M19.4 12h2.2M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M5.2 18.8l1.6-1.6M17.2 6.8l1.6-1.6"/></svg></button>
    <button id="m-dusk" aria-pressed="false" title="黃昏" aria-label="黃昏">
      <svg viewBox="0 0 24 24"><path d="M3 19h18M6.5 19a5.5 5.5 0 0 1 11 0"/><path d="M12 7.4V3M9.2 4.6 12 7.4l2.8-2.8"/></svg></button>
    <button id="m-night" aria-pressed="false" title="夜晚" aria-label="夜晚">
      <svg viewBox="0 0 24 24"><path d="M19.5 15.2A8.2 8.2 0 0 1 8.8 4.5a7.2 7.2 0 1 0 10.7 10.7z"/></svg></button>
  </div>
  <button class="tool" id="t-pause" aria-pressed="false">
    <svg viewBox="0 0 16 16"><rect x="4" y="3" width="2.5" height="10" rx="1"/><rect x="9.5" y="3" width="2.5" height="10" rx="1"/></svg>暫停</button>
  <button class="tool" id="t-bird" aria-pressed="false">
    <svg viewBox="0 0 16 16"><path d="M8 2.5 14 7l-6 4.5L2 7z"/><path d="M2 7v2.2L8 13.7l6-4.5V7"/></svg>鳥瞰</button>
  <button class="tool" id="t-reset">
    <svg viewBox="0 0 16 16"><path d="M5 11 11 5M6 5h5v5"/></svg>回正</button>
</nav>

<p class="hint" id="hint">拖曳轉動 ・ 滾輪縮放 ・ 點名牌看故事</p>

<section class="sorry" id="sorry" hidden>
  <div class="sorry-box">
    <div class="num">—</div>
    <h2 id="sorry-title"></h2>
    <p id="sorry-why"></p>
    <div id="sorry-how"></div>
  </div>
</section>

<article class="card" id="card" hidden aria-live="polite">
  <div class="card-h">
    <button class="card-x" id="card-x" aria-label="關閉">×</button>
    <div class="num" id="c-num"></div>
    <h2 id="c-title"></h2>
    <div class="en" id="c-en"></div>
  </div>
  <div class="card-b" id="c-body"></div>
</article>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   深根大地實驗農場 ── 低多邊形島
   所有物件都是程式用方塊 / 圓柱 / 圓錐堆出來的，
   沒有任何 3D 模型檔要載。

   島一定要 WebGL。跑不起來時不要留一片白——
   直接告訴使用者是哪一種狀況、怎麼辦。
   ═══════════════════════════════════════════════════════════ */
(function(){

function sorry(title, why, how){
  document.getElementById('sorry-title').textContent = title;
  document.getElementById('sorry-why').innerHTML = why;
  document.getElementById('sorry-how').innerHTML = how || '';
  document.getElementById('sorry').hidden = false;
  document.querySelector('.tools').hidden = true;
  document.getElementById('hint').hidden = true;
}

const GLOBE = `<a href="index.html">改看香氣地圖（不需要 WebGL）<span>&#8594;</span></a>`;

if (typeof THREE === 'undefined'){
  sorry('3D 函式庫沒有載入',
    '這座島需要從網路載入 three.js。可能是沒有連線，或是這個網路／瀏覽器擋掉了外部程式。',
    GLOBE);
  return;
}
try {
  const probe = document.createElement('canvas');
  if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw 0;
} catch (e){
  sorry('這個瀏覽器沒有開啟 WebGL',
    '島是 3D 的，需要 WebGL 才畫得出來。<b>Safari 的「封閉模式」會停用 WebGL</b>——如果網址列旁邊看得到「已啟用封閉模式」，就是它。',
    `<ol>
       <li>Safari 選單 → <b>設定⋯</b> → <b>網站</b>，或系統<b>設定 → 隱私權與安全性 → 封閉模式</b>，關閉後重開 Safari</li>
       <li>或改用 Chrome／Edge 開這個檔案</li>
     </ol>` + GLOBE);
  return;
}

/* ── 熱點內容 ─────────────────────────── */
const SPOTS = {
  still: {
    num: '01', zh: '蒸餾房', en: 'The Still',
    body: `
      <p class="lead">種植的紀錄、蒸餾的數據，是我們帶去給合作農家的東西。</p>
      <p>自己的田先走過一遍，留下完整的蒸餾參數，才把這套方法交給全台 28 處合作農家。</p>
      <ul>
        <li>合作蒸餾廠 3 處：南台灣、三義、嘉南</li>
        <li>日本檜木蒸餾出的純露是紅色的</li>
      </ul>`
  },
  nursery: {
    num: '02', zh: '育苗溫室', en: 'The Nursery',
    body: `
      <p class="quote">在請農家種下任何一種植物之前，我們得先自己種過。</p>
      <p class="lead">這句話就是「實驗農場」四個字的全部意思。</p>
      <p>不是先談契作、再試種；是先在自己的 0.7102 公頃上種過一輪，確認得活、確認蒸得出東西，才拿去跟農家談。</p>
      <p>這套邏輯競品抄不走——因為它要的不是文案，是時間。</p>`
  },
  field: {
    num: '03', zh: '試驗田', en: 'The Trial Beds',
    body: `
      <p class="lead">園區裡正在種的植物。每一種都是將來可能交給農家的候選。</p>
      <div class="chips">
        <span>貞潔樹</span><span>廣藿香</span><span>檸檬羅勒</span>
        <span>阿密茴</span><span>牛膝草</span><span>紅紫蘇</span>
      </div>
      <p>農地從 2009 年開始，公司則約 25 年。先有田，才有後來的產品線。</p>`
  },
  pond: {
    num: '04', zh: '青蓮花池', en: 'Blue Lotus Pond',
    body: `
      <span class="flag">產地待確認</span>
      <p class="quote">根扎在池底厚重的淤泥裡，花卻乾淨地探出水面。</p>
      <p class="lead">晨開暮合，生生不息。</p>
      <div class="verify">
        <b>這裡有一個待釐清的點。</b><br>
        影片說青蓮花來自埃及下尼羅河三角洲，但園區的自家植物清單裡也有青蓮花。<br><br>
        如果實情是「先自己種過，才去埃及找料」——那這就是實驗農場論點最好的例子，值得寫成文案，而不只是修一個欄位。
      </div>`
  },
  cert: {
    num: '05', zh: '有機驗證', en: 'Certified Organic',
    body: `
      <p class="lead">對外宣稱綁在字號上，不要把「有機」兩個字寫進農場名字。</p>
      <ul>
        <li>環球國際驗證 UCS（TAF PC070）</li>
        <li>證書字號 1-007-113025（原 UCS-OA-13025）</li>
        <li>經營者：顏憶萍（根本芳療）</li>
        <li>高雄市旗山區旗尾段二小段 2076 地號</li>
        <li>0.7102 公頃，有機（非轉型期）</li>
        <li>有效至 2028-11-27</li>
      </ul>
      <p>證書上沒有「深根大地」四個字。</p>`
  }
};

/* ── 配色 ─────────────────────────────── */
const C = {
  grass:0x9BC47E, grassDark:0x7FAE66, soil:0xC9A878, rock:0xBFB49C,
  sand:0xE6D6AE, water:0x6FB0C9, pond:0x4A8CA6,
  wall:0xFBF3E2, roofRed:0xD9663F, roofYellow:0xF2C14E, roofBlue:0x5C8FB8,
  wood:0x9A7550, copper:0xCE8B4A, metal:0xB7C3C6, glass:0xBFE0E8,
  treeA:0x5E9A62, treeB:0x82B872, treeC:0x4A8457, trunk:0x8A6A4A,
  lily:0x6FA86B, lotus:0x8E9BE0, cloud:0xFFFFFF,
  skin:0xE8B98E, hair:0x3A2E28,
  shirt:[0xD9663F,0xF2C14E,0x5C8FB8,0xFBF3E2,0x7FAE66,0xB8965A]
};
C.grassDark = 0x7FAE66;

/* ── 四段光線 ──────────────────────────────────────────
   重點不只是顏色：太陽的位置會跟著移，所以影子會掃過去。
   清晨光從東邊低角度進來，黃昏從西邊，夜晚只剩月色與窗光。 */
const MOODS = {
  dawn:  {zh:'清晨', bg:0xD6DCE2, fog:0xDBE1E5, hemiSky:0xE8E4EC, hemiGnd:0x9AA890,
          hemiI:0.60, sun:0xFFD2A6, sunI:0.56, pos:[-78, 18, 34], sea:0x7C9AA6,
          amb:0.15, lit:false},
  day:   {zh:'白天', bg:0xBCDCE8, fog:0xC6E2EC, hemiSky:0xCDE8F2, hemiGnd:0x8FBB72,
          hemiI:0.62, sun:0xFFF4DC, sunI:0.92, pos:[16, 24, 12], sea:0x6BA3B5,
          amb:0.17, lit:false},
  dusk:  {zh:'黃昏', bg:0xE9C7A2, fog:0xE4C2A0, hemiSky:0xF4D4AE, hemiGnd:0x9C866A,
          hemiI:0.56, sun:0xFFA660, sunI:0.82, pos:[82, 15, -26], sea:0x94908E,
          amb:0.13, lit:true},
  night: {zh:'夜晚', bg:0x1D2B38, fog:0x22323E, hemiSky:0x364C5E, hemiGnd:0x2A3828,

/* 低多邊形的切面感全靠 flatShading。
   注意：Lambert 在 r134 不吃這個屬性，一定要用 Phong（shininess 0 = 霧面）。 */
const mats = {};
function mat(color, opts){
  const key = color + JSON.stringify(opts || {});
  if (!mats[key]) mats[key] = new THREE.MeshPhongMaterial(
    Object.assign({color, flatShading:true, shininess:0, specular:0x000000}, opts));
  return mats[key];
}
function mesh(geo, color, x, y, z, opts){
  const m = new THREE.Mesh(geo, mat(color, opts));
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
const box  = (w,h,d,c,x,y,z,o) => mesh(new THREE.BoxGeometry(w,h,d), c,x,y,z,o);

const cone = (r,h,s,c,x,y,z,o) => mesh(new THREE.ConeGeometry(r,h,s), c,x,y,z,o);
const ball = (r,c,x,y,z,o) => mesh(new THREE.SphereGeometry(r,10,8), c,x,y,z,o);

function tree(x, y, z, s){
  const g = new THREE.Group();
  g.add(cyl(0.16, 0.2, 1.1, 6, C.trunk, 0, 0.55, 0));
  const kind = Math.random();
  if (kind < 0.45){
    g.add(cone(0.95, 1.7, 7, C.treeA, 0, 1.75, 0));
    g.add(cone(0.72, 1.3, 7, C.treeB, 0, 2.55, 0));
  } else if (kind < 0.8){
    g.add(ball(0.95, C.treeB, 0, 1.85, 0));
    g.add(ball(0.6, C.treeA, 0.4, 2.3, 0.2));
  } else {
    g.add(ball(0.8, C.treeC, 0, 1.7, 0));
    g.add(ball(0.55, C.treeB, -0.35, 2.15, 0.15));
  }
  g.position.set(x, y, z);
  g.scale.setScalar(s || 1);
  g.rotation.y = Math.random() * Math.PI * 2;
  return g;
}

    pv.add(foot); return pv;

[[-14,11,-6,1.5],[12,13,-10,1.2],[18,10,6,1.7],[-10,14,12,1.1],[2,12,-16,1.3]]
  .forEach(([x,y,z,s]) => { const c = cloud(x,y,z,s); world.add(c); clouds.push(c); });

/* ═══ 鏡頭 ═══════════════════════════════ */
const CAM = {theta: -0.62, phi: 1.02, dist: 34, target: new THREE.Vector3(0, 0.8, 0)};
const HOME = {theta: -0.62, phi: 1.02, dist: 34};
let autoSpin = !reduce, paused = false;

let BIRD_MIN = 0.28;
const HOME_PHI_MIN = 0.28;
function applyCam(){
  CAM.phi = Math.max(BIRD_MIN, Math.min(1.40, CAM.phi));
  CAM.dist = Math.max(16, Math.min(62, CAM.dist));
  camera.position.set(
    CAM.target.x + CAM.dist * Math.sin(CAM.phi) * Math.sin(CAM.theta),
    CAM.target.y + CAM.dist * Math.cos(CAM.phi),
    CAM.target.z + CAM.dist * Math.sin(CAM.phi) * Math.cos(CAM.theta));
  camera.lookAt(CAM.target);
}

let dragging = false, moved = false, lx = 0, ly = 0;
const touches = new Map();
const gap = () => {
  const [a, b] = [...touches.values()];
  return Math.hypot(a.x - b.x, a.y - b.y);
};
let gap0 = 0, dist0 = 0;

host.addEventListener('pointerdown', e => {
  touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  host.setPointerCapture(e.pointerId);
  moved = false; autoSpin = false;
  if (touches.size === 1){ dragging = true; lx = e.clientX; ly = e.clientY;
    host.classList.add('grabbing'); }
  else if (touches.size === 2){ dragging = false; host.classList.remove('grabbing');
    gap0 = gap(); dist0 = CAM.dist; }
});
host.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (touches.size === 2){
    if (gap0 > 0){ CAM.dist = dist0 * gap0 / gap(); applyCam(); moved = true; }
    return;
  }
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  CAM.theta -= dx * 0.0062;
  CAM.phi   -= dy * 0.0048;
  lx = e.clientX; ly = e.clientY;
  applyCam(); hideHint();
});
['pointerup','pointercancel'].forEach(t => host.addEventListener(t, e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) gap0 = 0;
  if (touches.size === 0){ dragging = false; host.classList.remove('grabbing'); }
}));
host.addEventListener('wheel', e => {
  e.preventDefault();
  CAM.dist *= 1 + e.deltaY * 0.0014;
  applyCam(); hideHint();
}, {passive:false});


/* 鳥瞰：不是另一個場景，只是把相機搬到正上方。
   puma 的作法一樣——相機移到目標上空、放寬垂直角下限、補間飛過去。 */
const tBird = document.getElementById('t-bird');
let birdOn = false;
function glideCam(toPhi, toDist, ms){
  const a = {phi:CAM.phi, dist:CAM.dist}, t0 = performance.now(), me = anim = {};
  (function step(now){
    if (anim !== me) return;
    const k = Math.min(1, (now - t0) / (ms || 850));
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    CAM.phi = a.phi + (toPhi - a.phi) * e;
    CAM.dist = a.dist + (toDist - a.dist) * e;
    applyCam();
    if (k < 1) requestAnimationFrame(step); else if (anim === me) anim = null;
  })(t0);
}
if (tBird) tBird.onclick = () => {
  birdOn = !birdOn;
  tBird.setAttribute('aria-pressed', String(birdOn));
  BIRD_MIN = birdOn ? 0.06 : HOME_PHI_MIN;
  glideCam(birdOn ? 0.07 : HOME.phi, birdOn ? CAM.dist * 0.92 : HOME.dist);
};

/* 日夜 */
let lerp = 1;
const MOOD_KEYS = ['dawn', 'day', 'dusk', 'night'];
let moodNow = 'day', moodFrom = MOODS.day, moodTo = MOODS.day;
const cA = new THREE.Color(), cB = new THREE.Color();
const mixc = (t, a, b, q) => { cA.setHex(a); cB.setHex(b); t.copy(cA).lerp(cB, q); };
const lerpn = (a, b, q) => a + (b - a) * q;

/* 從畫面目前的實際值出發，所以轉場途中再點也不會跳一下 */
function currentMood(){
  return {bg:scene.background.getHex(), fog:scene.fog ? scene.fog.color.getHex() : 0,
    hemiSky:hemi.color.getHex(), hemiGnd:hemi.groundColor.getHex(), hemiI:hemi.intensity,
    sun:sun.color.getHex(), sunI:sun.intensity,
    pos:[sun.position.x, sun.position.y, sun.position.z],
    sea:seaMat.color.getHex(), amb:amb.intensity, lit:moodTo.lit};
}
MOOD_KEYS.forEach(key => {
  const btn = document.getElementById('m-' + key);
  if (!btn) return;
  btn.onclick = () => {
    if (moodNow === key) return;
    moodFrom = currentMood(); moodTo = MOODS[key]; lerp = 0; moodNow = key;
    MOOD_KEYS.forEach(k2 => {
      const b2 = document.getElementById('m-' + k2);
      if (b2) b2.setAttribute('aria-pressed', String(k2 === key));
    });
  };
});
function mood(q){
  mixc(scene.background, moodFrom.bg, moodTo.bg, q);
  if (scene.fog) mixc(scene.fog.color, moodFrom.fog, moodTo.fog, q);
  mixc(hemi.color, moodFrom.hemiSky, moodTo.hemiSky, q);
  mixc(hemi.groundColor, moodFrom.hemiGnd, moodTo.hemiGnd, q);
  mixc(sun.color, moodFrom.sun, moodTo.sun, q);
  mixc(seaMat.color, moodFrom.sea, moodTo.sea, q);
  sun.intensity = lerpn(moodFrom.sunI, moodTo.sunI, q);
  hemi.intensity = lerpn(moodFrom.hemiI, moodTo.hemiI, q);
  amb.intensity = lerpn(moodFrom.amb, moodTo.amb, q);
  sun.position.set(lerpn(moodFrom.pos[0], moodTo.pos[0], q),
                   lerpn(moodFrom.pos[1], moodTo.pos[1], q),
                   lerpn(moodFrom.pos[2], moodTo.pos[2], q));
  const lit = q > 0.5 ? moodTo.lit : moodFrom.lit;
  windows.forEach(w => w.material = mat(lit ? 0xFFD79A : 0x3E5260));
}

/* ═══ 動畫 ═══════════════════════════════ */
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  applyCam();
}
addEventListener('resize', resize);

const up = new THREE.Vector3(0, 1, 0);
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
function walk(p, dt){
  p.userData.t = (p.userData.t + p.userData.speed * dt) % 1;
  const n = WALK.length, f = p.userData.t * n, i = Math.floor(f), k = f - i;
  const a = WALK[i], b = WALK[(i + 1) % n];
  tmp.copy(a).lerp(b, k);
  const sw = Math.sin(p.userData.t * 64);
  p.position.set(tmp.x, TOP_Y + Math.abs(sw) * 0.05, tmp.z);
  tmp2.copy(b).sub(a);
  p.rotation.y = Math.atan2(tmp2.x, tmp2.z);
  if (p.__legs){ p.__legs[0].rotation.x = sw * 0.6;
                 p.__legs[1].rotation.x = -sw * 0.6; }
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(loop);

  if (lerp < 1){ lerp = Math.min(1, lerp + dt * 1.1); mood(lerp); }

  if (!paused){
    if (autoSpin){ CAM.theta -= dt * 0.055; applyCam(); }
    folk.forEach(p => walk(p, dt));
    clouds.forEach(c => {
      c.position.x += c.userData.speed * dt * 60;
      if (c.position.x > 34) c.position.x = -34;
    });
    const base = stillG.userData.steam;
    steam.forEach(s => {
      s.userData.t = (s.userData.t + dt * 0.30) % 1;
      const t = s.userData.t;
      s.position.set(
        stillG.position.x + base.x * Math.cos(stillG.rotation.y) + base.z * Math.sin(stillG.rotation.y) + Math.sin(t * 6) * 0.3,
        base.y + t * 3.4,
        stillG.position.z - base.x * Math.sin(stillG.rotation.y) + base.z * Math.cos(stillG.rotation.y) + Math.cos(t * 5) * 0.25);
      s.scale.setScalar(0.5 + t * 1.5);
      s.material.opacity = 0.45 * (1 - t);
    });
    ripples.forEach(r => {
      r.userData.t = (r.userData.t + dt * 0.22) % 1;
      const t = r.userData.t;
      r.scale.setScalar(1 + t * 0.55);
      r.material.opacity = 0.3 * (1 - t);
    });
    spin.forEach(s => {
      if (s.kind === 'lotus'){
        s.o.userData.sway += dt * 1.6;
        s.o.rotation.z = Math.sin(s.o.userData.sway) * 0.09;
      }
    });
  }

  placeTags();
  renderer.render(scene, camera);
}

resize();
applyCam();
mood(1);
requestAnimationFrame(loop);

})();
