<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>香氣島群・版塊</title>
<style>
:root{
  --cream:#FBF7EE; --ink:#2F2C27; --gold:#B8965A; --line:#E7E1D2;
  --faint:#A9A598; --muted:#7D786E; --mat:#5C9291; --red:#D94F2B;
  /* 不向外下載字型：各平台內建的黑體就夠，開頁只剩 three.js 一個外部檔案 */
  --sans:"PingFang TC","PingFang SC","Microsoft JhengHei","Noto Sans CJK TC",
         "Noto Sans TC",system-ui,sans-serif;
  --serif:var(--sans);
  /* 這一頁不用線體：數字與拉丁字一律 Arial，中文一律蘋方 */
  --latin:Arial,"Helvetica Neue",Helvetica,sans-serif;
  --shadow:0 3px 14px rgba(42,39,36,.16);
}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh}
body{margin:0;overflow:hidden;background:#DCE4CC;color:var(--ink);
  font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:3px}
#scene{position:fixed;inset:0;touch-action:none;cursor:grab}
#scene.grabbing{cursor:grabbing}

/* ── 疊在畫面上的東西 ───────────────────── */
.over{position:fixed;z-index:3;pointer-events:none}
.over > *{pointer-events:auto}
.brand{top:0;left:0;padding:1.4rem 1.6rem}
.brand .mk{font-family:var(--latin);letter-spacing:.34em;font-size:.72rem;
  color:var(--gold);text-transform:uppercase;display:block}
.brand h1{margin:.3rem 0 0;font-size:1.5rem;font-weight:600;letter-spacing:.12em}
.brand .sub{font-family:var(--sans);font-size:.72rem;letter-spacing:.06em;
  color:var(--muted);margin-top:.35rem;display:block}
.views{top:1.4rem;left:50%;transform:translateX(-50%);display:flex;gap:.1rem;
  background:color-mix(in srgb,var(--cream) 90%,transparent);border-radius:999px;
  padding:.25rem;font-family:var(--sans);font-size:.74rem;letter-spacing:.06em}
.views a,.views span{padding:.32rem .8rem;border-radius:999px;color:var(--muted);
  text-decoration:none;transition:.2s}
.views a:hover{color:var(--gold)}
.views span{background:var(--ink);color:var(--cream)}
.tools{top:0;right:0;padding:1.4rem 1.6rem;display:flex;gap:.4rem;align-items:center}
.tool,.seg button{font-family:var(--sans);font-size:.72rem;letter-spacing:.06em;
  background:color-mix(in srgb,var(--cream) 90%,transparent);border-radius:999px;
  padding:.35rem .8rem;color:var(--ink);transition:.2s}
.tool:hover{color:var(--gold)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.seg{display:flex;gap:.15rem;background:color-mix(in srgb,var(--cream) 90%,transparent);
  border-radius:999px;padding:.15rem}
.seg button{background:none;padding:.32rem .55rem;border-radius:999px;line-height:0;display:grid;place-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.hint{bottom:1.1rem;left:50%;transform:translateX(-50%);font-family:var(--sans);
  font-size:.7rem;letter-spacing:.08em;color:#3E6A78}

/* ── 名牌：平常是光點，滑過才長出字 ───────── */
#tags{position:fixed;inset:0;z-index:2;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-100%);transform-origin:50% 100%;pointer-events:auto;
  background:transparent;border-radius:999px;padding:0;box-shadow:none;gap:0;
  white-space:nowrap;cursor:pointer;display:flex;align-items:center;
  font-family:var(--sans);font-size:.78rem;font-weight:500;letter-spacing:.04em;
  transition:gap .18s,padding .18s,background .18s,box-shadow .18s,opacity .2s}
.tag .nm{max-width:0;opacity:0;overflow:hidden;
  transition:max-width .22s,opacity .16s}
.tag{background:var(--cream);padding:.2rem;box-shadow:0 3px 12px rgba(42,39,36,.18)}
.tag:hover,.tag.on{z-index:2;padding:.2rem .7rem .2rem .2rem;gap:.42rem;
  box-shadow:0 5px 18px rgba(42,39,36,.24)}
.tag:hover .nm,.tag.on .nm{max-width:15rem;opacity:1}
.badge{font-family:var(--latin);font-size:.78rem;font-weight:500;color:#FFFFFF;
  border-radius:999px;padding:.2rem .5rem;line-height:1;flex:none;
  font-variant-numeric:tabular-nums;letter-spacing:.04em}
/* 第二層的品項編號改用 Arial：Cormorant 是舊式數字，0 小、3 和 9 往下掉，
   小字級一看就糊。Arial 是等高的直式數字，粗一點、等寬，一眼讀得出來。 */
.badge.sm{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:700;
  font-size:.74rem;letter-spacing:.03em;padding:.18rem .44rem;
  font-variant-numeric:lining-nums tabular-nums}
.tag::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--cream);opacity:0;transition:opacity .16s}
.tag:hover::after,.tag.on::after{opacity:1}
.tag.off{opacity:0;pointer-events:none}
body.notags .tag,body.notags .stem{opacity:0;pointer-events:none}
/* 島名：比品項大一階，永遠展開 */
/* 第一層的島名牌：比第二層大一號。數字用 Arial、Book 字重（正常粗細，
   不加粗），和第二層粗體的小編號分得出主從。 */
.tag.isle{padding:.32rem .95rem .32rem .32rem;gap:.55rem;font-size:1.06rem;font-weight:600;
  box-shadow:0 5px 18px rgba(42,39,36,.2)}
.tag.isle .nm{max-width:15rem;opacity:1}
.tag.isle .badge{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:400;
  font-size:1.02rem;letter-spacing:.04em;padding:.3rem .62rem;
  font-variant-numeric:lining-nums tabular-nums}
.tag.isle .n{font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;font-weight:400;
  font-size:.86rem;color:var(--muted)}
.tag.isle::after{opacity:1}

/* ── 第二層：照 PUMA 的號碼章 ───────────────────────────
   正圓、實心島色、粗白邊、白字；底下一根細桿拉到地上。
   滑過或選到的那一個展開成整條島色色帶。 */
.stem{position:absolute;width:2px;margin-left:-1px;background:var(--ic);
  opacity:.9;pointer-events:none;z-index:1}
.stem.off{display:none}
.tag.it{background:transparent;box-shadow:none;padding:0;gap:0;z-index:2}
.tag.it::after{display:none}
.tag.it .badge.sm{width:32px;height:32px;border-radius:50%;padding:0;
  display:grid;place-items:center;background:var(--ic) !important;color:#FFFFFF;
  font-size:.84rem;letter-spacing:0;
  box-shadow:0 0 0 3px #FFFFFF,0 4px 12px rgba(42,39,36,.28)}
.tag.it:hover,.tag.it.on,.tag.it.hl{z-index:4;background:var(--ic);color:#FFFFFF;
  padding:.26rem 1rem .26rem .26rem;gap:.55rem;
  box-shadow:0 0 0 3px #FFFFFF,0 6px 18px rgba(42,39,36,.3)}
.tag.it:hover .badge.sm,.tag.it.on .badge.sm,.tag.it.hl .badge.sm{
  background:#FFFFFF !important;color:var(--ic);box-shadow:none}
.tag.it .nm{font-weight:700;font-size:.92rem}

/* 品項多的島：每一區只放一個區名牌，個別號碼平常收起來 */
.tag.zone{background:var(--cream);padding:.42rem .9rem .42rem .7rem;gap:.5rem;z-index:3;
  font-size:.86rem;font-weight:600;box-shadow:0 0 0 2px #FFFFFF,0 4px 14px rgba(42,39,36,.22)}
.tag.zone .nm{max-width:12rem;opacity:1}
.tag.zone .zb{width:10px;height:10px;border-radius:999px;background:var(--ic);flex:none}
.tag.zone::after{opacity:1}

/* 字卡就是第二層選單：依區分組，每列前面是和地圖同一個號碼章 */
.zone-h{display:flex;align-items:baseline;gap:.5rem;margin:1.2rem 0 .55rem;
  font-size:.82rem;font-weight:600;letter-spacing:.06em;color:var(--ink)}
.zone-h .c{font-family:Arial,sans-serif;font-weight:400;font-size:.78rem;color:var(--faint)}
.item.menu{grid-template-columns:auto 1fr auto auto;align-items:center}
.item.menu::before{display:none}
.item.menu .mb{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--ic);color:#FFFFFF;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
  font-weight:700;font-size:.72rem}
.item.menu:hover{border-color:var(--ic)}
/* 第二層打開時，第一層名牌改成微亮的橘棕色、白字。第二層號碼章是
   偏灰的島色，這裡用更亮、更飽和的橘棕把兩層分開（不用黑色系）。 */
.tag.isle.cur{background:#DB8A45;color:#FFFFFF;z-index:5;
  box-shadow:0 0 0 3px #FFFFFF,0 6px 22px rgba(170,95,30,.35)}
.tag.isle.cur .badge{background:#FFFFFF !important;color:#C4702E}
.tag.isle.cur .n{color:rgba(255,255,255,.85)}
.tag.isle.cur::after{border-top-color:#DB8A45}
@media (hover:none){ .tag .badge{font-size:.82rem;padding:.26rem .56rem} }

/* ── 字卡 ───────────────────────────────── */
.card{position:fixed;z-index:4;right:1.8rem;top:50%;transform:translateY(-50%);
  width:min(23rem,calc(100vw - 3.6rem));max-height:min(34rem,calc(100dvh - 8rem));
  background:var(--cream);border-radius:14px;box-shadow:0 10px 40px rgba(42,39,36,.22);
  display:flex;flex-direction:column;overflow:hidden;
  font-family:var(--sans)}
.card[hidden]{display:none}
.card-h{padding:1.3rem 2.6rem .9rem 1.4rem;border-bottom:1px solid var(--line);
  position:relative;flex:none}
.card-h .eyebrow{font-family:var(--latin);font-size:.74rem;letter-spacing:.2em;color:var(--gold)}
.card-h h2{margin:.25rem 0 0;font-family:var(--serif);font-size:1.3rem;
  font-weight:500;letter-spacing:.07em;line-height:1.3}
.card-h .lat{font-family:var(--latin);font-style:italic;font-size:.9rem;
  letter-spacing:.08em;color:var(--muted);display:block;margin-top:.15rem}
.card-h .where{font-size:.76rem;letter-spacing:.05em;color:var(--faint);margin-top:.45rem}
.card-x{position:absolute;top:.9rem;right:1rem;font-size:1.05rem;line-height:1;
  color:var(--faint);padding:.3rem;transition:color .2s}
.card-x:hover{color:var(--gold)}
.card-b{padding:1.1rem 1.4rem 1.5rem;flex:1 1 auto;min-height:0;overflow-y:auto}
.card-b p{margin:0 0 1rem;font-size:.86rem;line-height:1.9}
.card-b .note{padding-left:.85rem;border-left:2px solid var(--gold);color:var(--muted)}
.card-b .quote{font-family:var(--serif);font-size:.92rem;line-height:1.95;
  color:var(--ink);letter-spacing:.02em;margin:0 0 1.1rem}
.card-b .scene{font-size:.78rem;color:var(--faint);letter-spacing:.04em;margin:0 0 1rem}
.kv{display:grid;grid-template-columns:4.2rem 1fr;gap:.45rem .85rem;margin:0 0 1.1rem;
  font-size:.83rem}
.kv dt{font-size:.72rem;letter-spacing:.09em;color:var(--faint)}
.kv dd{margin:0;line-height:1.7}
.flag{display:inline-block;font-size:.66rem;letter-spacing:.08em;border:1px solid var(--gold);
  color:var(--gold);border-radius:999px;padding:.16rem .6rem;margin-bottom:.8rem}
.verify{background:color-mix(in srgb,var(--gold) 11%,transparent);
  border-left:2px solid var(--gold);padding:.7rem .85rem;margin:0 0 1.1rem;
  font-size:.76rem;line-height:1.8}
.sec{margin-top:1.3rem;padding-top:.95rem;border-top:1px solid var(--line)}
.sec h3{margin:0 0 .6rem;font-size:.72rem;letter-spacing:.11em;color:var(--faint);font-weight:400}
.item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:start;gap:0 .7rem;
  width:100%;text-align:left;background:#FFFFFF;border:1px solid transparent;
  border-radius:8px;padding:.65rem .8rem;margin-bottom:.4rem;transition:.2s}
.item:hover{border-color:var(--line)}
.item::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);
  display:block;margin-top:.45rem}
.item::after{content:"\203A";font-family:var(--latin);font-size:1.05rem;line-height:1;
  color:var(--faint);align-self:center}
.item:hover::after{color:var(--gold)}
.item .zh{font-weight:500;font-size:.88rem}
.item .lat{display:block;font-family:var(--latin);font-style:italic;font-size:.74rem;
  letter-spacing:.09em;color:var(--muted);margin-top:.08rem}
.item .sub{display:block;font-size:.72rem;color:var(--faint);margin-top:.2rem}
.item .n{font-size:.74rem;color:var(--faint);align-self:center;white-space:nowrap}
/* 親緣：磚紅＝同種，藍綠＝同屬 */
.sec.kin{margin-top:1.1rem;padding:.8rem .8rem .45rem;border-top:0;border-radius:10px;
  background:color-mix(in srgb,var(--mat) 8%,transparent);
  border:1px solid color-mix(in srgb,var(--mat) 20%,transparent)}
.sec.kin.same{background:color-mix(in srgb,var(--red) 7%,transparent);
  border-color:color-mix(in srgb,var(--red) 22%,transparent)}
.sec.kin h3{display:inline-flex;margin:0 0 .6rem;background:var(--mat);color:var(--cream);
  border-radius:999px;padding:.25rem .7rem;font-size:.68rem;letter-spacing:.1em;font-weight:500}
.sec.kin.same h3{background:var(--red)}
.sec.kin .item::before{background:var(--mat)}
.sec.kin.same .item::before{background:var(--red)}
.sec.kin .item:hover{border-color:var(--mat)}
.sec.kin.same .item:hover{border-color:var(--red)}
.go{display:inline-flex;align-items:center;gap:.4rem;font-size:.76rem;letter-spacing:.06em;
  color:var(--gold);text-decoration:none;border-bottom:1px solid transparent;margin-right:1rem}
.go:hover{border-bottom-color:var(--gold)}
.back{font-size:.72rem;letter-spacing:.08em;color:var(--muted);margin-bottom:.8rem;
  display:inline-flex;gap:.4rem;align-items:center}
.back:hover{color:var(--gold)}

.sorry{position:fixed;inset:0;z-index:9;display:none;place-items:center;
  background:var(--cream);padding:2rem}
.sorry-box{max-width:30rem;text-align:left}
.sorry-box h2{font-family:var(--serif);font-weight:400;letter-spacing:.1em;margin:0 0 .8rem}
.sorry-box p{font-family:var(--sans);font-size:.82rem;line-height:2;color:var(--muted)}
.sorry-box a{font-family:var(--sans);font-size:.8rem;color:var(--gold);text-decoration:none;
  border-bottom:1px solid var(--gold)}

@media (max-width:760px){
  .brand{padding:1rem 1.1rem} .brand h1{font-size:1.25rem}
  .tools{padding:1rem 1.1rem}
  .views{top:auto;bottom:3.1rem;font-size:.7rem}
  .card{right:0;left:0;bottom:0;top:auto;transform:none;width:100%;
    max-height:62dvh;border-radius:14px 14px 0 0}
  .hint{display:none}
}
@media (max-width:560px){
  .brand h1{font-size:1.08rem} .brand .sub{font-size:.66rem}
  .tool,.seg button{font-size:.66rem;padding:.28rem .5rem}
  .views{font-size:.66rem;bottom:2.6rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="scene"></div>
<div id="tags"></div>

<div class="over brand">
  <span class="mk">Dhyana</span>
  <h1>香氣島群</h1>

</div>

<nav class="over views">

<div class="over tools">

    <button id="m-dusk" aria-pressed="false" title="黃昏" aria-label="黃昏"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18"/><path d="M7 17a5 5 0 0 1 10 0"/><path d="M12 6v3M5.6 10.6l1.6 1.6M18.4 10.6l-1.6 1.6M3.5 13.8h1.8M18.7 13.8h1.8"/><path d="M10 19l2 2 2-2"/></svg></button>

  </div>
</div>

<div class="over hint">拖曳轉動　捲動縮放　點光點看它是什麼</div>

<article class="card" id="card" hidden aria-live="polite">
  <div class="card-h">
    <button class="card-x" id="card-x" aria-label="關閉">&#10005;</button>
    <div class="eyebrow" id="c-eyebrow"></div>
    <h2 id="c-title"></h2>
    <span class="lat" id="c-lat"></span>
    <div class="where" id="c-where"></div>
  </div>
  <div class="card-b" id="c-body"></div>
</article>

<div class="sorry" id="sorry">
  <div class="sorry-box">
    <h2>這一頁需要 WebGL</h2>
    <p id="sorry-why"></p>
    <p><a href="index.html">改看香氣地圖 &#8594;</a>　那一頁是純 SVG 畫的，哪裡都打得開。</p>
  </div>
</div>

/* ── 資料 ───────────────────────────────────────────────
   一座島＝植物的一個部位。這一頁刻意不管地理——地理在
   香氣地圖那一邊，這裡講的是香氣本身怎麼分家。        */
const byOrigin = {};
DATA.origins.forEach(o => byOrigin[o.id] = o);
const ITEMS = DATA.items;
const txt = f => (f && (f.zh || f.en)) || '';
const originOf = it => (it.originIds || []).map(id => byOrigin[id]).filter(Boolean)[0] || null;
const low = x => x.confidence === 'low';

/* 同屬／同種：直接從學名拆 */
function binomial(lat){
  if (!lat) return ['', ''];
  const w = lat.replace(/^×\s*/, '').split(/\s+/);
  const g = w[0] || '';
  let s = w[1] || '';
  if (s === '×' || s === 'x') s = w[2] || '';
  if (/^(sp\.|spp\.|sp)$/i.test(s)) s = '';
  return [g, s];
}
const byGenus = {}, bySpecies = {};
ITEMS.forEach(it => {
  const [g, s] = binomial(it.latin);
  it.__g = g; it.__s = s;
  if (g){ (byGenus[g] = byGenus[g] || []).push(it);
    if (s) (bySpecies[g + ' ' + s] = bySpecies[g + ' ' + s] || []).push(it); }
});

/* 九座島。島本身的撰寫——名字、副標、導言、引言、配色、島上
   長什麼樹、擺什麼小東西——全部在 oils.json 的 isles 裡，一筆
   一座島，順序就是排列順序。這一頁只負責畫，不存內容。

   底是萃取部位，但「辛香」與「苔泥」是跨部位的香調（丁香長在
   花上、肉桂是樹皮、薑在根裡），跨出去的那幾支在品項上用 isle
   欄位指定，改 oils.json 就好。 */
const hex = s => parseInt(String(s).replace('#', ''), 16);
const isleOf = it => it.isle || (it.part === 'root' ? 'earth' : it.part);
const ISLES = DATA.isles.map(s => ({
  part: s.key, zh: s.zh, en: s.en, sub: s.sub, lead: s.lead, quote: s.quote, no: s.no,
  arch: s.arch, folk: s.folk, field: s.field, scene: s.scene,
  top: hex(s.top), side: hex(s.side), tree: s.tree, deco: s.deco,
  items: ITEMS.filter(it => isleOf(it) === s.key)
})).filter(i => i.items.length);

/* 編號照 oils.json 裡寫的走，和排列順序無關 */
ISLES.forEach((i, k) => { i.no = i.no || k + 1; });
/* 編號在島內各自從 01 起算，和 PUMA 一樣 */
ISLES.forEach(i => i.items.forEach((it, k) => it.__no = k + 1));

document.getElementById('sub').textContent =
  `${ISLES.length} 座島 ・ ${ITEMS.length} 種香氣 ・ 不照地理，照香氣分家`;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xDCE4CC);
scene.fog = new THREE.Fog(0xDCE4CC, 90, 260);
/* 窄角透視（28°）。等角投影從上往下看，地景怎麼做都是平的，看不到
   遠山、天空與地平線。PUMA 是透視、低角度看過去，才有火山口湖的縱深。
   視角夠窄，拉近到單一座島時仍接近等角的模型感。 */
const FOV = 28;
const camera = new THREE.PerspectiveCamera(FOV, innerWidth / innerHeight, 0.5, 1600);
const world = new THREE.Group();
scene.add(world);

/* 兩色相混，用來調同一座島的深淺草皮 */
function mix(a, b, k){
  const c = new THREE.Color(a).lerp(new THREE.Color(b), k);
  return c.getHex();
}
const matCache = {};
function mat(c, o){
  const k = c + ':' + JSON.stringify(o || 0);
  if (matCache[k]) return matCache[k];
  return matCache[k] = new THREE.MeshPhongMaterial(
    Object.assign({color:c, flatShading:true, shininess:0, specular:0x000000}, o || {}));
}

const hemi = new THREE.HemisphereLight(0xDCEEF4, 0x9C8E74, 0.62);
const sun = new THREE.DirectionalLight(0xFFF4E2, 0.92);
sun.position.set(34, 52, 24);
sun.castShadow = true;
sun.shadow.bias = -0.0009; sun.shadow.normalBias = 0.04;
sun.shadow.mapSize.set(4096, 4096);
const sc = sun.shadow.camera;
sc.left = -130; sc.right = 130; sc.top = 130; sc.bottom = -130; sc.near = 1; sc.far = 320;
const amb = new THREE.AmbientLight(0xFFFFFF, 0.14);
scene.add(hemi, sun, amb);

/* r134 的 UMD 版沒有 mergeBufferGeometries，自己接一個。
   細桿一座島好幾十根，不合併光 draw call 就撐不住。 */
function mergeGeos(list){
  let n = 0;
  list.forEach(g => n += g.attributes.position.count);
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
  let o = 0;
  list.forEach(g => {
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    o += g.attributes.position.count;
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  return out;
}

/* ── 地盤 ───────────────────────────────────────────────
   六角格整個砍掉。第一層維持九個大六角盤（選單），第二層走
   等角投影的分層岩盤：land 是一疊不同顏色的厚板，像地質剖面。
   人走的路改成一條事先算好的封閉折線，不需要格子也不會爬山。 */
function hexShape(r){
  const s = new THREE.Shape();
  for (let i = 0; i < 6; i++){
    const a = Math.PI / 6 + i * Math.PI / 3;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    i ? s.lineTo(x, z) : s.moveTo(x, z);
  }
  s.closePath(); return s;
}
/* 不規則的岩盤：以 r 為基準，每個角抖一下，轉角再圓一點 */
function blobShape(r, n, wob, rnd){
  const pts = [];
  for (let i = 0; i < n; i++){
    const a = i / n * Math.PI * 2;
    const rr = r * (1 - wob + rnd() * wob * 2);
    pts.push(new THREE.Vector2(Math.cos(a) * rr, Math.sin(a) * rr));
  }
  const s = new THREE.Shape();
  s.moveTo(pts[0].x, pts[0].y);
  for (let i = 0; i < n; i++){
    const a = pts[i], b = pts[(i + 1) % n], c = pts[(i + 2) % n];
    s.quadraticCurveTo(b.x, b.y, (b.x + c.x) / 2, (b.y + c.y) / 2);
  }
  s.closePath(); return s;
}
/* 一片厚板：上面一個面、側面一圈，分開上色才有剖面感 */
function slab(shape, h, topC, sideC, y){
  const g = new THREE.Group();
  const geo = new THREE.ExtrudeGeometry(shape, {depth:h, bevelEnabled:false});
  geo.rotateX(Math.PI / 2);
  const m = new THREE.Mesh(geo, [mat(topC), mat(sideC)]);
  /* ExtrudeGeometry 的群組 0 是上下面、1 是側面 */
  m.castShadow = true; m.receiveShadow = true;
  m.position.y = (y || 0) + h;
  g.add(m);
  return g;
}

/* ── 島上的東西 ──────────────────────────────────────
   尺度照深根大地那一頁：島半徑 9.4、房子 3.4 寬、樹 3 高。
   我原本的房子只有 0.72、樹 0.8，整座島看起來就像撒了一地
   碎屑——那才是「太版」真正的原因。             */
const mesh = (geo, c, x, y, z, o) => {
  const m = new THREE.Mesh(geo, mat(c, o));
  m.position.set(x || 0, y || 0, z || 0);
  m.castShadow = true; m.receiveShadow = true;
  return m;
};
const box  = (w,h,d,c,x,y,z,o) => mesh(new THREE.BoxGeometry(w,h,d), c,x,y,z,o);
const cyl  = (rt,rb,h,s,c,x,y,z,o) => mesh(new THREE.CylinderGeometry(rt,rb,h,s), c,x,y,z,o);
const cone = (r,h,s,c,x,y,z,o) => mesh(new THREE.ConeGeometry(r,h,s), c,x,y,z,o);
const ball = (r,c,x,y,z,o) => mesh(new THREE.SphereGeometry(r,10,8), c,x,y,z,o);

const WIN = [];                                   // 入夜會亮的窗

/* 各島的房子長得不一樣——風情是從建築開始的。
   可愛的作法是有規矩的，不是把東西縮小：
     圓多過方   門是半圓拱、窗是圓的、屋角用球收
     頭重腳輕   屋頂比屋身還高，而且大大地出簷
     矮而寬     屋身壓扁，不照真實比例
   寫實的比例看起來就是生硬，親民感是從誇張來的。 */
function building(arch, roof){
  const g = new THREE.Group();
  const W = 0xFBF4E6, S = 0xE2D8C4, WOOD = 0xC2956A, DARK = 0xAD9A82;
  /* 圓拱門：半圓頂加一段方身，比長方形的門可愛得多 */
  const door = (c, x, y, z, w) => {
    const r = (w || 0.46);
    g.add(box(r * 2, 0.75, 0.18, c, x, y + 0.37, z));
    g.add(cyl(r, r, 0.18, 10, c, x, y + 0.75, z).rotateX(Math.PI / 2));
  };
  const roundWin = (x, y, z, r) => {
    const m = cyl(r || 0.3, r || 0.3, 0.14, 10, 0x4E6A78, x, y, z);
    m.rotation.x = Math.PI / 2;
    WIN.push(m); g.add(m);
    g.add(new THREE.Mesh(new THREE.TorusGeometry((r || 0.3) + 0.07, 0.07, 5, 10),
      mat(W)).translateX(x).translateY(y).translateZ(z + 0.02));
  };
  const chimney = (x, z, y, c) => {
    g.add(box(0.46, 1.1, 0.46, c || W, x, y, z));
    g.add(ball(0.3, c || W, x, y + 0.6, z));
  };

  if (arch === 'dome'){                           // 中東／印度：胖圓頂
    g.add(cyl(1.85, 2.0, 1.5, 8, S, 0, 0.75, 0));
    const dome = new THREE.Mesh(new THREE.SphereGeometry(1.95, 14, 8,
      0, Math.PI * 2, 0, Math.PI * 0.56), mat(roof));
    dome.position.y = 1.5; dome.castShadow = true; g.add(dome);
    g.add(ball(0.34, roof, 0, 3.4, 0));
    g.add(cone(0.26, 0.7, 7, roof, 0, 3.85, 0));
    door(mix(S, 0x000000, 0.16), 0, 0, 1.92, 0.5);
    roundWin(-1.25, 1.0, 1.5, 0.26);
    roundWin(1.25, 1.0, 1.5, 0.26);
  } else if (arch === 'cabin'){                   // 北美林場：圓木屋
    [0.45, 1.1, 1.75].forEach(y =>
      g.add(cyl(0.36, 0.36, 3.4, 10, WOOD, 0, y, 0).rotateZ(Math.PI / 2)));
    g.add(cyl(0.36, 0.36, 2.6, 10, mix(WOOD, 0x000000, 0.1), -1.6, 1.1, 0).rotateX(Math.PI / 2));
    g.add(cyl(0.36, 0.36, 2.6, 10, mix(WOOD, 0x000000, 0.1), 1.6, 1.1, 0).rotateX(Math.PI / 2));
    g.add(cone(2.9, 2.0, 6, roof, 0, 3.1, 0));
    g.add(ball(0.26, roof, 0, 4.1, 0));
    chimney(-1.3, -0.8, 2.9, S);
    door(WOOD, 0, 0, 1.38, 0.46);
    roundWin(1.1, 1.3, 1.38, 0.26);
  } else if (arch === 'tent'){                    // 乾燥山地：圓帳篷
    g.add(cyl(2.3, 2.5, 0.9, 10, mix(roof, 0xFFFFFF, 0.1), 0, 0.45, 0));
    g.add(cone(2.6, 2.4, 10, roof, 0, 2.1, 0));
    g.add(ball(0.3, mix(roof, 0x000000, 0.2), 0, 3.4, 0));
    door(mix(roof, 0x000000, 0.3), 0, 0, 2.45, 0.46);
    g.add(cyl(0.5, 0.58, 0.8, 10, 0xC79A6E, 2.3, 0.4, 1.3));
    g.add(ball(0.3, 0xE6C79C, 2.3, 0.9, 1.3));
  } else if (arch === 'stone'){                   // 普羅旺斯：圓角石屋
    g.add(cyl(1.7, 1.8, 1.5, 8, S, 0, 0.75, 0));
    g.add(cone(2.3, 1.9, 8, roof, 0, 2.3, 0));
    g.add(ball(0.24, roof, 0, 3.3, 0));
    chimney(1.0, -0.7, 2.3, S);
    door(WOOD, 0, 0, 1.72, 0.44);
    roundWin(-1.1, 1.0, 1.4, 0.26);
  } else if (arch === 'barn'){                    // 果園：胖穀倉
    g.add(cyl(1.8, 1.95, 1.4, 8, roof, 0, 0.7, 0));
    g.add(cone(2.5, 2.0, 8, mix(roof, 0x000000, 0.22), 0, 2.3, 0));
    g.add(ball(0.26, W, 0, 3.4, 0));
    door(W, 0, 0, 1.88, 0.56);
    roundWin(-1.2, 1.05, 1.45, 0.24);
    roundWin(1.2, 1.05, 1.45, 0.24);
  } else if (arch === 'shed'){                    // 蒸餾小屋：圓屋＋銅釜
    g.add(cyl(1.6, 1.7, 1.4, 8, W, 0, 0.7, 0));
    g.add(cone(2.2, 1.7, 8, roof, 0, 2.15, 0));
    g.add(ball(0.24, roof, 0, 3.05, 0));
    chimney(-1.0, -0.6, 2.2, W);
    door(WOOD, 0, 0, 1.62, 0.44);
    g.add(cyl(0.78, 0.92, 1.3, 12, 0xD0995A, 2.6, 0.65, 0.6));
    g.add(ball(0.78, 0xD0995A, 2.6, 1.5, 0.6));
    g.add(cyl(1.0, 1.06, 0.3, 12, 0xB3A68E, 2.6, 0.15, 0.6));
  } else {                                        // cottage：保加利亞白牆紅瓦
    g.add(cyl(1.7, 1.85, 1.4, 8, W, 0, 0.7, 0));
    g.add(cone(2.4, 2.0, 8, roof, 0, 2.3, 0));
    g.add(ball(0.26, roof, 0, 3.4, 0));
    chimney(1.0, -0.7, 2.3, W);
    door(WOOD, 0, 0, 1.78, 0.46);
    roundWin(-1.15, 1.0, 1.45, 0.26);
    roundWin(1.15, 1.0, 1.45, 0.26);
  }
  return g;
}

/* 各島的田／場。一樣的規矩：少數幾塊、每塊都大 */
function fieldOf(kind, c1, c2){
  const g = new THREE.Group();
  const SOIL = 0xA8855E, WOOD = 0xC9A97E;
  if (kind === 'rosebed'){                        // 玫瑰田：三道壟
    for (let i = 0; i < 3; i++){
      g.add(box(0.9, 0.3, 3.4, SOIL, (i - 1) * 1.15, 0.15, 0));
      for (let k = 0; k < 3; k++)
        g.add(ball(0.42, k % 2 ? c1 : 0xE9BFC9, (i - 1) * 1.15, 0.6, (k - 1) * 1.05));
    }
  } else if (kind === 'lavrow'){                  // 薰衣草壟
    for (let i = 0; i < 3; i++){
      g.add(box(0.85, 0.24, 3.2, SOIL, (i - 1) * 1.15, 0.12, 0));
      for (let k = 0; k < 3; k++)
        g.add(cone(0.4, 1.0, 6, k % 2 ? 0x9B8EC4 : 0x8878B4,
                   (i - 1) * 1.15, 0.72, (k - 1) * 1.0));
    }
  } else if (kind === 'teabush'){                 // 茶樹灌木列
    for (let i = 0; i < 3; i++)
      for (let k = 0; k < 3; k++)
        g.add(ball(0.62, (i + k) % 2 ? c1 : c2, (i - 1) * 1.45, 0.45, (k - 1) * 1.45));
  } else if (kind === 'orchard'){                 // 果園：粗梯子與大果籃
    g.add(box(0.16, 3.2, 0.16, WOOD, -0.45, 1.6, 0).rotateZ(0.2));
    g.add(box(0.16, 3.2, 0.16, WOOD, 0.45, 1.6, 0).rotateZ(0.2));
    [0.7, 1.6, 2.5].forEach(y => g.add(box(1.1, 0.14, 0.14, WOOD, -y * 0.2 + 0.3, y, 0)));
    g.add(cyl(0.62, 0.5, 0.75, 10, WOOD, 1.7, 0.38, 0.8));
    g.add(ball(0.28, 0xE6B45C, 1.6, 0.85, 0.75));
    g.add(ball(0.26, 0xE6B45C, 1.85, 0.82, 0.95));
  } else if (kind === 'logyard'){                 // 伐木場：粗原木與鋸木架
    [[-0.55, 0.32], [0.55, 0.32], [0, 0.95]].forEach(([x, y]) =>
      g.add(cyl(0.34, 0.34, 3.0, 8, 0xB08A5E, x, y, 0).rotateX(Math.PI / 2)));
    g.add(box(0.2, 1.3, 0.2, WOOD, 1.7, 0.65, -0.5).rotateZ(0.42));
    g.add(box(0.2, 1.3, 0.2, WOOD, 2.3, 0.65, -0.5).rotateZ(-0.42));
    g.add(cyl(0.3, 0.3, 2.0, 8, 0xC2A47E, 2.0, 1.15, -0.5).rotateZ(Math.PI / 2));
  } else if (kind === 'spicemat'){                // 香料攤：三塊布、三堆香料、一頂棚
    [[-1.3, 0, 0xC75B39], [0, 0.4, 0xE0A23C], [1.3, 0, 0x8E6B3A]]
      .forEach(([x, z, c]) => {
        g.add(box(1.2, 0.12, 1.2, 0xEFE3CC, x, 0.06, z));
        g.add(cone(0.48, 0.45, 9, c, x, 0.34, z));
      });
    g.add(box(0.2, 2.4, 0.2, WOOD, -1.8, 1.2, -1.2));
    g.add(box(0.2, 2.4, 0.2, WOOD, 1.8, 1.2, -1.2));
    g.add(box(4.0, 0.16, 1.6, 0xC75B39, 0, 2.3, -0.7).rotateX(0.18));
  } else if (kind === 'dryrack'){                 // 曬籽架
    g.add(box(3.0, 0.16, 2.0, WOOD, 0, 1.2, 0));
    [[-1.3, -0.8], [1.3, -0.8], [-1.3, 0.8], [1.3, 0.8]]
      .forEach(([x, z]) => g.add(box(0.2, 1.2, 0.2, WOOD, x, 0.6, z)));
    [[-0.8, -0.4, 0x8E6B3A], [0.2, 0.3, 0xC9A05C], [1.0, -0.3, 0x9C7A4A]]
      .forEach(([x, z, c]) => g.add(cone(0.42, 0.4, 9, c, x, 1.46, z)));
  } else if (kind === 'resintap'){                // 割脂：粗樹幹、刀痕、大陶罐
    g.add(cyl(0.6, 0.8, 3.2, 8, 0xA8835C, 0, 1.6, 0));
    [1.0, 1.7, 2.4].forEach(y => g.add(box(1.1, 0.16, 0.2, 0xE8D9B8, 0, y, 0.6)));
    g.add(cyl(0.52, 0.62, 0.9, 10, 0xB98A5E, 1.3, 0.45, 0.9));
    g.add(cyl(0.46, 0.56, 0.8, 10, 0xB98A5E, -1.2, 0.4, 0.8));
    g.add(ball(0.38, 0xE6C79C, 1.3, 1.0, 0.9));
  } else {                                        // rootpit：土坑與根堆
    g.add(cyl(1.5, 1.2, 0.5, 10, 0x8E7254, 0, -0.15, 0));
    g.add(cyl(0.16, 0.24, 1.3, 6, 0xC2A47E, -0.3, 0.5, 0.2).rotateZ(-0.4));
    g.add(cyl(0.16, 0.24, 1.3, 6, 0xC2A47E, 0.35, 0.5, -0.2).rotateZ(0.5));
    g.add(ball(0.75, 0x9C7F62, 1.9, 0.4, 0.5));
    g.add(cyl(0.6, 0.72, 0.8, 10, 0xB98A5E, -1.9, 0.4, 0.6));
  }
  return g;
}

/* 樹：照深根大地的比例，三種輪廓隨機 */
/* 樹：參考圖的林子是成叢、高低不一的針葉，不是一棵棵等距的
   棒棒糖。針葉改成三段窄錐疊起來、梢頭收尖；闊葉用兩三顆大小
   不一的球偏心疊，不再是正中央一顆。 */
function bigTree(kind, c1, c2, rnd){
  const g = new THREE.Group();
  const tall = 0.8 + rnd() * 0.9;                 // 每棵高矮都不一樣
  if (kind === 'conifer'){
    g.add(cyl(0.11, 0.16, 0.5 * tall, 6, 0x7A5C3E, 0, 0.25 * tall, 0));
    const h0 = 1.5 * tall;
    g.add(cone(0.72, h0, 7, c1, 0, 0.42 * tall + h0 / 2, 0));
    g.add(cone(0.54, h0 * 0.78, 7, mix(c1, 0x000000, 0.08),
               0, 0.42 * tall + h0 * 0.92, 0));
    g.add(cone(0.34, h0 * 0.6, 7, mix(c1, 0xFFFFFF, 0.06),
               0, 0.42 * tall + h0 * 1.42, 0));
    g.rotation.y = rnd() * 6.28;
    return g;
  }
  g.add(cyl(0.2, 0.26, 0.7 * tall, 7, 0x9A7450, 0, 0.35 * tall, 0));
  if (kind === 'bare'){
    g.add(cyl(0.2, 0.26, 1.5, 7, 0xB08A5E, 0, 1.3, 0));
    g.add(ball(0.34, mix(c1, 0xFFFFFF, 0.2), -0.55, 2.0, 0.1));
    g.add(ball(0.34, mix(c1, 0xFFFFFF, 0.2), 0.55, 2.2, -0.1));
    g.add(ball(0.4, c1, 0, 2.5, 0));
  } else {
    /* 闊葉：三顆大小不一的球偏心疊，每顆都偏一點，看起來才像長的 */
    const fruit = kind === 'fruit', bloss = kind === 'blossom';
    const r1 = (0.78 + rnd() * 0.3) * tall;
    const a1 = rnd() * 6.28, a2 = a1 + 2.1 + rnd();
    g.add(ball(r1, c1, Math.cos(a1) * 0.16, 0.7 * tall + r1 * 0.7, Math.sin(a1) * 0.16));
    g.add(ball(r1 * 0.66, bloss ? mix(c2, 0xFFFFFF, 0.3) : c2,
               Math.cos(a2) * r1 * 0.62, 0.7 * tall + r1 * 1.15, Math.sin(a2) * r1 * 0.62));
    g.add(ball(r1 * 0.46, mix(c1, 0x000000, 0.08),
               Math.cos(a1 + 3.3) * r1 * 0.6, 0.7 * tall + r1 * 0.5,
               Math.sin(a1 + 3.3) * r1 * 0.6));
    if (fruit)
      for (let i = 0; i < 3; i++)
        g.add(ball(0.17, 0xE6B45C, Math.cos(i * 2.1) * r1 * 0.72,
                   0.7 * tall + r1 * 0.6, Math.sin(i * 2.1) * r1 * 0.72));
  }
  g.rotation.y = rnd() * 6.28;
  return g;
}
function bigBush(c1, c2){
  const g = new THREE.Group();
  g.add(ball(0.55, c1, 0, 0.38, 0));
  g.add(ball(0.38, c2, 0.38, 0.28, 0.18));
  g.add(ball(0.3, c1, -0.3, 0.25, -0.2));
  return g;
}

/* ── 人偶 ───────────────────────────────────────────── */
const SHIRTS = [0xD9663F, 0xF2C14E, 0x5C8FB8, 0xFBF3E2, 0x7FAE66, 0xB8965A];

/* 人偶：尺寸也照深根大地（約 1.15 高），而且各島穿得不一樣——
   風情不只在建築上，在人身上更明顯。 */
function doll(shirt, style){
  const g = new THREE.Group();
  const skin = 0xE8B98E, hair = 0x3A2E28;
  const robe = style === 'spicemerchant' || style === 'tapper' ||
               style === 'muslim_m' || style === 'muslim_f';
  const skirt = style === 'rosemaid';
  const body = robe
    ? cyl(0.17, 0.26, 0.56, 8, shirt, 0, 0.69, 0)
    : (skirt ? cyl(0.16, 0.27, 0.5, 8, shirt, 0, 0.66, 0)
             : cyl(0.17, 0.135, 0.42, 7, shirt, 0, 0.62, 0));
  g.add(body);
  g.add(ball(0.27, skin, 0, 0.97, 0));
  const hd = ball(0.285, hair, 0, 1.01, -0.03); g.add(hd);

  if (style === 'muslim_m'){                       // 回教族男子：白頭巾＋黑頭箍
    const kf = ball(0.3, 0xF4EFE4, 0, 1.03, -0.02); kf.scale.set(1, 0.92, 1.1); g.add(kf);
    g.add(box(0.36, 0.42, 0.06, 0xF4EFE4, 0, 0.82, -0.24).rotateX(-0.18));
    g.add(new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.04, 5, 14), mat(0x2E2A26))
      .rotateX(Math.PI / 2).translateZ(-1.17));
  } else if (style === 'muslim_f'){                // 回教族女子：深色頭巾包到肩
    const hj = ball(0.31, shirt, 0, 1.0, -0.03); hj.scale.set(1, 1.02, 1.1); g.add(hj);
    g.add(cyl(0.2, 0.3, 0.32, 9, shirt, 0, 0.8, -0.03));
  } else if (style === 'rosemaid'){                       // 保加利亞仕女：頭巾＋花籃
    const sc = ball(0.225, 0xD96A7A, 0, 1.02, -0.01); g.add(sc);
    sc.scale.set(1, 0.86, 1);
    g.add(box(0.1, 0.3, 0.04, 0xD96A7A, 0, 0.86, -0.2).rotateX(-0.3));
    const bk = cyl(0.14, 0.11, 0.18, 8, 0xC9A97E, 0.26, 0.62, 0.1); g.add(bk);
    g.add(ball(0.06, 0xE9BFC9, 0.26, 0.73, 0.1));
  } else if (style === 'chopper'){                 // 劈柴的伐木工：只戴帽，斧頭另外裝
    g.add(cyl(0.21, 0.21, 0.14, 8, 0xC75B39, 0, 1.14, 0));

  const legM = mat(0x4A5560), shoeM = mat(0x3A2E28);

      const dx = b.x - a.x, dz = b.z - a.z;
      const d = Math.hypot(dx, dz) || 0.01;
      const need = a.R + b.R + 1.2;
      if (d < need){
        const pp = (need - d) / 2 / d;
        a.x -= dx * pp; a.z -= dz * pp;
        b.x += dx * pp; b.z += dz * pp;
      }

/* ── 蓋島 ───────────────────────────────────────────────
   第一層：九個大六角盤，側面疊三層顏色像地質剖面。
   第二層：瑞典分層岩盤的作法——盤上再疊幾片不規則厚板，每片
   看得到自己的剖面色層，上面只擺老闆清單上的元素，不自己加。
   還沒拿到清單的島，就只留岩盤。                              */
const pins = [], folk = [], choppers = [];

/* 先定人走的路，再擺東西：凡是壓到路的，沿離路心的方向往外推，
   推到和路至少隔開「自身半徑＋0.6」。凝脂島的作法，抽出來給各島用。 */
function makePlanner(cx, cz, rx, rz){
  const LOOP = [];
  for (let i = 0; i < 32; i++){
    const a = i / 32 * 6.283;
    LOOP.push([cx + rx * Math.cos(a), cz + rz * Math.sin(a)]);
  }
  const toLoop = (x, z) => {
    let b = 1e9;
    for (let i = 0; i < LOOP.length; i++){
      const [ax, az] = LOOP[i], [bx, bz] = LOOP[(i + 1) % LOOP.length];
      const dx = bx - ax, dz = bz - az;
      const t2 = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz)));
      b = Math.min(b, Math.hypot(x - ax - dx * t2, z - az - dz * t2));
    }
    return b;
  };
  const OB = [];
  const keepOff = (x, z, rad) => {
    let ux = x - cx, uz = z - cz, l = Math.hypot(ux, uz) || 1;
    ux /= l; uz /= l;
    for (let k = 0; k < 80 && toLoop(x, z) < rad + 0.6; k++){ x += ux * 0.12; z += uz * 0.12; }
    OB.push({x, z, r:rad});
    return [x, z];
  };
  return {LOOP, OB, keepOff};
}

/* 各島的場景，只照老闆給的清單。沒有的就是還沒給。 */
const SCENE = {

  resin(g, near, top, rnd){
    const SAND = 0xE2BA72, SAND2 = 0xD6A85E, DUNE = 0xEACB8A;

    const yA = top.y + 0.7, yB = yA;

    /* 先決定人走的路，再擺東西。凡是壓到路的東西，沿著離路心的方向
       往外推，推到和路至少隔開「自身半徑＋0.6」為止——人才不會穿過
       帳篷、陶罐或樹。OB 記下每樣東西的位置與半徑，給驗證用。 */
    const LC = [top.r * 0.12, top.r * 0.12], LRX = top.r * 0.32, LRZ = top.r * 0.2;

    for (let i = 0; i < 32; i++){

    }
    const toLoop = (x, z) => {
      let b = 1e9;
      for (let i = 0; i < LOOP.length; i++){
        const [ax, az] = LOOP[i], [bx, bz] = LOOP[(i + 1) % LOOP.length];
        const dx = bx - ax, dz = bz - az;
        const t2 = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz)));
        b = Math.min(b, Math.hypot(x - ax - dx * t2, z - az - dz * t2));
      }
      return b;
    };
    const OB = [];
    const keepOff = (x, z, rad) => {
      let ux = x - LC[0], uz = z - LC[1], l = Math.hypot(ux, uz) || 1;

    const yard = slab(blobShape(top.r * 0.34, 10, 0.12, rnd), 0.05, 0xCFA061, 0xB98A50, yA);

    const trail = new THREE.Mesh(
      new THREE.RingGeometry(LRX - 0.45, LRX + 0.45, 40), mat(0xF0DAA2));

    /* 乳香樹：矮、樹幹粗而扭，分成幾支歪斜的枝，葉子稀疏成小團 */
    const frank = () => {
      const tg = new THREE.Group();
      tg.add(cyl(0.2, 0.32, 0.9, 7, 0xA8835C, 0, 0.45, 0));

    const myrrh = () => {

    const RX = 0.06, RZ = 0.62, RR = 0.18;

    [['muslim_m', 0xF4EFE4], ['muslim_f', 0x3E3A44]].forEach(([st, c], i) => {
      const d = doll(c, st);
      d.userData = {path:loop, t:i * 16, seg:loop[0].distanceTo(loop[1]),
                    sp:0.9 * (i ? -1 : 1), y:yA};
      world.add(d); folk.push(d);
    });
    [['muslim_m', 0xEFE6D2, 0.18, -0.05], ['muslim_f', 0x5A3E48, -0.05, -0.32],
     ['muslim_m', 0xF4EFE4, 0.4, 0.55]].forEach(([st, c, fx, fz]) => {
      const d = doll(c, st);
      const [sx, sz] = keepOff(fx * top.r, fz * top.r, 0.4);
      d.position.set(sx, yA, sz);
      d.rotation.y = rnd() * 6.28;
      near.add(d);
    });
    g.__ob = OB; g.__loop = LOOP;
  },

  /* 木禪島：北山針葉林、南美高地、亞馬遜雨林三片林；伐木廠、
     戶外蒸餾釜、一間小木屋（老闆的清單）。伐木工兩人。 */
  wood(g, near, top, rnd){
    const R = top.r, yA = top.y + 0.6;
    g.add(slab(blobShape(R * 0.88, 13, 0.1, rnd), 0.6, 0xA9B887, 0x8A6E4E, top.y));
    const pl = makePlanner(R * 0.04, R * 0.1, R * 0.27, R * 0.17);
    const {LOOP, OB, keepOff} = pl;

    /* 林地上的小徑 */
    const trail = new THREE.Mesh(new THREE.RingGeometry(R * 0.27 - 0.42, R * 0.27 + 0.42, 40),
      mat(0xD9C79A));
    trail.rotation.x = -Math.PI / 2; trail.scale.set(1, 0.17 / 0.27, 1);
    trail.position.set(R * 0.04, yA + 0.03, R * 0.1); trail.receiveShadow = true;
    near.add(trail);

    /* 三片林各是一個墊高的區（和凝脂島的植栽台同一套） */
    const zone = (fx, fz, fr, topC, sideC) => {
      const [x, z] = keepOff(fx * R, fz * R, fr * R);
      const s3 = slab(blobShape(fr * R, 11, 0.1, rnd), 0.45, topC, sideC, yA);
      s3.position.set(x, 0, z); near.add(s3);
      return {x, z, r:fr * R, y:yA + 0.45};
    };
    const ZC = zone(-0.44, -0.4, 0.27, 0x6E8E5C, 0x6B5A44);    // 北山針葉林
    const ZA = zone(0.52, -0.44, 0.16, 0xB6A98C, 0x8E8070);    // 南美高地
    const ZM = zone(0.5, 0.38, 0.21, 0x5E8F5A, 0x7A6248);      // 雨林（亞馬遜＋亞洲檀香沉香）
    const ZS = zone(0.68, -0.02, 0.14, 0xD1A36E, 0x9E6A44);    // 半沙漠
    const ZH = zone(-0.72, -0.02, 0.11, 0x8FAE74, 0x8A7A62);   // 海地山地
    const [lx, lz] = keepOff(-0.08 * R, 0.4 * R, 0.08 * R);
    const ZL = {x:lx, z:lz, r:0.08 * R, y:yA};                 // 低海拔：不墊高，就長在林地上

    /* 北山針葉林：筆直細高、層層收尖的杉檜；邊上幾棵白樺 */
    const sugi = h => {
      const tg = new THREE.Group();
      tg.add(cyl(0.12, 0.16, h * 0.35, 6, 0x7A5A3C, 0, h * 0.175, 0));
      for (let k = 0; k < 4; k++){
        const rr2 = 0.75 - k * 0.15, hh = h * 0.3;
        tg.add(cone(rr2, hh, 7, k % 2 ? 0x3F6B4A : 0x4A7A52, 0, h * 0.32 + k * h * 0.17 + hh / 2, 0));
      }
      return tg;
    };
    const birch = () => {
      const tg = new THREE.Group();
      tg.add(cyl(0.1, 0.13, 2.2, 6, 0xF1ECE2, 0, 1.1, 0));
      [0.6, 1.1, 1.6].forEach(y => tg.add(box(0.27, 0.06, 0.27, 0x3A3530, 0, y, 0)));
      const c = ball(0.7, 0xC9B45C, 0, 2.5, 0); c.scale.set(0.9, 1.25, 0.9); tg.add(c);
      return tg;
    };
    for (let i = 0; i < 16; i++){
      const a = rnd() * 6.28, r2 = ZC.r * (0.1 + rnd() * 0.75);
      const tr = i < 13 ? sugi(3.0 + rnd() * 1.8) : birch();
      tr.position.set(ZC.x + Math.cos(a) * r2, ZC.y, ZC.z + Math.sin(a) * r2);
      tr.rotation.y = rnd() * 6.28; near.add(tr);
    }

    /* 南美高地：灰白岩塊，加幾棵灰幹扭曲的矮樹（聖木、癒創木那類乾地樹） */
    for (let i = 0; i < 4; i++){
      const a = i / 4 * 6.28 + 0.4, r2 = ZA.r * 0.6;
      const rk = ball(0.55 + rnd() * 0.3, 0xBDB6A8, ZA.x + Math.cos(a) * r2, ZA.y + 0.15,
                      ZA.z + Math.sin(a) * r2);
      rk.scale.y = 0.6; near.add(rk);
    }
    for (let i = 0; i < 3; i++){
      const a = i / 3 * 6.28, r2 = ZA.r * 0.3;
      const tg = new THREE.Group();
      tg.add(cyl(0.12, 0.18, 1.0, 6, 0x9A9488, 0, 0.5, 0));
      [-0.5, 0.5].forEach(rz => {
        const br = cyl(0.06, 0.09, 0.8, 5, 0x9A9488, rz * 0.4, 1.15, 0); br.rotation.z = rz; tg.add(br);
      });
      const c = ball(0.6, 0x9DAA6E, 0, 1.75, 0); c.scale.set(1.3, 0.55, 1.3); tg.add(c);
      tg.position.set(ZA.x + Math.cos(a) * r2, ZA.y, ZA.z + Math.sin(a) * r2);
      near.add(tg);
    }

    /* 亞馬遜雨林：板根高樹、兩層扁平樹冠、蕨葉 */
    [[0, 0, 2.8], [0.42, 0.25, 2.2], [-0.4, 0.3, 2.4]].forEach(([dx, dz, h]) => {
      const tg = new THREE.Group();
      tg.add(cone(0.6, 0.75, 6, 0x6E5A44, 0, 0.37, 0));
      tg.add(cyl(0.17, 0.23, h, 7, 0x7A6248, 0, h / 2, 0));
      const c1 = ball(1.0, 0x3F7A4A, 0, h + 0.2, 0); c1.scale.set(1.25, 0.5, 1.25);
      const c2 = ball(0.72, 0x4E8C52, 0.25, h + 0.65, -0.1); c2.scale.set(1.2, 0.5, 1.2);
      tg.add(c1, c2);
      tg.position.set(ZM.x + dx * ZM.r * 0.6, ZM.y, ZM.z + dz * ZM.r * 0.6);
      tg.rotation.y = rnd() * 6.28; near.add(tg);
    });

    /* 雨林多幾棵，裝得下十支 */
    [[0.55, -0.45, 2.3], [-0.55, -0.4, 2.0]].forEach(([dx, dz, h]) => {
      const tg = new THREE.Group();
      tg.add(cone(0.55, 0.7, 6, 0x6E5A44, 0, 0.35, 0));
      tg.add(cyl(0.16, 0.22, h, 7, 0x7A6248, 0, h / 2, 0));
      const c1 = ball(0.9, 0x3F7A4A, 0, h + 0.2, 0); c1.scale.set(1.25, 0.5, 1.25);
      tg.add(c1);
      tg.position.set(ZM.x + dx * ZM.r, ZM.y, ZM.z + dz * ZM.r);
      near.add(tg);
    });

    /* 半沙漠：紅土、細瘦的柏松（絲柏）、矮灌木（香積木）、草叢與紅石 */
    for (let i = 0; i < 4; i++){
      const a = i / 4 * 6.28 + 0.5, r2 = ZS.r * 0.45;
      const tg = new THREE.Group();
      tg.add(cyl(0.08, 0.11, 0.5, 5, 0x7A5A3C, 0, 0.25, 0));
      const c = cone(0.42, 2.0, 6, i % 2 ? 0x55704E : 0x627E58, 0, 1.4, 0); tg.add(c);
      tg.position.set(ZS.x + Math.cos(a) * r2, ZS.y, ZS.z + Math.sin(a) * r2);
      near.add(tg);
    }
    for (let i = 0; i < 6; i++){
      const a = rnd() * 6.28, r2 = ZS.r * (0.2 + rnd() * 0.65);
      near.add(cone(0.22, 0.35, 5, i % 2 ? 0xC9C07A : 0xB5AE6A,
        ZS.x + Math.cos(a) * r2, ZS.y + 0.17, ZS.z + Math.sin(a) * r2));
    }
    near.add(ball(0.45, 0x9AA87A, ZS.x, ZS.y + 0.3, ZS.z));             // 香積木灌叢
    { const rk = ball(0.4, 0xB86A48, ZS.x + ZS.r * 0.55, ZS.y + 0.12, ZS.z - ZS.r * 0.2);
      rk.scale.y = 0.6; near.add(rk); }

    /* 海地山地：海地就是「多山之地」——幾座陡峭小綠山，山腳的灌木 */
    [[0, 0, 2.2], [0.45, 0.3, 1.5], [-0.4, 0.35, 1.3]].forEach(([dx, dz, h]) =>
      near.add(cone(ZH.r * 0.55, h, 6, 0x6E9460, ZH.x + dx * ZH.r, ZH.y + h / 2, ZH.z + dz * ZH.r)));
    [[0.5, -0.4], [-0.5, -0.35]].forEach(([dx, dz]) =>
      near.add(ball(0.32, 0x5E8452, ZH.x + dx * ZH.r, ZH.y + 0.25, ZH.z + dz * ZH.r)));

    /* 低海拔：一棵大樟樹，圓而寬的淺綠樹冠，直接長在林地上 */
    {
      const tg = new THREE.Group();
      tg.add(cyl(0.22, 0.3, 1.2, 7, 0x7A5A3C, 0, 0.6, 0));
      const c1 = ball(1.15, 0x8DB86A, 0, 1.75, 0); c1.scale.set(1.3, 0.75, 1.3);
      const c2 = ball(0.8, 0x9CC478, 0.45, 2.15, 0.2); c2.scale.set(1.2, 0.7, 1.2);
      tg.add(c1, c2);
      tg.position.set(ZL.x, ZL.y, ZL.z);
      near.add(tg);
    }

    /* 伐木廠：開放式棚、圓鋸台、原木堆、一疊木板 */
    {
      const [x, z] = keepOff(-0.52 * R, 0.32 * R, 2.2);
      const mg = new THREE.Group();
      [[-1.4, -0.9], [1.4, -0.9], [-1.4, 0.9], [1.4, 0.9]].forEach(([px, pz]) =>
        mg.add(box(0.18, 2.0, 0.18, 0x8A6A4A, px, 1.0, pz)));
      mg.add(box(3.4, 0.14, 2.3, 0xA8553A, 0, 2.05, 0).rotateZ(0.12));
      mg.add(box(1.8, 0.7, 0.8, 0x9A7A56, 0, 0.35, 0));
      const blade = cyl(0.55, 0.55, 0.05, 16, 0xC9CED2, 0, 0.75, 0); blade.rotation.x = Math.PI / 2;
      mg.add(blade);
      [[-0.3, 0.32], [0.3, 0.32], [0, 0.88]].forEach(([lx, ly]) =>
        mg.add(cyl(0.32, 0.32, 2.6, 8, 0xB08A5E, lx, ly, 1.9).rotateZ(Math.PI / 2)));
      for (let k = 0; k < 4; k++) mg.add(box(1.8, 0.1, 0.5, 0xD9BC8A, -2.3, 0.07 + k * 0.11, 0.2));
      mg.position.set(x, yA, z); mg.rotation.y = 0.5; near.add(mg);
    }

    /* 戶外蒸餾釜：石座、銅釜、鵝頸管、冷凝桶 */
    {
      const [x, z] = keepOff(0.12 * R, 0.62 * R, 1.4);
      const sg = new THREE.Group();
      sg.add(cyl(1.0, 1.1, 0.5, 10, 0xA89C86, 0, 0.25, 0));
      sg.add(cyl(0.72, 0.82, 1.3, 14, 0xCE8B4A, 0, 1.15, 0));
      sg.add(ball(0.72, 0xCE8B4A, 0, 1.8, 0));
      const neck = cyl(0.09, 0.09, 1.4, 8, 0xCE8B4A, 0.55, 2.45, 0); neck.rotation.z = -1.0; sg.add(neck);
      sg.add(cyl(0.45, 0.45, 1.1, 12, 0x8A6A4A, 1.45, 0.55, 0));
      sg.position.set(x, yA, z); near.add(sg);
    }

    /* 一間小木屋 */
    {
      const [x, z] = keepOff(0.05 * R, -0.62 * R, 1.9);
      const cb = building('cabin', 0x8A5A3C);
      cb.position.set(x, yA, z); cb.rotation.y = 0.3; cb.scale.setScalar(0.72); near.add(cb);
    }

    /* 伐木工：一個沿小徑走，一個站在伐木廠旁 */
    const loop = LOOP.map(([x, z]) => new THREE.Vector3(g.position.x + x, yA, g.position.z + z));
    const w1 = doll(0xC75B39, 'logger');
    w1.userData = {path:loop, t:0, seg:loop[0].distanceTo(loop[1]), sp:0.9, y:yA};
    world.add(w1); folk.push(w1);
    {
      const [x, z] = keepOff(-0.27 * R, 0.52 * R, 0.4);
      /* 一直在劈柴：雙手握斧，斧頭裝在肩膀高度的轉軸上，舉起、劈下 */
      const w2 = doll(0x5C8FB8, 'chopper'); w2.position.set(x, yA, z); w2.rotation.y = 2.4;
      const arm = new THREE.Group();
      arm.position.set(0, 0.86, 0.08);
      arm.add(cyl(0.035, 0.035, 0.85, 6, 0xB08A5E, 0, 0.42, 0));
      arm.add(box(0.26, 0.16, 0.05, 0x9AA3AA, 0.1, 0.8, 0));
      w2.add(arm);
      choppers.push({body:w2, arm, ph:rnd() * 6});
      /* 前面一座木樁、一段待劈的原木、幾塊劈好的柴 */
      const fx = x + Math.sin(2.4) * 0.75, fz = z + Math.cos(2.4) * 0.75;
      near.add(cyl(0.34, 0.38, 0.4, 9, 0x9A7450, fx, yA + 0.2, fz));
      near.add(cyl(0.2, 0.2, 0.4, 8, 0xC9A06A, fx, yA + 0.6, fz));
      [[0.5, 0.2], [0.6, -0.15], [0.35, -0.3]].forEach(([dx, dz]) =>
        near.add(box(0.12, 0.1, 0.36, 0xC9A06A, fx + dx, yA + 0.05, fz + dz).rotateY(dx * 2)));
      near.add(w2);
    }

    g.__zones = {conifer:ZC, andes:ZA, amazon:ZM, semiarid:ZS, haiti:ZH, lowland:ZL};
    g.__ob = OB; g.__loop = LOOP;
  },

  /* 辛香島：印度・中東。圓頂建築與拱門、香料市集攤、曬香料的蓆、
     駱駝、纏頭巾的香料農與商人、黑胡椒＋丁香植栽台（老闆的清單）。
     多香果、馬告不是印度中東的香料，收在南側一角。 */
  spice(g, near, top, rnd){
    const R = top.r, yA = top.y + 0.6;
    g.add(slab(blobShape(R * 0.88, 12, 0.1, rnd), 0.6, 0xE0B07A, 0xB9774A, top.y));
    const LCX = R * 0.04, LCZ = R * 0.02;
    const {LOOP, OB, keepOff} = makePlanner(LCX, LCZ, R * 0.36, R * 0.25);

    /* 地面分區：圓頂前一片淺石廣場，人走的一圈是淡沙色的路 */
    const plaza = slab(blobShape(R * 0.3, 10, 0.08, rnd), 0.05, 0xF0E2C4, 0xD9C7A2, yA);
    plaza.position.set(-R * 0.42, 0, -R * 0.4); near.add(plaza);
    const trail = new THREE.Mesh(new THREE.RingGeometry(R * 0.36 - 0.4, R * 0.36 + 0.4, 40),
      mat(0xF2D9A8));
    trail.rotation.x = -Math.PI / 2; trail.scale.set(1, 0.25 / 0.36, 1);
    trail.position.set(R * 0.04, yA + 0.03, R * 0.02); trail.receiveShadow = true;
    near.add(trail);

    /* 圓頂建築 */
    {
      const [x, z] = keepOff(-0.5 * R, -0.5 * R, 1.6);
      const b = building('dome', 0xE9D9B0);
      b.position.set(x, yA, z); b.scale.setScalar(0.78);
      b.rotation.y = Math.atan2(R * 0.04 - x, R * 0.02 - z);      // 門朝島中央
      near.add(b);
      /* 兩側小尖塔 */
      [-1, 1].forEach(sd => {
        const ax = Math.cos(b.rotation.y) * sd * 1.9, az = -Math.sin(b.rotation.y) * sd * 1.9;
        near.add(cyl(0.22, 0.26, 2.6, 8, 0xF0E4C8, x + ax, yA + 1.3, z + az));
        near.add(ball(0.3, 0xE9D9B0, x + ax, yA + 2.75, z + az));
        near.add(cone(0.12, 0.4, 6, 0xC9A04E, x + ax, yA + 3.15, z + az));
      });
    }

    /* 獨立的拱門：兩根方柱、上面一道尖拱，站在廣場入口 */
    {
      const [x, z] = keepOff(-0.06 * R, -0.71 * R, 0.9);
      const ag = new THREE.Group();
      const ST = 0xE8C99A, TRIM = 0xC4714B;
      [-0.85, 0.85].forEach(px => {
        ag.add(box(0.42, 2.2, 0.42, ST, px, 1.1, 0));
        ag.add(box(0.5, 0.14, 0.5, TRIM, px, 2.25, 0));
      });
      const arc = new THREE.Mesh(new THREE.TorusGeometry(0.85, 0.2, 6, 14, Math.PI), mat(ST));
      arc.position.y = 2.3; ag.add(arc);
      ag.add(cone(0.18, 0.5, 6, TRIM, 0, 3.4, 0));
      ag.position.set(x, yA, z); ag.rotation.y = 0.4; near.add(ag);
    }

    /* 香料市集：兩個攤位，旁邊一袋袋敞口的香料粉 */
    const SPC = [0xC75B39, 0xE0A23C, 0x8E6B3A, 0xD98A2E, 0x6E4A30];
    [[-0.6, 0.36, 0.2], [0.32, -0.59, -0.6]].forEach(([fx, fz, ry], si) => {
      const [x, z] = keepOff(fx * R, fz * R, 1.3);
      const st = fieldOf('spicemat');
      st.children.forEach(c => { if (c.position.y > 2) c.material = mat(si ? 0xE0A23C : 0xC75B39); });
      st.position.set(x, yA, z); st.rotation.y = ry; st.scale.setScalar(0.62); near.add(st);
      for (let k = 0; k < 4; k++){
        const a = ry + 1.2 + k * 0.5, sx = x + Math.cos(a) * 1.55, sz = z + Math.sin(a) * 1.55;
        near.add(cyl(0.26, 0.3, 0.5, 9, 0xE6D3AE, sx, yA + 0.25, sz));
        near.add(cone(0.24, 0.22, 9, SPC[(k + si * 2) % 5], sx, yA + 0.6, sz));
      }
    });

    /* 曬香料：路圈中間幾張蓆子，攤著黑胡椒（黑）與丁香（紅褐） */
    [[-0.85, 0x2E2A26], [0, 0x8A4A30], [0.85, 0x3A3230]].forEach(([dx, c], i) => {
      const x = LCX + dx, z = LCZ + (i % 2 ? 0.15 : -0.1);
      near.add(box(0.75, 0.05, 0.6, 0xD8C08A, x, yA + 0.03, z));
      for (let k = 0; k < 10; k++)
        near.add(ball(0.06, c, x + (rnd() - 0.5) * 0.6, yA + 0.08, z + (rnd() - 0.5) * 0.45));
      OB.push({x, z, r:0.4});
    });

    /* 主角植栽台：黑胡椒爬在木樁上、丁香樹 */
    {
      const GR = 0.21;
      const [gx, gz] = keepOff(0.63 * R, -0.16 * R, GR * R);
      const bed = slab(blobShape(R * GR, 10, 0.1, rnd), 0.45, 0x8A6A46, 0xB98A5E, yA);
      bed.position.set(gx, 0, gz); near.add(bed);
      const yG = yA + 0.45;
      [[-0.35, -0.3], [0.1, -0.45], [-0.45, 0.25]].forEach(([dx, dz]) => {
        const pg = new THREE.Group();
        pg.add(cyl(0.07, 0.08, 2.4, 6, 0x9A7450, 0, 1.2, 0));
        for (let k = 0; k < 6; k++){
          const a = k * 1.9;
          pg.add(ball(0.24, k % 2 ? 0x4E8A4A : 0x5E9A58, Math.cos(a) * 0.17, 0.4 + k * 0.33, Math.sin(a) * 0.17));
          if (k % 2) pg.add(box(0.07, 0.3, 0.07, 0xC73B2A, Math.cos(a) * 0.3, 0.3 + k * 0.33, Math.sin(a) * 0.3));
        }
        pg.position.set(gx + dx * R * GR, yG, gz + dz * R * GR); near.add(pg);
      });
      [[0.35, 0.15, 1.0], [0.05, 0.42, 0.8]].forEach(([dx, dz, s]) => {
        const tg = new THREE.Group();
        tg.add(cyl(0.12, 0.17, 0.9, 6, 0x8A6A4A, 0, 0.45, 0));
        const c = ball(0.75, 0x3F6E42, 0, 1.55, 0); c.scale.set(1, 1.35, 1); tg.add(c);
        for (let k = 0; k < 6; k++){
          const a = k * 1.05;

    { /* 馬告：細瘦的山胡椒，枝上一串串小綠果；腳邊幾株蕨 */
      const tg = new THREE.Group();
      tg.add(cyl(0.08, 0.11, 1.6, 6, 0x7A6248, 0, 0.8, 0));
      [[0.3, 1.5], [-0.25, 1.8], [0.1, 2.2]].forEach(([dx, y], k) => {

    /* 駱駝：站在圓頂旁，馱著兩袋香料 */

    const loop = LOOP.map(([x, z]) => new THREE.Vector3(g.position.x + x, yA, g.position.z + z));

    [[0.78, 0.18, 'c', 1.9], [-0.34, -0.8, 'p'], [-0.42, 0.72, 'p'], [0.62, 0.52, 'c', 1.5],

    g.__zones = {americas:ZAm, taiwanmt:ZTw};

  /* 花綻島：沙漠的千葉玫瑰、玫瑰谷的大馬士革玫瑰、橙花樹、茉莉田
     （老闆的清單）。四樣各是一區，其餘花種的號碼散在草地上。 */
  flower(g, near, top, rnd){
    const R = top.r, yA = top.y + 0.6;
    g.add(slab(blobShape(R * 0.88, 13, 0.1, rnd), 0.6, 0xCFD9A2, 0x9E8A66, top.y));
    const {LOOP, OB, keepOff} = makePlanner(R * 0.02, R * 0.04, R * 0.22, R * 0.12);
    const trail = new THREE.Mesh(new THREE.RingGeometry(R * 0.22 - 0.4, R * 0.22 + 0.4, 40),
      mat(0xEDE0BC));
    trail.rotation.x = -Math.PI / 2; trail.scale.set(1, 0.12 / 0.22, 1);
    trail.position.set(R * 0.02, yA + 0.03, R * 0.04); trail.receiveShadow = true;
    near.add(trail);

    const zone = (fx, fz, fr, topC, sideC) => {
      const [x, z] = keepOff(fx * R, fz * R, fr * R);
      const s3 = slab(blobShape(fr * R, 11, 0.1, rnd), 0.45, topC, sideC, yA);
      s3.position.set(x, 0, z); near.add(s3);
      return {x, z, r:fr * R, y:yA + 0.45};
    };
    const ZD = zone(-0.46, -0.36, 0.28, 0xE6C48A, 0xC98A4E);    // 沙漠・千葉玫瑰
    const ZV = zone(0.46, -0.36, 0.28, 0x8FB874, 0x8A6E4E);     // 玫瑰谷
    const ZO = zone(-0.5, 0.44, 0.2, 0x9CBF7E, 0x8A6E4E);       // 橙花樹
    const ZJ = zone(0.46, 0.44, 0.24, 0xA9C48A, 0x8A6E4E);      // 茉莉田

    /* 玫瑰叢：幾顆綠葉球，上面一朵朵重瓣花（外圈大、內圈小、顏色漸深） */
    const roseBush = (c1, c2, n) => {
      const bg = new THREE.Group();
      bg.add(ball(0.42, 0x5E8A52, 0, 0.36, 0));
      bg.add(ball(0.3, 0x6E9A5C, 0.28, 0.3, 0.12));
      for (let k = 0; k < n; k++){
        const a = k / n * 6.28 + rnd(), r2 = 0.22 + rnd() * 0.12;
        const fx = Math.cos(a) * r2, fz = Math.sin(a) * r2, fy = 0.6 + rnd() * 0.18;
        const o = ball(0.15, c1, fx, fy, fz); o.scale.y = 0.7; bg.add(o);
        bg.add(ball(0.09, c2, fx, fy + 0.06, fz));
      }
      return bg;
    };

    /* 沙漠的千葉玫瑰：沙地、兩座小沙丘，一行行淡粉的重瓣玫瑰 */
    [[0.5, -0.35, 1.0], [-0.55, 0.4, 0.8]].forEach(([dx, dz, r]) => {
      const d = new THREE.Mesh(new THREE.SphereGeometry(r, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2),
        mat(0xEED39A));
      d.scale.set(1, 0.32, 0.7); d.position.set(ZD.x + dx * ZD.r, ZD.y, ZD.z + dz * ZD.r);
      d.castShadow = true; d.receiveShadow = true; near.add(d);
    });
    for (let row = -1; row <= 1; row++)
      for (let k = -2; k <= 2; k++){
        if (Math.abs(k) === 2 && row !== 0) continue;
        const b = roseBush(0xF4C2CE, 0xE897AE, 5);
        b.position.set(ZD.x + k * 0.95 + row * 0.3, ZD.y, ZD.z + row * 0.95);
        b.rotation.y = rnd() * 6.28; near.add(b);
      }

    /* 玫瑰谷：兩側綠色山稜夾著谷地，谷底一壟壟深粉的大馬士革玫瑰 */
    [-1, 1].forEach(sd => {
      const h = new THREE.Mesh(new THREE.SphereGeometry(ZV.r * 0.5, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2),
        mat(sd > 0 ? 0x7AA862 : 0x6E9C58));
      h.scale.set(1.5, 0.75, 0.42); h.position.set(ZV.x, ZV.y, ZV.z + sd * ZV.r * 0.68);
      h.castShadow = true; h.receiveShadow = true; near.add(h);
    });
    for (let row = -1; row <= 1; row++){
      near.add(box(ZV.r * 1.5, 0.12, 0.42, 0x9C7A56, ZV.x, ZV.y + 0.06, ZV.z + row * 0.75));
      for (let k = -2; k <= 2; k++){
        const b = roseBush(0xD9587A, 0xB83A5E, 4); b.scale.setScalar(0.85);
        b.position.set(ZV.x + k * 0.9, ZV.y + 0.1, ZV.z + row * 0.75); near.add(b);
      }
    }

    /* 橙花樹：圓而密的深綠樹冠，白花點點，夾幾顆橙果 */
    [[0, 0, 1.0], [0.48, 0.32, 0.8], [-0.45, 0.3, 0.85]].forEach(([dx, dz, s]) => {
      const tg = new THREE.Group();
      tg.add(cyl(0.16, 0.22, 1.0, 7, 0x7A5C3E, 0, 0.5, 0));
      const c = ball(1.0, 0x3F7A48, 0, 1.75, 0); c.scale.set(1, 0.92, 1); tg.add(c);
      tg.add(ball(0.6, 0x4E8A52, 0.45, 2.15, 0.15));
      for (let k = 0; k < 12; k++){
        const a = k * 2.39, el = 0.3 + (k % 4) * 0.25;
        tg.add(ball(0.09, 0xFFFFFF, Math.cos(a) * Math.cos(el) * 1.0, 1.75 + Math.sin(el) * 0.92,
                    Math.sin(a) * Math.cos(el) * 1.0));
      }
      [0.6, 2.6, 4.4].forEach(a => tg.add(ball(0.13, 0xE8892E, Math.cos(a) * 0.98, 1.5, Math.sin(a) * 0.98)));
      tg.position.set(ZO.x + dx * ZO.r, ZO.y, ZO.z + dz * ZO.r); tg.scale.setScalar(s * 0.85);
      tg.rotation.y = rnd() * 6.28; near.add(tg);
    });

    /* 茉莉田：一壟壟低矮的灌木，滿是白色小花 */
    for (let row = -2; row <= 2; row++){
      const len = ZJ.r * (1.7 - Math.abs(row) * 0.3);
      near.add(box(len, 0.12, 0.5, 0x9C7A56, ZJ.x, ZJ.y + 0.06, ZJ.z + row * 0.72));
      const n = Math.max(2, Math.round(len / 0.75));
      for (let k = 0; k < n; k++){
        const x = ZJ.x - len / 2 + (k + 0.5) * len / n, z = ZJ.z + row * 0.72;
        near.add(ball(0.3, k % 2 ? 0x5E8A52 : 0x6E9A5C, x, ZJ.y + 0.38, z));
        for (let j = 0; j < 4; j++)
          near.add(ball(0.06, 0xFFFFFF, x + Math.cos(j * 1.6) * 0.24, ZJ.y + 0.55 + (j % 2) * 0.08,
                        z + Math.sin(j * 1.6) * 0.2));
      }
    }

    g.__zones = {centifolia:ZD, rosevalley:ZV, orangegrove:ZO, jasminefield:ZJ};
    g.__ob = OB; g.__loop = LOOP;
  }
};

ISLES.forEach((isle, idx) => {
  const g = new THREE.Group();
  g.position.set(isle.x, 0, isle.z);
  world.add(g);
  isle.g = g;
  const rnd = (() => { let s2 = idx * 9301 + 49297;
    return () => (s2 = (s2 * 9301 + 49297) % 233280) / 233280; })();

  const R0 = isle.R;
  const BANDS = [
    [mix(isle.side, 0x000000, 0.06), 1.0],
    [mix(isle.side, 0xC97F4A, 0.3), 0.9],
    [mix(isle.side, 0x3E5A47, 0.32), 1.3]
  ];
  let yy = 0;
  BANDS.forEach(([c, h], bi) => {
    g.add(slab(hexShape(R0 * (1 - bi * 0.035)), h, c, c, yy - h));
    yy -= h;
  });
  g.add(slab(hexShape(R0), 0.55, isle.top, mix(isle.top, 0x000000, 0.22), -0.55));

  const near = new THREE.Group();
  g.add(near);
  isle.near = near;
  const top = {y:0, r:R0 * 0.92};
  if (SCENE[isle.part]) SCENE[isle.part](g, near, top, rnd);

  /* 品項編號：浮在空中的標籤，高低錯落、散著擺，地上不插棍子 */
  const Z = g.__zones || {};
  isle.items.forEach((it, i) => {
    let a = i * 2.399 + rnd() * 0.5, rr = R0 * (0.15 + rnd() * 0.6);
    let px = Math.cos(a) * rr, pz = Math.sin(a) * rr;
    let gy = SCENE[isle.part] ? 0.72 : 0.02;
    const z = it.zone && Z[it.zone];
    if (z){                                   // 雨林的號碼收進雨林角
      const a2 = rnd() * 6.28, r2 = z.r * (0.15 + rnd() * 0.65);
      px = z.x + Math.cos(a2) * r2; pz = z.z + Math.sin(a2) * r2; gy = z.y;
    } else {                                  // 其餘避開雨林角
      for (let k = 0; k < 12; k++){
        if (!Object.values(Z).some(q => Math.hypot(px - q.x, pz - q.z) < q.r + 0.6)) break;
        a += 0.7; px = Math.cos(a) * rr; pz = Math.sin(a) * rr;
      }
    }
    pins.push({kind:'item', it, isle,
      gnd:new THREE.Vector3(isle.x + px, gy, isle.z + pz),
      at:new THREE.Vector3(isle.x + px, gy + 1.4 + rnd() * 2.6, isle.z + pz)});
  });
  /* 品項多的島，每一區只放一個區名牌 */
  if (isle.items.length > 14){
    isle.crowded = true;
    const gp = {};
    isle.items.forEach(it => {
      const k = (it.zone && Z[it.zone]) ? it.zone : '_';
      (gp[k] = gp[k] || []).push(it);
    });
    Object.keys(gp).forEach(k => {
      let x, z, y;
      if (k !== '_'){ x = Z[k].x; z = Z[k].z; y = Z[k].y; }
      else {
        const ps = pins.filter(q => q.kind === 'item' && q.isle === isle && gp[k].includes(q.it));
        x = ps.reduce((s, q) => s + q.gnd.x - isle.x, 0) / ps.length;
        z = ps.reduce((s, q) => s + q.gnd.z - isle.z, 0) / ps.length;
        y = ps.reduce((s, q) => s + q.gnd.y, 0) / ps.length;
      }
      pins.push({kind:'zone', isle, key:k, n:gp[k].length,
        zh:k === '_' ? restZh(isle) : (ZONE_ZH[k] || k),
        at:new THREE.Vector3(isle.x + x, y + 2.8, isle.z + z)});
    });
  }
  pins.push({kind:'isle', isle, at:new THREE.Vector3(isle.x, 4.6, isle.z)});
});

/* ── 橋：用最小生成樹連起來，每座島都到得了 ────────── */
(function bridges(){
  const n = ISLES.length, inTree = [0], out = ISLES.map((_, i) => i).slice(1);
  const BM = mat(0xC9B08A), RM = mat(0xE8DCC6);
  while (out.length){
    let bi = 0, bj = 0, bd = 1e9;
    inTree.forEach(i => out.forEach((j, oj) => {
      const d = Math.hypot(ISLES[i].x - ISLES[j].x, ISLES[i].z - ISLES[j].z);
      if (d < bd){ bd = d; bi = i; bj = oj; }
    }));
    const j = out.splice(bj, 1)[0];
    const a = ISLES[bi], b = ISLES[j];
    const ax = Math.atan2(b.z - a.z, b.x - a.x);
    const x0 = a.x + Math.cos(ax) * a.R, z0 = a.z + Math.sin(ax) * a.R;
    const x1 = b.x - Math.cos(ax) * b.R, z1 = b.z - Math.sin(ax) * b.R;
    const len = Math.hypot(x1 - x0, z1 - z0);
    if (len > 0.5){
      const deck = new THREE.Mesh(new THREE.BoxGeometry(len, 0.16, 1.2), BM);
      deck.position.set((x0 + x1) / 2, -0.5, (z0 + z1) / 2);
      deck.rotation.y = -ax;
      deck.receiveShadow = true;
      world.add(deck);
      [-0.55, 0.55].forEach(off => {
        const rail = new THREE.Mesh(new THREE.BoxGeometry(len, 0.14, 0.08), RM);
        rail.position.set((x0 + x1) / 2 - Math.sin(-ax) * off,
                          -0.34, (z0 + z1) / 2 - Math.cos(-ax) * off);
        rail.rotation.y = -ax;
        world.add(rail);
      });
    }
    inTree.push(j);
  }
})();

/* ── 海 ─────────────────────────────────────────────── */
let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
ISLES.forEach(i => {
  minX = Math.min(minX, i.x - i.R); maxX = Math.max(maxX, i.x + i.R);
  minZ = Math.min(minZ, i.z - i.R); maxZ = Math.max(maxZ, i.z + i.R);
});
const CX = (minX + maxX) / 2, CZ = (minZ + maxZ) / 2;
const SPAN = Math.max(maxX - minX, maxZ - minZ);
/* ── 海與海岸 ─────────────────────────────────────────
   第一版用「圓環切 120 份」做海岸，每片三角形各上一色，結果沙灘邊
   是一圈鋸齒、丘陵是一條條往中心射的楔形。改用 PUMA 那種方格地形：
   高低用平滑雜訊算，顏色依高度上，海岸線自然彎曲；粉彩低多邊形
   丘陵、零星深綠小針葉樹，海灣裡有衛星小島、帆船與浮標。
   全部是程式產生的幾何，沒有圖片。 */
const seaMat = new THREE.MeshPhongMaterial({color:0x5FAFC4, flatShading:true, shininess:0});
const sea = new THREE.Mesh(new THREE.PlaneGeometry(SPAN * 9, SPAN * 9), seaMat);
sea.rotation.x = -Math.PI / 2;
sea.position.set(CX, -2.3, CZ);
/* 海面不接陰影：陽光幾乎貼著平面照，陰影貼圖精度不夠，會在海面上
   畫出一條條蜘蛛網似的細線（shadow acne） */
sea.receiveShadow = false;

/* 會動的背景：洋流、島邊浪花、天上的雲 */
const currents = [], skyClouds = [];
const slopeLights = new THREE.Mesh(new THREE.BufferGeometry(),
  new THREE.MeshBasicMaterial({color:0xFFE3A0, transparent:true, opacity:0}));
const foamMat = new THREE.MeshBasicMaterial({color:0xFFFFFF, transparent:true, opacity:0.28,
  depthWrite:false, side:THREE.DoubleSide});
let MAXR = 0;
ISLES.forEach(i => { MAXR = Math.max(MAXR, Math.hypot(i.x - CX, i.z - CZ) + i.R); });
const BAY = MAXR + 12;
const nz = (x, z) =>
  Math.sin(x * 0.045 + 1.3) * Math.cos(z * 0.052 + 0.7) * 0.5 +
  Math.sin(x * 0.11 + z * 0.09) * 0.25 +
  Math.sin(x * 0.023 - z * 0.031 + 2.1) * 0.55;
/* 火山口：海岸先一小段緩坡，接著陡升成一整圈山牆，再往外是起伏的
   群山一路到地平線。山脊用另一組雜訊切出高低，才不會像一道整齊的牆。 */
const ridge = (x, z) => 0.5 + 0.5 * Math.sin(Math.atan2(z - CZ, x - CX) * 7 + nz(x, z) * 2.2);
const landH0 = (x, z) => {
  const d = Math.hypot(x - CX, z - CZ);
  const e = d - (BAY + nz(x * 1.6, z * 1.6) * 6);
  if (e < 0) return -4 + e * 0.02;
  if (e < 5) return -2.15 + e * 0.12;                         // 岸邊緩坡
  const wall = Math.min(1, (e - 5) / 38);                       // 山牆陡升
  const peak = 36 * Math.pow(wall, 1.25) * (0.55 + 0.45 * ridge(x, z));
  const far = Math.max(0, e - 43);                              // 外圈群山起伏
  const roll = far > 0 ? 18 * (0.5 + 0.5 * nz(x * 0.6, z * 0.6)) * Math.min(1, far / 30) : 0;
  return -1.55 + peak + roll + nz(x * 2.1, z * 2.1) * 1.2;
};
/* 地面畫出來是 4.6 一格的三角面，和公式算的高度在陡坡、岸邊會差好幾格
   ——樹照公式擺就會浮在空中、或站在湖面上。所以擺東西一律查「畫出來
   那一片三角形」在該點的高度。 */
const CELL = 4.6, HALF = SPAN * 5.2;
const meshH = (x, z) => {
  const z0 = CZ - HALF, x0 = CX - HALF;
  const gz = z0 + Math.floor((z - z0) / CELL) * CELL;
  const ox = ((Math.round(gz / CELL) % 2) ? CELL * 0.5 : 0);
  const kx = Math.floor((x - x0 - ox) / CELL);
  const P = (px, pz) => [px, landH0(px, pz), pz];
  for (let k = kx - 1; k <= kx + 1; k++){
    const gx = x0 + k * CELL;
    const a = P(gx + ox, gz), b = P(gx + CELL + ox, gz),
          c = P(gx + ox + CELL * 0.5, gz + CELL), d = P(gx + ox - CELL * 0.5, gz + CELL);
    for (const [p, q, r] of [[a, c, b], [a, d, c]]){
      const den = (q[2] - r[2]) * (p[0] - r[0]) + (r[0] - q[0]) * (p[2] - r[2]);
      const w1 = ((q[2] - r[2]) * (x - r[0]) + (r[0] - q[0]) * (z - r[2])) / den;
      const w2 = ((r[2] - p[2]) * (x - r[0]) + (p[0] - r[0]) * (z - r[2])) / den;
      const w3 = 1 - w1 - w2;
      if (w1 >= -1e-6 && w2 >= -1e-6 && w3 >= -1e-6){
        const y = w1 * p[1] + w2 * q[1] + w3 * r[1];
        /* 整片在海裡不畫的三角形：當作水面，什麼都不擺 */
        return (p[1] + q[1] + r[1]) / 3 < -2.6 ? -4 : y;
      }
    }
  }
  return landH0(x, z);
};
const landH = meshH;
(function land(){
  const pos = [], col = [];
  const cols = [[-1.75, 0xEDE3C5], [2, 0xCFE2A6], [10, 0xB8D293], [22, 0xA6C287],
                [36, 0x9DB58A], [99, 0xBFC9AE]]
    .map(([h, c]) => [h, new THREE.Color(c)]);
  const colOf = h => cols.find(([lim]) => h < lim)[1];
  const P = (x, z) => [x, landH0(x, z), z];
  for (let gx = CX - HALF; gx < CX + HALF; gx += CELL)
    for (let gz = CZ - HALF; gz < CZ + HALF; gz += CELL){
      /* 交錯半格，三角形才不會排成整齊的斜紋 */
      const ox = ((Math.round(gz / CELL) % 2) ? CELL * 0.5 : 0);
      const a = P(gx + ox, gz), b = P(gx + CELL + ox, gz),
            c = P(gx + ox + CELL * 0.5, gz + CELL), d = P(gx + ox - CELL * 0.5, gz + CELL);
      [[a, c, b], [a, d, c]].forEach(tri => {
        const hm = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
        if (hm < -2.6) return;                       // 整片在海裡的不畫
        const cc = colOf(hm);
        tri.forEach(v => { pos.push(v[0], v[1], v[2]); col.push(cc.r, cc.g, cc.b); });
      });
    }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({vertexColors:true,
    flatShading:true, shininess:0, specular:0x000000}));
  m.receiveShadow = true; m.castShadow = true;
  world.add(m);

  /* 陸地上零星的深綠小針葉樹，成叢 */
  let s3 = 4242;
  const rr = () => (s3 = (s3 * 9301 + 49297) % 233280) / 233280;
  const ni = gg => gg.index ? gg.toNonIndexed() : gg;
  const gA = [], gB = [], gT = [], gR = [];
  for (let c3 = 0; c3 < 480; c3++){
    const round = c3 % 3 === 0;                     // 三叢裡一叢是圓頭闊葉樹
    const a0 = rr() * 6.283, r0 = BAY + 4 + rr() * SPAN * 1.9;
    const x0 = CX + Math.cos(a0) * r0, z0 = CZ + Math.sin(a0) * r0;
    const n3 = 3 + Math.floor(rr() * 6);
    for (let i = 0; i < n3; i++){
      const x = x0 + (rr() - 0.5) * 9, z = z0 + (rr() - 0.5) * 9, y = landH(x, z);
      if (y < -1.6) continue;
      const s = 0.7 + rr() * 0.7;
      gT.push(ni(new THREE.CylinderGeometry(0.14 * s, 0.2 * s, 0.6 * s, 5)).translate(x, y + 0.3 * s, z));
      if (round){
        gR.push(ni(new THREE.IcosahedronGeometry(0.95 * s, 0)).translate(x, y + 1.25 * s, z));
        continue;
      }
      gA.push(ni(new THREE.ConeGeometry(0.85 * s, 2.0 * s, 6)).translate(x, y + 1.45 * s, z));
      gB.push(ni(new THREE.ConeGeometry(0.58 * s, 1.4 * s, 6)).translate(x, y + 2.3 * s, z));
    }
  }
  [[gA, 0x5A7E5E], [gB, 0x6A8F68], [gT, 0x8A6A4A], [gR, 0x8DB46A]].forEach(([list, c]) => {
    if (!list.length) return;
    const tm = new THREE.Mesh(mergeGeos(list), mat(c));
    tm.castShadow = true; world.add(tm);
  });

  /* 海灣裡的衛星小島：圓形、沙色邊、綠頂，上面幾棵樹或幾塊石頭 */
  const isl = [];
  for (let k = 0; k < 60 && isl.length < 7; k++){
    const a = rr() * 6.283, r = MAXR + 4 + rr() * (BAY - MAXR - 8);
    const x = CX + Math.cos(a) * r, z = CZ + Math.sin(a) * r, rad = 2.2 + rr() * 2.2;
    if (ISLES.some(i => Math.hypot(i.x - x, i.z - z) < i.R + rad + 3)) continue;
    if (isl.some(q => Math.hypot(q.x - x, q.z - z) < q.r + rad + 3)) continue;
    isl.push({x, z, r:rad});
  }
  isl.forEach((q, k) => {
    const ig = new THREE.Group();
    ig.add(cyl(q.r, q.r * 1.04, 0.9, 10, 0xE6D8B4, 0, -2.0, 0));
    ig.add(cyl(q.r * 0.9, q.r * 0.9, 0.22, 10, 0xCFDDB0, 0, -1.48, 0));
    if (k % 2 === 0){
      for (let i = 0; i < 3; i++){
        const tr = new THREE.Group();
        tr.add(cyl(0.12, 0.16, 0.5, 5, 0x8A6A4A, 0, 0.25, 0));
        tr.add(cone(0.7, 1.7, 6, 0x5A7E5E, 0, 1.2, 0));
        tr.position.set((rr() - 0.5) * q.r, -1.37, (rr() - 0.5) * q.r);
        ig.add(tr);
      }
    } else {
      for (let i = 0; i < 3; i++){
        const rk = ball(0.5 + rr() * 0.4, 0xBDB6A8, (rr() - 0.5) * q.r, -1.2, (rr() - 0.5) * q.r);
        rk.scale.y = 0.65; ig.add(rk);
      }
    }
    ig.position.set(q.x, 0, q.z);
    world.add(ig);
  });

  /* 小帆船與浮標 */
  for (let k = 0; k < 7; k++){
    const a = rr() * 6.283, r = MAXR + 3 + rr() * (BAY - MAXR - 6);
    const x = CX + Math.cos(a) * r, z = CZ + Math.sin(a) * r;
    if (ISLES.some(i => Math.hypot(i.x - x, i.z - z) < i.R + 2)) continue;
    if (k < 4){
      const bt = new THREE.Group();
      bt.add(box(1.4, 0.3, 0.5, k % 2 ? 0xC4714B : 0xF4EFE4, 0, -2.1, 0));
      bt.add(cyl(0.03, 0.03, 1.4, 4, 0x8A6A4A, 0, -1.3, 0));
      const sail = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.2, 3), mat(0xFFFFFF));
      sail.position.set(0.15, -1.25, 0); sail.scale.z = 0.12; bt.add(sail);
      bt.position.set(x, 0, z); bt.rotation.y = rr() * 6.28;
      world.add(bt);
    } else {
      world.add(cyl(0.18, 0.22, 0.8, 8, 0xF4EFE4, x, -1.9, z));
      world.add(cyl(0.19, 0.19, 0.2, 8, 0xC4714B, x, -1.65, z));
    }
  }

  /* 島邊的浪花：每座島外圍一圈白色細邊，會一亮一暗 */
  ISLES.forEach(i => {
    const fm = new THREE.Mesh(new THREE.RingGeometry(i.R * 1.03, i.R * 1.13, 6, 1, Math.PI / 6),
      foamMat);
    fm.rotation.x = -Math.PI / 2;
    fm.position.set(i.x, -2.25, i.z);
    world.add(fm);
  });

  /* 洋流：海灣裡一道道彎曲的白色細流，繞著海灣慢慢流 */
  const curMat = new THREE.MeshBasicMaterial({color:0xFFFFFF, transparent:true, opacity:0.32,
    depthWrite:false, side:THREE.DoubleSide});
  for (let k = 0; k < 16; k++){
    const r = MAXR + 2 + rr() * (BAY - MAXR - 3);
    const len = 0.35 + rr() * 0.45;
    const arc = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.16 + rr() * 0.1, 24, 1, 0, len), curMat);
    arc.rotation.x = -Math.PI / 2;
    const pivot = new THREE.Group();
    pivot.position.set(CX, -2.24, CZ);
    pivot.rotation.y = rr() * 6.283;
    pivot.add(arc);
    pivot.userData.sp = (0.025 + rr() * 0.03) * (k % 3 === 0 ? -1 : 1);
    world.add(pivot); currents.push(pivot);
  }
  /* 島與島之間也有短短的細流 */
  for (let k = 0; k < 10; k++){
    const a = ISLES[k % ISLES.length], b = ISLES[(k + 3) % ISLES.length];
    const mx = (a.x + b.x) / 2 + (rr() - 0.5) * 4, mz = (a.z + b.z) / 2 + (rr() - 0.5) * 4;
    if (ISLES.some(i => Math.hypot(i.x - mx, i.z - mz) < i.R + 1.2)) continue;
    const arc = new THREE.Mesh(new THREE.RingGeometry(3.2, 3.36, 16, 1, 0, 0.7), curMat);
    arc.rotation.x = -Math.PI / 2;
    const pivot = new THREE.Group();
    pivot.position.set(mx, -2.24, mz); pivot.rotation.y = rr() * 6.283;
    pivot.add(arc); pivot.userData.sp = 0.12 * (k % 2 ? 1 : -1);
    world.add(pivot); currents.push(pivot);
  }

  /* 陸地上找一個合適的點：高度在範圍內、坡度不大 */
  const landSpot = (hmin, hmax, rmin, rmax, slope = 0.6) => {
    for (let k = 0; k < 60; k++){
      const a = rr() * 6.283, r = rmin + rr() * (rmax - rmin);
      const x = CX + Math.cos(a) * r, z = CZ + Math.sin(a) * r, h = landH(x, z);
      if (h < hmin || h > hmax) continue;
      if (Math.abs(landH(x + 1.5, z) - h) > slope || Math.abs(landH(x, z + 1.5) - h) > slope) continue;
      return [x, h, z];
    }
    return null;
  };

  /* 村落：幾處小屋聚落，粉彩屋頂 */
  const ROOFC = [0xD9704E, 0xE2B062, 0x7FA6C8, 0xC9645E, 0x9CB07E];
  for (let v = 0; v < 16; v++){
    const c = v < 7 ? landSpot(-1.4, 3.5, BAY + 4, BAY + 26)
                    : landSpot(2, 26, BAY + 10, BAY + 60, 1.6);   // 山坡上的零星人家
    if (!c) continue;
    const n = 4 + Math.floor(rr() * 4);
    for (let i = 0; i < n; i++){
      const x = c[0] + (rr() - 0.5) * 7, z = c[2] + (rr() - 0.5) * 7, h = landH(x, z);
      if (h < -1.6) continue;
      const hg = new THREE.Group();
      hg.add(box(1.3, 0.9, 1.1, 0xF4EEE0, 0, 0.45, 0));
      const rf = cone(1.05, 0.8, 4, ROOFC[(v + i) % ROOFC.length], 0, 1.3, 0);
      rf.rotation.y = Math.PI / 4; hg.add(rf);
      hg.position.set(x, h, z); hg.rotation.y = rr() * 6.28; hg.scale.setScalar(1.3);
      hg.traverse(o => { o.castShadow = true; });
      world.add(hg);
    }
    /* 村邊一兩塊田 */
    for (let i = 0; i < 2; i++){
      const x = c[0] + (rr() - 0.5) * 12, z = c[2] + (rr() - 0.5) * 12, h = landH(x, z);
      if (h < -1.6) continue;
      const fl = box(4 + rr() * 3, 0.12, 3 + rr() * 2,
        [0xE6CF7A, 0xC9B6D8, 0xB9CC86, 0xE8B98A][(v + i) % 4], x, h + 0.06, z);
      fl.rotation.y = rr() * 6.28; fl.castShadow = false; world.add(fl);
    }
  }

  /* 靜態的動物與花叢：羊、牛、鹿，散在草地上 */
  const animal = kind => {
    const ag = new THREE.Group();
    if (kind === 0){                          // 羊
      const b = ball(0.42, 0xF6F2E8, 0, 0.55, 0); b.scale.set(1.25, 0.95, 0.95); ag.add(b);
      ag.add(ball(0.2, 0x3A3530, 0.52, 0.66, 0));
      [[-0.22, -0.16], [0.22, -0.16], [-0.22, 0.16], [0.22, 0.16]].forEach(([x, z]) =>
        ag.add(cyl(0.05, 0.05, 0.32, 4, 0x3A3530, x, 0.16, z)));
    } else if (kind === 1){                   // 牛
      ag.add(box(1.0, 0.5, 0.5, 0xF4EFE6, 0, 0.62, 0));
      ag.add(box(0.36, 0.26, 0.4, 0x6E5240, 0.12, 0.66, 0));
      ag.add(box(0.3, 0.3, 0.3, 0xF4EFE6, 0.62, 0.78, 0));
      [[-0.38, -0.17], [0.38, -0.17], [-0.38, 0.17], [0.38, 0.17]].forEach(([x, z]) =>
        ag.add(box(0.1, 0.38, 0.1, 0x6E5240, x, 0.19, z)));
    } else {                                  // 鹿
      ag.add(box(0.8, 0.36, 0.3, 0xB0835A, 0, 0.7, 0));
      ag.add(box(0.12, 0.42, 0.12, 0xB0835A, 0.42, 0.98, 0));
      ag.add(box(0.26, 0.18, 0.18, 0xB0835A, 0.52, 1.2, 0));
      [[-0.3, -0.1], [0.3, -0.1], [-0.3, 0.1], [0.3, 0.1]].forEach(([x, z]) =>
        ag.add(cyl(0.04, 0.04, 0.52, 4, 0x8A6342, x, 0.26, z)));
    }
    return ag;
  };
  for (let k = 0; k < 48; k++){
    const c = k < 26 ? landSpot(-1.5, 4.5, BAY + 3, BAY + 30)
                     : landSpot(2, 20, BAY + 8, BAY + 50, 1.2);
    if (!c) continue;
    const a = animal(k % 3);
    a.position.set(c[0], c[1], c[2]); a.rotation.y = rr() * 6.28;
    a.scale.setScalar(1.3 + rr() * 0.4);
    world.add(a);
  }
  const FLC = [0xF2C6CF, 0xF4E08A, 0xC9B6E4, 0xFFFFFF];
  const fp = [];
  for (let k = 0; k < 40; k++){
    const c = landSpot(-1.6, 6, BAY + 2, BAY + 34); if (!c) continue;
    for (let i = 0; i < 6; i++)
      fp.push(ni(new THREE.SphereGeometry(0.16, 5, 4))
        .translate(c[0] + (rr() - 0.5) * 2.2, c[1] + 0.12, c[2] + (rr() - 0.5) * 2.2));
    if (fp.length > 200) break;
  }
  if (fp.length) world.add(new THREE.Mesh(mergeGeos(fp), mat(FLC[0])));

  /* 天上的雲：低多邊形白雲團，飄在外圍陸地上空，不擋島 */
  const cloudM = new THREE.MeshPhongMaterial({color:0xFFFFFF, flatShading:true, shininess:0,
    transparent:true, opacity:0.93});
  for (let k = 0; k < 16; k++){
    const cg = new THREE.Group();
    const n = 3 + Math.floor(rr() * 3);
    for (let i = 0; i < n; i++){
      const b = new THREE.Mesh(new THREE.IcosahedronGeometry(1.4 + rr() * 1.3, 1), cloudM);
      b.position.set(i * 1.7 - n * 0.85, rr() * 0.8, (rr() - 0.5) * 1.6);
      b.scale.y = 0.7; cg.add(b);
    }
    /* 雲停在山脊上 */
    const a = rr() * 6.283, r = BAY + 34 + rr() * 26;
    const rx = CX + Math.cos(a) * r, rz = CZ + Math.sin(a) * r;
    cg.position.set(rx, Math.max(8, landH(rx, rz)) + 4 + rr() * 5, rz);
    cg.scale.setScalar(1.4 + rr() * 1.2);
    cg.userData.sp = 0.35 + rr() * 0.5;
    world.add(cg); skyClouds.push(cg);
  }

  /* 山坡上一點一點的燈光（黃昏與夜晚才亮） */
  const lp = [];
  for (let k = 0; k < 220; k++){
    const a = rr() * 6.283, r = BAY + 3 + rr() * 60;
    const x = CX + Math.cos(a) * r, z = CZ + Math.sin(a) * r, h = landH(x, z);
    if (h < -1.5) continue;
    lp.push(new THREE.SphereGeometry(0.16, 4, 3).translate(x, h + 0.5, z));
  }
  slopeLights.geometry = mergeGeos(lp.map(g2 => g2.index ? g2.toNonIndexed() : g2));
  world.add(slopeLights);

  /* 海面一點點亮點 */
  const sp = [];
  for (let k = 0; k < 140; k++){
    const a = rr() * 6.283, r = rr() * BAY;
    sp.push(new THREE.CircleGeometry(0.22 + rr() * 0.25, 6).rotateX(-Math.PI / 2)
      .translate(CX + Math.cos(a) * r, -2.27, CZ + Math.sin(a) * r));
  }
  world.add(new THREE.Mesh(mergeGeos(sp), new THREE.MeshBasicMaterial({color:0xFFFFFF,
    transparent:true, opacity:0.22, depthWrite:false})));
})();

/* 霧團拿掉了（看起來像海上的白色污漬），留下空陣列給動畫迴圈用 */

const mists = [];

/* 開場：從低角度（約 24°）看進火山口湖，遠山與天空都在畫面裡 */
const CAM = {theta:-Math.PI / 4 - 0.25, phi:0.48, dist:SPAN * 3.6 + 20, tx:CX, tz:CZ};
const HOME = Object.assign({}, CAM);
let BIRD_MIN = 0.30;
const TARGET = new THREE.Vector3();
let nearOn = true;
function applyCam(){
  CAM.phi = Math.max(BIRD_MIN, Math.min(1.45, CAM.phi));
  CAM.dist = Math.max(24, Math.min(SPAN * 5.5 + 80, CAM.dist));
  camera.aspect = innerWidth / Math.max(1, innerHeight);
  camera.far = CAM.dist * 4 + 900;
  camera.updateProjectionMatrix();
  /* 霧的遠近一定要跟著鏡頭距離走。原本用島群尺寸算死，鏡頭一拉遠
     島的視距就超出霧的範圍，整片被吃掉七成，看起來就像島不見了。 */
  scene.fog.near = CAM.dist * 1.3;
  scene.fog.far  = CAM.dist * 4.2;
  /* 遠看不必把所有東西都畫出來 */
  const want = CAM.dist < SPAN * 3.2;
  if (want !== nearOn){
    nearOn = want;
    ISLES.forEach(i => { if (i.near) i.near.visible = want; });
    folk.forEach(d => d.visible = want);
  }
  TARGET.set(CAM.tx, 1.2, CAM.tz);
  /* 鏡頭不能鑽進山裡：山變高之後，拉近又壓低時鏡頭會落在山坡底下，
     從裡面看地面是背面、不會畫，只剩樹和房子懸在半空。鏡頭本身與
     到湖心的視線都要高過地面，不夠就把仰角往上抬。 */
  /* 只抬這一幀，不改寫 CAM.phi——否則自轉一圈仰角會一路被墊高回不來 */
  let ph = CAM.phi;
  const camAt = () => [CAM.tx + CAM.dist * Math.cos(ph) * Math.cos(CAM.theta),
                       CAM.dist * Math.sin(ph),
                       CAM.tz + CAM.dist * Math.cos(ph) * Math.sin(CAM.theta)];
  const buried = ([x, y, z]) => {
    for (let t = 0; t <= 0.6; t += 0.1){
      const px = x + (CAM.tx - x) * t, pz = z + (CAM.tz - z) * t, py = y + (1.2 - y) * t;
      if (landH(px, pz) > py - (t === 0 ? 3 : 0.5)) return true;
    }
    return false;
  };
  for (let k = 0; k < 60 && ph < 1.45 && buried(camAt()); k++) ph += 0.02;
  camera.position.set(...camAt());
  camera.lookAt(TARGET);
}
applyCam();

let anim = null;
function glide(to, ms){
  const a = {th:CAM.theta, ph:CAM.phi, d:CAM.dist, x:CAM.tx, z:CAM.tz};
  const t0 = performance.now(), me = anim = {};
  (function step(now){
    if (anim !== me) return;
    const k = Math.min(1, (now - t0) / ms);
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    CAM.theta = lerpn(a.th, to.th === undefined ? a.th : to.th, e);
    CAM.phi = lerpn(a.ph, to.ph === undefined ? a.ph : to.ph, e);
    CAM.dist = lerpn(a.d, to.d === undefined ? a.d : to.d, e);
    CAM.tx = lerpn(a.x, to.x === undefined ? a.x : to.x, e);
    CAM.tz = lerpn(a.z, to.z === undefined ? a.z : to.z, e);
    applyCam();
    if (k < 1) requestAnimationFrame(step); else if (anim === me) anim = null;
  })(t0);
}

const pts = new Map();
let dragging = false, moved = false, sx = 0, sy = 0, px = 0, py = 0, cap = -1, pinch0 = 0, d0 = 0;
const spread = () => {
  const v = [...pts.values()];
  return v.length < 2 ? 0 : Math.hypot(v[0].x - v[1].x, v[0].y - v[1].y);
};
function grab(e){ if (cap !== e.pointerId){ cap = e.pointerId; host.setPointerCapture(e.pointerId); } }
let lastTouch = 0;            // 最後一次操作的時間；放手 4 秒後才恢復自轉
host.addEventListener('pointerdown', e => {
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  anim = null; lastTouch = performance.now();
  if (pts.size === 1){ dragging = true; moved = false; sx = px = e.clientX; sy = py = e.clientY; }
  else if (pts.size === 2){ dragging = false; moved = true; grab(e); pinch0 = spread(); d0 = CAM.dist; }
});
host.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pts.size === 2){ if (pinch0 > 0){ CAM.dist = d0 * pinch0 / spread(); applyCam(); } return; }
  if (!dragging) return;
  if (!moved){
    if (Math.hypot(e.clientX - sx, e.clientY - sy) < 3) return;
    moved = true; host.classList.add('grabbing'); grab(e);
  }
  CAM.theta -= (e.clientX - px) * 0.005;
  CAM.phi += (e.clientY - py) * 0.004;
  px = e.clientX; py = e.clientY;
  applyCam();
});
['pointerup', 'pointercancel'].forEach(t => host.addEventListener(t, e => {
  pts.delete(e.pointerId);
  if (pts.size < 2) pinch0 = 0;
  if (pts.size === 0){ dragging = false; moved = false; cap = -1; host.classList.remove('grabbing'); }
}));
host.addEventListener('wheel', e => {
  e.preventDefault(); anim = null; lastTouch = performance.now();
  CAM.dist *= 1 + e.deltaY * 0.0012;
  applyCam();
}, {passive:false});
