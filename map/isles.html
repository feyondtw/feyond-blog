let shownIsle = null;
let spinOn = true, bobAmp = 0;
let hlItem = null;            // 字卡上滑過的那一支           // 只有打開的那座島會露出品項號碼
const v3 = new THREE.Vector3();
function placeTags(){
  const W = innerWidth, H = innerHeight, vis = [];
  /* 島在畫面上太小時，第二層的號碼先收起來：擠成一團讀不了，
     硬要避讓就會像之前那樣連成一串掉進海裡 */
  let itemsOn = false;
  if (shownIsle){
    v3.set(shownIsle.x, 0, shownIsle.z).project(camera);
    const cx = v3.x, cy = v3.y;
    v3.set(shownIsle.x + shownIsle.R, 0, shownIsle.z).project(camera);
    itemsOn = Math.hypot((v3.x - cx) * W / 2, (v3.y - cy) * H / 2) > 150;
  }
  pins.forEach(p => {
    v3.copy(p.at).project(camera);
    /* 品項多的島：個別號碼平常收起來，只有字卡滑過、或選到的那一支才出現；
       改由區名牌代表整區 */
    const inLayer2 = p.isle === shownIsle && itemsOn;
    const ok = v3.z < 1 && (
      p.kind === 'isle' ||
      (p.kind === 'zone' && inLayer2) ||
      (p.kind === 'item' && inLayer2 && (!p.isle.crowded || p.it.id === hlItem ||
                                         p.tag.classList.contains('on'))));
    if (p.kind === 'item') p.tag.classList.toggle('hl', p.it.id === hlItem);
    /* 進到第二層時，那座島的第一層名牌換成整塊島色，當這一層的標題 */
    if (p.kind === 'isle') p.tag.classList.toggle('cur', p.isle === shownIsle);
    p.tag.classList.toggle('off', !ok);
    if (ok) vis.push({p, x:(v3.x * 0.5 + 0.5) * W, y:(-v3.y * 0.5 + 0.5) * H});
  });
  /* 避讓照名牌的實際寬高算。島名牌有兩百多 px 寬，用號碼章的尺寸
     去避，九張名牌就會疊成一團。 */
  vis.forEach(v => {
    v.w = v.p.tag.offsetWidth || (v.p.kind === 'isle' ? 190 : 34);
    v.h = v.p.tag.offsetHeight || (v.p.kind === 'isle' ? 42 : 34);
    v.y0 = v.y;
  });
  vis.sort((a, b) => a.y - b.y);
  for (let pass = 0; pass < 3; pass++)
    for (let i = 1; i < vis.length; i++)
      for (let j = 0; j < i; j++){
        const A = vis[i], B = vis[j];
        if (Math.abs(A.x - B.x) < (A.w + B.w) / 2 + 6 &&
            Math.abs(A.y - B.y) < (A.h + B.h) / 2 + 4){
          A.y = B.y + (A.h + B.h) / 2 + 4;
          /* 號碼章最多讓 18px，讓不開就容許一點重疊，絕不離開原位太遠 */
          if (A.p.kind === 'item' && A.y - A.y0 > 18) A.y = A.y0 + 18;
          /* 島名牌也一樣，最多讓 26px——不然鏡頭一拉遠，名牌會一路掉出湖外 */
          if (A.p.kind !== 'item' && A.y - A.y0 > 26) A.y = A.y0 + 26;
        }
      }
  pins.forEach(p => { if (p.stem) p.stem.classList.add('off'); });
  /* 第一層島名牌跟著鏡頭遠近縮放：拉遠時島小，名牌也跟著小 */
  const sIsle = Math.max(0.62, Math.min(1, 70 / CAM.dist));
  vis.forEach(({p, x, y}) => {
    p.tag.style.left = x + 'px'; p.tag.style.top = y + 'px';
    if (p.kind === 'isle')
      p.tag.style.transform = `translate(-50%,-100%) scale(${p.tag.classList.contains('cur') ? 1 : sIsle})`;
    if (p.stem){
      v3.copy(p.gnd).project(camera);
      const gyS = (-v3.y * 0.5 + 0.5) * H;
      const h = gyS - y;
      if (h > 2){
        p.stem.classList.remove('off');
        p.stem.style.left = x + 'px'; p.stem.style.top = y + 'px';
        p.stem.style.height = h.toFixed(1) + 'px';
      }
    }
  });
}

let last = performance.now();

  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(loop);
  if (mk < 1){ mk = Math.min(1, mk + dt * 1.1); mood(mk); }

  /* 第一層全景時：鏡頭繞著湖緩緩轉，九座島各自輕輕浮動。
     點進島、拖曳、滾輪時停下；放手 4 秒後再繼續。 */
  const atTop = !shownIsle && !dragging && !anim;
  if (spinOn && atTop && now - lastTouch > 4000){ CAM.theta += 0.035 * dt; applyCam(); }
  bobAmp += ((shownIsle ? 0 : 0.22) - bobAmp) * Math.min(1, dt * 2);
  const ts = now / 1000;
  ISLES.forEach((isl, k) => {
    isl.g.position.y = Math.sin(ts * 0.7 + k * 1.3) * bobAmp;
    isl.g.rotation.z = Math.sin(ts * 0.5 + k * 0.9) * bobAmp * 0.03;
    isl.g.rotation.x = Math.cos(ts * 0.45 + k * 1.7) * bobAmp * 0.03;
  });

  /* 劈柴：舉起慢、劈下快 */
  choppers.forEach(c => {
    c.ph += dt * 3.0;
    const k = (c.ph % 6.283) / 6.283;
    const up = k < 0.7 ? k / 0.7 : 1 - (k - 0.7) / 0.3;
    c.arm.rotation.x = -2.4 * up + 0.6;
    c.body.rotation.x = 0.18 * (1 - up);
  });

  folk.forEach(d => {
    const u = d.userData, n = u.path.length;
    u.t = (u.t + u.sp * dt + n) % n;
    const i = Math.floor(u.t), f = u.t - i;
    const a = u.path[i], b = u.path[(i + 1) % n];
    d.position.set(a.x + (b.x - a.x) * f, u.y || 0, a.z + (b.z - a.z) * f);
    d.rotation.y = Math.atan2(b.x - a.x, b.z - a.z) + (u.sp < 0 ? Math.PI : 0);
    /* 步頻跟著實際走的距離，不是跟著時間 */
    /* STEP 原本是六角格的間距，格子砍掉後改用這條路自己的段長 */
    u.ph = (u.ph || 0) + Math.abs(u.sp) * (u.seg || 1.6) * dt * 2.4;
    const sw = Math.sin(u.ph);
    d.position.y = (u.y || 0) + Math.abs(sw) * 0.032;
    d.__legs[0].rotation.x = sw * 0.62;
    d.__legs[1].rotation.x = -sw * 0.62;
  });
  /* 洋流慢慢繞、浪花一亮一暗、雲往東飄 */
  currents.forEach(c => { c.rotation.y += c.userData.sp * dt; });
  foamMat.opacity = 0.22 + 0.12 * Math.sin(now / 1000 * 1.3);
  skyClouds.forEach(c => {
    c.position.x += c.userData.sp * dt;
    if (c.position.x > CX + SPAN * 3.2) c.position.x = CX - SPAN * 3.2;
  });
  mists.forEach(m => {
    const u = m.userData;
    u.a += u.sp * dt;
    m.position.x = CX + Math.cos(u.a) * u.rad;
    m.position.z = CZ + Math.sin(u.a) * u.rad;
  });
  /* 先畫再貼名牌：render() 會把相機矩陣更新到這一幀，
     順序反過來名牌就會慢一幀，轉動時看得出來在飄。 */
  renderer.render(scene, camera);
  placeTags();
}
requestAnimationFrame(loop);
</script>
