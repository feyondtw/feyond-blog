<style>
:root{
  --ink:#2A2724; --cream:#FFF8F0; --line:#E2D9C8; --gold:#B8965A;
  --muted:#7A756D; --faint:#A8A29A;
  --serif:"Noto Serif TC","Songti TC",serif;
  --latin:"Cormorant Garamond",Georgia,serif;
  --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --shadow:0 2px 10px rgba(42,39,36,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#BCDCE8;color:var(--ink);
  font-family:var(--serif);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

#scene{position:fixed;inset:0;touch-action:none;cursor:grab}
#scene.grabbing{cursor:grabbing}
canvas{display:block}

#tags{position:fixed;inset:0;pointer-events:none;z-index:2}
.tag{
  position:absolute;transform:translate(-50%,-100%);pointer-events:auto;
  background:var(--cream);border-radius:999px;padding:.34rem .75rem;
  box-shadow:var(--shadow);white-space:nowrap;cursor:pointer;
  font-family:var(--sans);font-size:.78rem;font-weight:500;letter-spacing:.04em;
  display:flex;align-items:center;gap:.4rem;transition:transform .16s,box-shadow .16s,opacity .2s
}
/* 十六處擠在一座島上，名牌全開會把島蓋掉。
   平常只留一顆會發光的點，滑過去（或選中）才長出文字。 */
.tag{background:transparent;box-shadow:none;padding:0;gap:0;
  transition:gap .18s,padding .18s,background .18s,box-shadow .18s,opacity .2s}
.tag .no,.tag .nm,.tag .n{max-width:0;opacity:0;overflow:hidden;
  transition:max-width .22s,opacity .16s}
.tag:hover,.tag.on{z-index:2;background:var(--cream);padding:.34rem .75rem;gap:.4rem;
  box-shadow:0 5px 18px rgba(42,39,36,.22)}
.tag:hover .no,.tag:hover .nm,.tag:hover .n,
.tag.on .no,.tag.on .nm,.tag.on .n{max-width:15rem;opacity:1}
@media (hover:none){ .tag .dot{width:16px;height:16px} .tag{padding:5px} }
.tag .n{font-family:var(--latin);font-size:.74rem;color:var(--gold)}

.tag .no{font-family:var(--latin);font-size:.74rem;font-weight:500;color:var(--gold);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.card-h .eyebrow .no{font-family:var(--latin);letter-spacing:.2em;color:var(--gold);margin-right:.5rem}
.tag .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
/* 收起來時是一顆會發光的點——6px 的金點在亮綠色的島上等於隱形 */
.tag .dot{width:12px;height:12px;
  box-shadow:0 0 0 2.5px rgba(255,255,255,.85),0 0 12px 3px rgba(184,150,90,.55)}
.tag.on .dot,.tag:hover .dot{width:6px;height:6px;box-shadow:none}
.tag.low .dot{background:var(--faint)}
.tag::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--cream);opacity:0;transition:opacity .16s}
.tag:hover::after,.tag.on::after{opacity:1}
.tag.off{opacity:0;pointer-events:none}
body.notags .tag{opacity:0;pointer-events:none}

.brand{position:fixed;top:0;left:0;z-index:3;padding:1.6rem 1.8rem;
  display:flex;flex-direction:column;gap:.4rem;pointer-events:none}
.brand .mk{font-family:var(--latin);letter-spacing:.34em;font-size:.72rem;
  text-transform:uppercase;color:#5E6B63}
.brand h1{margin:0;font-size:1.9rem;font-weight:500;letter-spacing:.14em;
  text-shadow:0 1px 10px rgba(255,255,255,.5)}
.brand p{margin:0;font-family:var(--sans);font-size:.76rem;letter-spacing:.07em;color:#5E6B63}

.tools{position:fixed;top:4.7rem;right:0;z-index:3;padding:0 1.8rem;
  display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 2rem)}
/* 工具列放在頁籤下一排，不再和頁籤擠同一列而疊在一起 */
.tool{background:var(--cream);border-radius:999px;padding:.4rem .85rem;
  box-shadow:var(--shadow);font-family:var(--sans);font-size:.75rem;
  letter-spacing:.06em;display:inline-flex;align-items:center;gap:.38rem;transition:transform .15s}
.tool:hover{transform:translateY(-1px)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.tool svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}

.views{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:3;
  margin-top:1.6rem;display:flex;gap:.2rem;background:var(--cream);
  border-radius:999px;padding:.28rem;box-shadow:var(--shadow);
  font-family:var(--sans);font-size:.75rem;letter-spacing:.06em}
.views a,.views span{padding:.3rem .8rem;border-radius:999px;text-decoration:none;
  color:var(--muted);white-space:nowrap}
.views a:hover{color:var(--ink);background:#EFE7D9}
.views [aria-current]{background:var(--ink);color:var(--cream)}


/* 四段光線 */
.seg{display:inline-flex;align-items:center;background:var(--cream);border-radius:999px;
  padding:.22rem;box-shadow:var(--shadow);gap:.08rem}
.seg button{width:2.15rem;height:1.75rem;border-radius:999px;display:grid;place-items:center;
  color:var(--muted);transition:background .18s,color .18s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}

.hint{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:3;
  font-family:var(--sans);font-size:.74rem;letter-spacing:.07em;color:#5E6B63;
  background:rgba(255,248,240,.82);padding:.4rem .9rem;border-radius:999px;
  transition:opacity .4s;pointer-events:none}
.hint.gone{opacity:0}

.card{position:fixed;z-index:4;right:1.8rem;top:50%;transform:translateY(-50%);
  width:min(22rem,calc(100vw - 3.6rem));max-height:min(32rem,calc(100vh - 8rem));
  background:var(--cream);border-radius:14px;box-shadow:0 10px 40px rgba(42,39,36,.22);
  display:flex;flex-direction:column;overflow:hidden}
.card[hidden]{display:none}
.card-h{padding:1.4rem 1.4rem .95rem;border-bottom:1px solid var(--line);position:relative;flex:none}
.card-h .eyebrow{font-family:var(--latin);font-size:.72rem;letter-spacing:.22em;color:var(--gold)}
.card-h h2{margin:.28rem 0 .1rem;font-size:1.3rem;font-weight:500;letter-spacing:.08em}
.card-h .where{font-family:var(--sans);font-size:.76rem;color:var(--muted);letter-spacing:.05em}
.card-x{position:absolute;top:.9rem;right:.9rem;width:1.8rem;height:1.8rem;border-radius:50%;
  font-size:1.1rem;line-height:1;color:var(--muted)}
.card-x:hover{background:#EFE7D9}
/* flex:1 1 auto + min-height:0 缺一不可。少了它，內容一長
   就撐破 max-height 被 overflow:hidden 切掉，而不是變成捲動。 */
.card-b{padding:1.1rem 1.4rem 1.5rem;flex:1 1 auto;min-height:0;overflow-y:auto}
.card-b p{margin:0 0 1rem;font-size:.88rem;line-height:1.9}
.card-b .note{padding-left:.85rem;border-left:2px solid var(--gold);color:var(--ink)}
.card-b ul.facts{margin:0 0 1rem;padding:0;list-style:none;font-family:var(--sans);
  font-size:.76rem;line-height:1.9;color:var(--muted)}
.card-b ul.facts li{padding-left:.9rem;position:relative}
.card-b ul.facts li::before{content:"·";position:absolute;left:.15rem;color:var(--gold)}
.sect{margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--line)}
.sect h3{margin:0 0 .55rem;font-family:var(--sans);font-size:.7rem;letter-spacing:.11em;
  color:var(--faint);font-weight:400}
.item{display:grid;grid-template-columns:1fr auto;gap:0 .8rem;align-items:baseline;
  padding:.5rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
a.item{text-decoration:none;color:inherit}
a.item .zh::after{content:"→";font-family:var(--latin);color:var(--gold);
  margin-left:.4rem;font-size:.85rem}
a.item:hover .zh{color:var(--gold)}
.item .zh{font-size:.88rem;letter-spacing:.03em}
.item .lat{display:block;font-family:var(--latin);font-style:italic;font-size:.74rem;
  letter-spacing:.08em;color:var(--muted)}
.item .part{font-family:var(--sans);font-size:.7rem;color:var(--faint);white-space:nowrap}

/* 第三層：品項卡 */
.back{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--sans);
  font-size:.72rem;letter-spacing:.08em;color:var(--muted);margin-bottom:.6rem}
.back:hover{color:var(--gold)}
button.item{width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:.5rem 0;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto;gap:0 .8rem;align-items:baseline}
button.item:last-child{border-bottom:0}
button.item:hover .zh{color:var(--gold)}
.kinw{font-family:var(--sans);font-size:.66rem;letter-spacing:.06em;color:var(--faint);
  border:1px solid var(--line);border-radius:999px;padding:.08rem .45rem;margin-left:.4rem}
.flag{display:inline-block;font-family:var(--sans);font-size:.67rem;letter-spacing:.08em;
  border:1px solid var(--gold);color:var(--gold);border-radius:999px;
  padding:.16rem .55rem;margin-bottom:.8rem}
.verify{background:rgba(184,150,90,.12);border-left:2px solid var(--gold);
  padding:.75rem .9rem;margin:0 0 1rem;font-family:var(--sans);font-size:.76rem;line-height:1.8}

.sorry{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.sorry[hidden]{display:none}
.sorry-box{background:var(--cream);border-radius:14px;box-shadow:0 10px 40px rgba(42,39,36,.18);
  padding:2rem;max-width:30rem;width:100%}
.sorry-box h2{margin:0 0 .9rem;font-size:1.25rem;font-weight:500;letter-spacing:.08em}
.sorry-box p{margin:0 0 1rem;font-size:.88rem;line-height:1.9}
.sorry-box ol{margin:0 0 1rem;padding-left:1.2rem;font-family:var(--sans);
  font-size:.8rem;line-height:2;color:var(--muted)}
.sorry-box b{font-weight:500;color:var(--ink)}
.sorry-box a{font-family:var(--sans);font-size:.8rem;color:var(--gold);text-decoration:none;
  border-bottom:1px solid transparent}
.sorry-box a:hover{border-bottom-color:var(--gold)}

@media (max-width:760px){
  .brand{padding:1rem 1.1rem} .brand h1{font-size:1.35rem}
  .tools{top:0;padding:1rem 1.1rem}
  .views{top:auto;bottom:3.2rem;margin-top:0;font-size:.72rem}
  .card{right:0;left:0;bottom:0;top:auto;transform:none;width:100%;
    max-height:60vh;border-radius:14px 14px 0 0}
  .hint{bottom:.8rem}
}

/* 小尺寸手機：控制列縮一排、提示收掉、字卡貼底留住地圖 */
@media (max-width:560px){
  .brand{padding:.75rem .9rem}
  .brand h1{font-size:1.08rem}
  .tools{padding:.75rem .9rem;gap:.3rem}
  .tool,.seg button{font-size:.66rem;padding:.28rem .5rem}
  .views{font-size:.66rem;gap:.55rem;bottom:2.6rem}
  .hint{display:none}
  .card{max-height:68dvh}
  .card-h{padding:1.05rem 1.05rem .8rem}
  .card-b{padding:.95rem 1.05rem 1.2rem}
}
</style>

/* ── 投影：等距長方 + 緯度修正。輪廓與產地共用，位置才會一致 ── */
const LAT0 = 23.6, LNG0 = 120.98, K = 11.8;
const COS0 = Math.cos(LAT0 * Math.PI / 180);
const px = lng => (lng - LNG0) * COS0 * K;
const pz = lat => -(lat - LAT0) * K;

const MAIN = TW.main.map(([lng, lat]) => [px(lng), pz(lat)]);

/* ── 中央山脈脊線（由北到南），海拔剖面照真實比例 ── */
const SPINE_LL = [
  [121.70,25.05,0.16],[121.56,24.82,0.42],[121.38,24.52,0.80],[121.26,24.26,0.90],
  [121.20,23.98,0.92],[121.08,23.70,0.96],[120.96,23.47,1.00],[120.92,23.22,0.93],
  [120.88,22.94,0.84],[120.85,22.66,0.66],[120.82,22.38,0.42],[120.79,22.08,0.14]
];
const SPINE = SPINE_LL.map(([lng, lat, h]) => ({x:px(lng), z:pz(lat), h}));

/* 點到脊線的距離、最近點的高度係數、以及在東側還是西側 */
function ridge(x, z){
  let best = 1e9, bh = 0, side = 1;
  for (let i = 0; i < SPINE.length - 1; i++){
    const a = SPINE[i], b = SPINE[i + 1];
    const dx = b.x - a.x, dz = b.z - a.z;
    const L = dx * dx + dz * dz;
    let t = L ? ((x - a.x) * dx + (z - a.z) * dz) / L : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = a.x + dx * t, cz = a.z + dz * t;
    const d = Math.hypot(x - cx, z - cz);
    if (d < best){
      best = d;
      bh = a.h + (b.h - a.h) * t;
      side = (x - cx) >= 0 ? 1 : -1;   // 東側為正
    }
  }
  return {d:best, h:bh, side};
}

/* 玉山 3952m。1 單位 ≈ 9.4 km，真實比例會矮到看不見，垂直誇張 12 倍。
   衰減寬度是照實際海拔回推的：山脈佔東側三分之二，
   西邊 40 km 外必須回到平地——嘉南平原是台灣最好認的特徵。 */
const MAXH = 5.2;
function heightAt(x, z){
  const r = ridge(x, z);
  // 山脈越高的地方越寬；南北兩端山勢低，山體也跟著收窄，
  // 不然屏東平原會被南段的山吃掉。
  const w = (r.side > 0 ? 0.85 : 1.15) + (r.side > 0 ? 0.95 : 1.95) * r.h;
  const q = r.d / w;
  let h = Math.exp(-q * q) * r.h;
  h += 0.022 * Math.exp(-(r.d / 6.5) * (r.d / 6.5)) * r.h;   // 丘陵的緩坡
  // 峰與鞍：沒有這個，中央山脈會是一道連續的牆
  h *= 0.74 + 0.26 * (0.5 + 0.5 * Math.sin(z * 2.35 + Math.cos(z * 0.9) * 1.6));
  h *= 0.92 + 0.08 * Math.cos(x * 2.1 + z * 1.3);
  return Math.max(0, h) * MAXH;
}

/* ── 點是否在島內 ───────────────────────── */
function inPoly(x, z, poly){
  let hit = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) hit = !hit;
  }
  return hit;
}

/* 擠出後要繞 X 軸轉 90°，那一轉會把 (x,y,z) 變成 (x,-z,y)。
   所以 shape 的 Y 要直接放世界座標的 z，不能放 -z，
   否則底座會南北鏡像、和地形網格錯開。 */
function shapeOf(poly){
  const s = new THREE.Shape();
  poly.forEach(([x, z], i) => i ? s.lineTo(x, z) : s.moveTo(x, z));
  s.closePath();
  return s;
}
function slab(poly, depth, color){

  const m = new THREE.Mesh(g, mat(color, {side:THREE.DoubleSide}));
  m.rotation.x = Math.PI / 2;
  m.position.y = -0.06;
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* ── 地形：格點網格，只留完全在島內的三角形 ── */
const BB = MAIN.reduce((a, [x, z]) => ({
  x0:Math.min(a.x0, x), x1:Math.max(a.x1, x),
  z0:Math.min(a.z0, z), z1:Math.max(a.z1, z)
}), {x0:1e9, x1:-1e9, z0:1e9, z1:-1e9});

const CELL = 0.34;
const NX = Math.ceil((BB.x1 - BB.x0) / CELL), NZ = Math.ceil((BB.z1 - BB.z0) / CELL);
const gx = i => BB.x0 + i * CELL, gz = j => BB.z0 + j * CELL;

const ins = new Uint8Array((NX + 1) * (NZ + 1));
const hgt = new Float32Array((NX + 1) * (NZ + 1));
for (let j = 0; j <= NZ; j++)
  for (let i = 0; i <= NX; i++){
    const k = j * (NX + 1) + i, x = gx(i), z = gz(j);
    ins[k] = inPoly(x, z, MAIN) ? 1 : 0;
    hgt[k] = ins[k] ? heightAt(x, z) : 0;
  }
/* 貼著海岸的那一圈壓到 0，地形才會順順地沒入岸邊 */
for (let j = 0; j <= NZ; j++)
  for (let i = 0; i <= NX; i++){
    const k = j * (NX + 1) + i;
    if (!ins[k]) continue;
    for (let dj = -1; dj <= 1; dj++)
      for (let di = -1; di <= 1; di++){
        const ii = i + di, jj = j + dj;
        if (ii < 0 || jj < 0 || ii > NX || jj > NZ || !ins[jj * (NX + 1) + ii]){
          hgt[k] = 0; di = dj = 2;
        }
      }
  }

/* 依高度上色：平原 → 林地 → 岩壁 → 雪線 */
/* 台灣是綠的。雪只給最高的那幾個峰尖，不然整條山脈會白成阿爾卑斯。 */
const BANDS = [
  [0.00, 0x9ACB72], [0.10, 0x83BD66], [0.26, 0x68A75E],
  [0.45, 0x51904F], [0.64, 0x6E8A5C], [0.80, 0x93886E],
  [0.93, 0xC4B9A6], [0.985, 0xF2EFE6]
];
const col = new THREE.Color();
function bandColor(h){
  const t = h / MAXH;
  let a = BANDS[0], b = BANDS[0];
  for (let i = 0; i < BANDS.length; i++){
    if (BANDS[i][0] <= t){ a = BANDS[i]; b = BANDS[Math.min(i + 1, BANDS.length - 1)]; }
  }
  const span = Math.max(1e-6, b[0] - a[0]);
  col.setHex(a[1]).lerp(new THREE.Color(b[1]), Math.min(1, (t - a[0]) / span));
  return col;
}

const pos = [], cols = [];
function pushVert(i, j){
  const k = j * (NX + 1) + i, h = hgt[k];
  pos.push(gx(i), h, gz(j));
  const c = bandColor(h);
  cols.push(c.r, c.g, c.b);
}
for (let j = 0; j < NZ; j++)
  for (let i = 0; i < NX; i++){
    const a = j * (NX + 1) + i, b = a + 1, c = a + NX + 1, d = c + 1;

    pushVert(i, j); pushVert(i, j + 1); pushVert(i + 1, j);
    pushVert(i + 1, j); pushVert(i, j + 1); pushVert(i + 1, j + 1);

const tg = new THREE.BufferGeometry();
tg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));

function treeAt(x, z, h, s){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 0.34, 5), mat(0x8A6A4A)));
  g.children[0].position.y = 0.17;
  const r = Math.random();

    r < 0.5 ? new THREE.ConeGeometry(0.26, 0.56, 6) : new THREE.SphereGeometry(0.26, 7, 5),
    mat(r < 0.5 ? 0x4E8C5A : 0x66A764));
  top.position.y = r < 0.5 ? 0.62 : 0.56;
  g.add(top);
  g.children.forEach(c => { c.castShadow = true; c.receiveShadow = true; });
  g.position.set(x, h, z);
  g.scale.setScalar(s);
  return g;
}

/* 每個產地不是插一支釘子，是一個小場景：房子、作物、樹、蒸餾釜。
   尺寸刻意放大成桌遊比例——照真實比例會小到看不見。 */
const ROOFS = [0xD9663F, 0xF2C14E, 0x5C8FB8, 0xE08A5A, 0x7FAE66, 0xC97F9B];
const SHIRTS = [0xD9663F, 0xF2C14E, 0x5C8FB8, 0xFBF3E2, 0x7FAE66, 0xB8965A];
const CROPS = [0x9B8EC4, 0xBFD16B, 0xF2EDD8, 0x9E5570, 0x8EA3C4, 0xE0A3B8];

function littleHouse(roof, s){
  const g = new THREE.Group();
  const w = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.62, 0.78), mat(0xFBF3E2));
  w.position.y = 0.31; w.castShadow = true;
  const r = new THREE.Mesh(new THREE.ConeGeometry(0.78, 0.5, 4), mat(roof));
  r.position.y = 0.87; r.rotation.y = Math.PI / 4; r.castShadow = true;
  const win = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.26, 0.06), mat(0x3E5260));
  win.position.set(0.18, 0.34, 0.4);
  windows.push(win);
  g.add(w, r, win);
  g.scale.setScalar(s || 1);
  return g;
}
function littleStill(){
  const g = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.3, 0.5, 10), mat(0xCE8B4A));
  pot.position.y = 0.25; pot.castShadow = true;
  const cap = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.3, 10), mat(0xCE8B4A));
  cap.position.y = 0.65;
  const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4, 6), mat(0xCE8B4A));
  pipe.position.set(0.2, 0.86, 0); pipe.rotation.z = -0.7;
  g.add(pot, cap, pipe);
  return g;
}
function cropPatch(c){
  const g = new THREE.Group();
  g.add(new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.07, 0.62), mat(0xC9A878)));
  g.children[0].position.y = 0.035;
  for (let i = 0; i < 9; i++){
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.075, 6, 5), mat(c));
    b.position.set((i % 3 - 1) * 0.24, 0.13, (Math.floor(i / 3) - 1) * 0.2);
    g.add(b);
  }
  return g;
}
function doll(shirt){
  const g = new THREE.Group();
  /* 身體下緣要比腿窄，腿才露得出來 */
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.115, 0.088, 0.27, 7), mat(shirt));
  b.position.y = 0.40;
  const hd = new THREE.Mesh(new THREE.SphereGeometry(0.125, 8, 7), mat(0xE8B98E));
  hd.position.y = 0.63;
  const hr = new THREE.Mesh(new THREE.SphereGeometry(0.132, 8, 6), mat(0x3A2E28));
  hr.position.set(0, 0.66, -0.015);
  /* 腳要能擺動，所以每一隻包一個以髖部為原點的 pivot，
     腿往下掛一半、腳掌再掛到底——不然旋轉會變成繞著腿的中心轉。 */
  const legMat = mat(0x4A5560), shoeMat = mat(0x3A2E28);
  const leg = () => {
    const pv = new THREE.Group();
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.042, 0.042, 0.27, 5), legMat);
    m.position.y = -0.135;
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.072, 0.046, 0.12), shoeMat);
    foot.position.set(0, -0.275, 0.024);
    pv.add(m, foot); return pv;
  };
  const l1 = leg(); l1.position.set(-0.058, 0.27, 0);
  const l2 = leg(); l2.position.set(0.058, 0.27, 0);
  g.add(b, hd, hr, l1, l2);
  g.__legs = [l1, l2];
  return g;
}

const pins = [], folk = [], steams = [];
SITES.forEach((o, n) => {
  const x = px(o.lng), z = pz(o.lat);
  const h = inPoly(x, z, MAIN) ? heightAt(x, z) : 0;
  const scene0 = new THREE.Group();
  scene0.position.set(x, h, z);

  /* 產地的房子、作物畦、蒸餾器都是固定的局部座標。產地一靠海岸，
     轉到哪個方向就決定了它們會不會掛到海上。所以先轉一圈找角度：
     把每個東西的位置換算到世界座標，全部要在島上、而且和產地的
     高度差要小（不然房子會卡在山壁上）。 */
  const LOCAL = [[-0.55,-0.35,0.55],[0.62,0.1,0.45],[0.62,-0.62,0.45],
                 [-0.45,0.6,0.42],[0.55,0.3,0.3],[1.0,-0.12,0.3]];
  let bestA = 0, bestS = 1e9;
  for (let k = 0; k < 48; k++){
    const th = k / 48 * 6.283, ca = Math.cos(th), sa = Math.sin(th);
    let bad = 0, dh = 0;
    LOCAL.forEach(([lx, lz]) => {
      const wx = x + lx * ca + lz * sa, wz = z - lx * sa + lz * ca;
      if (!inPoly(wx, wz, MAIN)){ bad++; return; }
      dh = Math.max(dh, Math.abs(heightAt(wx, wz) - h));
    });
    const s = bad * 20 + dh;
    if (s < bestS){ bestS = s; bestA = th; }
  }
  scene0.rotation.y = bestA;
  /* 這些東西實際落在哪，待會兒讓娃娃繞開 */
  const caB = Math.cos(bestA), saB = Math.sin(bestA);
  const props = LOCAL.map(([lx, lz, rr]) =>
    ({x:x + lx * caB + lz * saB, z:z - lx * saB + lz * caB, r:rr}));

  const roof = ROOFS[n % ROOFS.length];
  const house = littleHouse(roof, o.hero ? 1.35 : 1.0);
  house.position.set(-0.55, 0, -0.35);
  scene0.add(house);

  if (o.kind === 'forest'){
    for (let i = 0; i < 3; i++){
      const t = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 6), mat(0x4E8C5A));
      t.position.set(0.55 + (i % 2) * 0.45, 0.4, 0.3 - i * 0.42);
      t.castShadow = true; scene0.add(t);
    }
  } else {
    const p1 = cropPatch(CROPS[n % CROPS.length]);
    p1.position.set(0.62, 0, 0.1); scene0.add(p1);
    const p2 = cropPatch(CROPS[(n + 3) % CROPS.length]);
    p2.position.set(0.62, 0, -0.62); scene0.add(p2);
  }
  if (o.hero || o.kind === 'own_farm' || n % 3 === 0){
    const st = littleStill();
    st.position.set(-0.45, 0, 0.6);
    scene0.add(st);
    steams.push({at:new THREE.Vector3(x, h + 1.0, z), puffs:[]});
  }

  /* 名牌的掛點：一根細桿，點了才知道是哪一處 */
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.3, 6), mat(0xFFF8F0));
  post.position.y = 0.65;
  const c = low(o) ? 0xA8A29A : (o.hero ? 0xD9663F : 0xB8965A);
  const head = new THREE.Mesh(new THREE.SphereGeometry(o.hero ? 0.2 : 0.16, 10, 8), mat(c));
  head.position.y = 1.4;
  scene0.add(post, head);

  world.add(scene0);
  pins.push({o, g:scene0, head, at:new THREE.Vector3(x, h + 2.0, z), n});

  /* 娃娃：繞著自己的產地走。路徑要先挑過——沿著這個圓採樣一圈，
     整圈都要在島上，而且高低差要小，不然娃娃會走進中央山脈裡。
     半徑下限 1.25 讓它避開自家的房子、蒸餾器與作物區。 */
  /* 娃娃走的圓：圓心可以離產地一段距離，半徑也可變。整圈都要在
     島上、高低差要小、還不能碰到剛剛擺好的房子與作物畦。
     只調半徑是不夠的——產地本身就貼著海岸時，再小的圓也會出海，
     得讓圓心往內陸挪。 */
  /* 條件是硬的，不是「挑最不糟的」：整圈都要在島上、不能碰到
     房子與作物、而且高低差要小於 0.34 單位（約 260 公尺）。
     關山那種四周都是陡坡的產地本來就沒有平地可走，找不到就
     不放人——寧可少一個人偶，也不要一個爬上山頂的幽靈。 */
  const MAXDROP = 0.34;
  const pickOrbit = () => {
    for (let k = 0; k < 500; k++){
      const ang = Math.random() * 6.283, off = Math.random() * 1.6;
      const ox = x + Math.cos(ang) * off, oz = z + Math.sin(ang) * off;
      const rr = 0.25 + Math.random() * 1.0;
      let lo = 1e9, hi = -1e9, ok = true;
      for (let s = 0; s < 20 && ok; s++){
        const a = s / 20 * 6.283;
        const px = ox + Math.cos(a) * rr, pz = oz + Math.sin(a) * rr;
        if (!inPoly(px, pz, MAIN)){ ok = false; break; }
        for (const q of props)
          if (Math.hypot(px - q.x, pz - q.z) < q.r){ ok = false; break; }
        if (!ok) break;
        const hh = heightAt(px, pz);
        if (hh < lo) lo = hh;
        if (hh > hi) hi = hh;
        if (hi - lo > MAXDROP){ ok = false; break; }
      }
      if (ok) return {ox, oz, rr};
    }
    return null;
  };
  const many = o.hero ? 4 : 2;
  for (let i = 0; i < many; i++){
    const ob = pickOrbit();
    if (!ob) continue;                 // 這個產地四周沒有平地可走
    const d = doll(SHIRTS[(n + i) % SHIRTS.length]);
    /* 線速度 = 角速度 × 半徑。圓挑小了角速度就得調大，
       否則走小圈的人看起來像在慢動作。 */
    const lin = 0.45 + Math.random() * 0.2;
    d.userData = {cx:ob.ox, cz:ob.oz, h, r:ob.rr, a:Math.random() * 6.28,
      sp:(lin / Math.max(0.45, ob.rr)) * (i % 2 ? 1 : -1)};
    world.add(d); folk.push(d);
  }
});

const v3 = new THREE.Vector3();
function placeTags(){
  const W = innerWidth, H = innerHeight;
  const vis = [];
  pins.forEach(p => {
    v3.copy(p.at).project(camera);
    const ok = v3.z < 1;
    p.tag.classList.toggle('off', !ok);
    if (!ok) return;
    vis.push({p, x:(v3.x * 0.5 + 0.5) * W, y:(-v3.y * 0.5 + 0.5) * H});
  });
  // 屏東那幾個點擠在一起，名牌往下讓開
  vis.sort((a, b) => a.y - b.y);
  for (let i = 1; i < vis.length; i++){
    for (let j = 0; j < i; j++){
      if (Math.abs(vis[i].x - vis[j].x) < 22 && Math.abs(vis[i].y - vis[j].y) < 19){
        vis[i].y = vis[j].y + 19;
      }
    }
  }
  vis.forEach(({p, x, y}) => {
    p.tag.style.left = x.toFixed(0) + 'px';
    p.tag.style.top = y.toFixed(0) + 'px';
  });
}

/* ── 卡片 ───────────────────────────────── */
const card = document.getElementById('card');
const PARTS = DATA.parts || {};

/* ── 第三層：品項卡 ─────────────────────────────────
   原本點產地只到「列出品項」就停了，品項點不下去。
   補上之後層次和 puma 一樣深：產地 → 品項 → 親緣。
   親緣從學名自動算，不是手填。                   */
function binomial(lat){
  if (!lat) return [null, null];
  const k = String(lat).trim().split(/\s+/);
  const g = (k[0] || '').replace(/[^A-Za-z]/g, '') || null;
  let s = null;
  if (k[1] === '×' || k[1] === 'x'){ if (k[2]) s = '× ' + k[2]; }
  else if (k[1] && !/^sp+\.$/i.test(k[1])) s = k[1];
  return [g, s];
}
const ALL = DATA.items, byGenus = {}, bySpecies = {};
ALL.forEach(it => {
  const [g, s] = binomial(it.latin);
  it.__g = g; it.__s = s;
  if (g) (byGenus[g] = byGenus[g] || []).push(it);
  if (g && s){ const k = g + ' ' + s; (bySpecies[k] = bySpecies[k] || []).push(it); }
});
const kinOf = it => {
  const same = (bySpecies[it.__g + ' ' + it.__s] || []).filter(x => x.id !== it.id);
  const gen = (byGenus[it.__g] || []).filter(x => x.id !== it.id && !same.some(y => y.id === x.id));
  return {same, gen};
};
const TYPE_ZH = {hydrosol:'純露', essential_oil:'精油', both:'純露 · 精油'};
let cameFrom = null;

function itemBtns(items){
  if (!items.length) return '<p style="color:var(--faint);font-size:.82rem">還沒有品項掛在這裡。</p>';
  return items.map(it => {
    const k = kinOf(it), n = k.same.length + k.gen.length;
    return `<button class="item" data-item="${it.id}">
      <span><span class="zh">${txt(it.name)}</span>
      <span class="lat">${it.latin || ''}</span></span>
      <span class="part">${PARTS[it.part] ? txt(PARTS[it.part]) : ''}${
        n ? `<span class="kinw">親緣 ${n}</span>` : ''}</span>
    </button>`;
  }).join('');
}
function showItem(id){
  const it = ALL.find(x => x.id === id); if (!it) return;
  const origins = (it.originIds || []).map(i => byOrigin[i]).filter(Boolean);
  const k = kinOf(it);
  const kv = [];
  if (origins.length) kv.push(['產地', origins.map(o =>
    `${txt(o.name)}<span style="color:var(--faint)">　${txt(o.where)}</span>`).join('<br>')]);
  if (PARTS[it.part]) kv.push(['萃取', txt(PARTS[it.part])]);
  if (it.forms || it.type) kv.push(['型態', it.forms ? it.forms.join(' · ') : TYPE_ZH[it.type] || it.type]);
  if (it.season && txt(it.season)) kv.push(['時節', txt(it.season)]);
  if (it.aroma && txt(it.aroma)) kv.push(['氣味', txt(it.aroma)]);
  const links = [];
  if (it.articleUrl) links.push(`<a class="go" href="${it.articleUrl}" target="_blank" rel="noopener">讀這一篇 →</a>`);
  if (it.videoId) links.push(`<a class="go" href="https://www.youtube.com/watch?v=${it.videoId}" target="_blank" rel="noopener">${it.series || '影片'} →</a>`);
  document.getElementById('c-eyebrow').textContent = it.latin || '品項';
  document.getElementById('c-title').textContent = txt(it.name);
  document.getElementById('c-where').textContent =
    origins.map(o => txt(o.name)).join('、') || '尚無產地';
  document.getElementById('c-body').innerHTML = `
    ${cameFrom ? `<button class="back" data-back="1">← 回到 ${txt(byOrigin[cameFrom].name)}</button>` : ''}
    ${it.confidence !== 'high' ? `<span class="flag">${it.confidence === 'low' ? '產地待確認' : '細節待確認'}</span>` : ''}
    ${NOTES && it.verify ? `<p class="verify">${it.verify}</p>` : ''}
    <dl class="kv">${kv.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
    ${it.story && txt(it.story) ? `<p class="note">${txt(it.story)}</p>` : ''}
    ${k.same.length ? `<div class="sect"><h3>同一個種 · ${it.__g} ${it.__s}</h3>${itemBtns(k.same)}</div>` : ''}
    ${k.gen.length ? `<div class="sect"><h3>同屬 · ${it.__g}</h3>${itemBtns(k.gen)}</div>` : ''}
    ${links.length ? `<div class="sect"><h3>延伸</h3>${links.join('<br>')}</div>` : ''}`;
  document.getElementById('c-body').scrollTop = 0;
  card.hidden = false;
}
document.getElementById('c-body').addEventListener('click', e => {
  const b = e.target.closest('[data-item]');
  if (b){ showItem(b.dataset.item); return; }
  if (e.target.closest('[data-back]') && cameFrom) open(cameFrom, false);
});

function open(id, fly){
  const o = byOrigin[id]; if (!o) return;
  cameFrom = id;
  document.getElementById('c-eyebrow').innerHTML =
    `<span class="no">${no(o)}</span>` + (DATA.kinds[o.kind] ? txt(DATA.kinds[o.kind]) : '產地');
  document.getElementById('c-title').textContent = txt(o.name);
  document.getElementById('c-where').textContent =
    `${txt(o.where)}　${o.lat.toFixed(3)}°N ${o.lng.toFixed(3)}°E`;
  document.getElementById('c-body').innerHTML = `
    ${o.confidence !== 'high' ? `<span class="flag">${low(o) ? '產地待確認' : '細節待確認'}</span>` : ''}
    ${NOTES && o.verify ? `<p class="verify">${o.verify}</p>` : ''}
    ${o.note && txt(o.note) ? `<p class="note">${txt(o.note)}</p>` : ''}
    ${o.facts ? `<ul class="facts">${o.facts.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
    <div class="sect"><h3>這裡來的 ${o.items.length} 項</h3>
      ${itemBtns(o.items)}
    </div>`;
  document.getElementById('c-body').scrollTop = 0;
  card.hidden = false;
  pins.forEach(p => p.tag.classList.toggle('on', p.o.id === id));
  hideHint();
  if (fly){ spinning = false; tSpin.setAttribute('aria-pressed', 'false'); }
}
document.getElementById('card-x').onclick = () => {
  card.hidden = true; pins.forEach(p => p.tag.classList.remove('on'));
};
addEventListener('keydown', e => { if (e.key === 'Escape') card.hidden = true; });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('click', e => {
  if (moved) return;
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  for (const p of pins) if (ray.intersectObject(p.g, true).length){ open(p.o.id, true); return; }
});

/* ── 鏡頭 ───────────────────────────────── */
const HOME = {theta:-0.38, phi:0.82, dist:62};
const CAM = Object.assign({}, HOME);
const TARGET = new THREE.Vector3(0, 1.5, 0);
let spinning = true;
let BIRD_MIN = 0.18;
const HOME_PHI_MIN = 0.18;
function applyCam(){
  CAM.phi = Math.max(BIRD_MIN, Math.min(1.42, CAM.phi));
  CAM.dist = Math.max(22, Math.min(140, CAM.dist));
  camera.position.set(
    TARGET.x + CAM.dist * Math.sin(CAM.phi) * Math.sin(CAM.theta),
    TARGET.y + CAM.dist * Math.cos(CAM.phi),
    TARGET.z + CAM.dist * Math.sin(CAM.phi) * Math.cos(CAM.theta));
  camera.lookAt(TARGET);
}
let dragging = false, moved = false, lx = 0, ly = 0;
const tp = new Map();
const gap = () => { const [a, b] = [...tp.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
let gap0 = 0, d0 = 0;
host.addEventListener('pointerdown', e => {
  tp.set(e.pointerId, {x:e.clientX, y:e.clientY});
  host.setPointerCapture(e.pointerId);
  moved = false; spinning = false; tSpin.setAttribute('aria-pressed', 'false');
  if (tp.size === 1){ dragging = true; lx = e.clientX; ly = e.clientY; host.classList.add('grabbing'); }
  else if (tp.size === 2){ dragging = false; host.classList.remove('grabbing'); gap0 = gap(); d0 = CAM.dist; }
});
host.addEventListener('pointermove', e => {
  if (!tp.has(e.pointerId)) return;
  tp.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (tp.size === 2){ if (gap0 > 0){ CAM.dist = d0 * gap0 / gap(); applyCam(); moved = true; } return; }
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  CAM.theta -= dx * 0.006; CAM.phi -= dy * 0.0046;
  lx = e.clientX; ly = e.clientY;
  applyCam(); hideHint();
});
['pointerup','pointercancel'].forEach(t => host.addEventListener(t, e => {
  tp.delete(e.pointerId);
  if (tp.size < 2) gap0 = 0;
  if (tp.size === 0){ dragging = false; host.classList.remove('grabbing'); }
}));
host.addEventListener('wheel', e => {
  e.preventDefault(); CAM.dist *= 1 + e.deltaY * 0.0014; applyCam(); hideHint();
}, {passive:false});


/* 鳥瞰：不是另一個場景，只是把相機搬到正上方。
   puma 的作法一樣——相機移到目標上空、放寬垂直角下限、補間飛過去。 */
const tBird = document.getElementById('t-bird');
let birdOn = false;
function glideCam(toPhi, toDist, ms){
  const a = {phi:CAM.phi, dist:CAM.dist}, t0 = performance.now(), me = anim = {};
  (function step(now){
    if (anim !== me) return;
    const k = Math.min(1, (now - t0) / (ms || 850));
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    CAM.phi = a.phi + (toPhi - a.phi) * e;
    CAM.dist = a.dist + (toDist - a.dist) * e;
    applyCam();
    if (k < 1) requestAnimationFrame(step); else if (anim === me) anim = null;
  })(t0);
}
if (tBird) tBird.onclick = () => {
  birdOn = !birdOn;
  tBird.setAttribute('aria-pressed', String(birdOn));
  BIRD_MIN = birdOn ? 0.06 : HOME_PHI_MIN;
  glideCam(birdOn ? 0.07 : HOME.phi, birdOn ? CAM.dist * 0.92 : HOME.dist);
};

/* ── 工具列 ─────────────────────────────── */
const hint = document.getElementById('hint');
let hintGone = false;
function hideHint(){ if (!hintGone){ hintGone = true; hint.classList.add('gone'); } }
setTimeout(hideHint, 7000);

const tTags = document.getElementById('t-tags');
tTags.onclick = () => {
  const on = tTags.getAttribute('aria-pressed') === 'true';
  tTags.setAttribute('aria-pressed', String(!on));
  document.body.classList.toggle('notags', on);
};
const tSpin = document.getElementById('t-spin');
tSpin.onclick = () => { spinning = !spinning; tSpin.setAttribute('aria-pressed', String(spinning)); };
document.getElementById('t-reset').onclick = () => {
  Object.assign(CAM, HOME); applyCam();
  spinning = true; tSpin.setAttribute('aria-pressed', 'true');
};

let mk = 1;
const MOOD_KEYS = ['dawn', 'day', 'dusk', 'night'];
let moodNow = 'day', moodFrom = MOODS.day, moodTo = MOODS.day;
const cA = new THREE.Color(), cB = new THREE.Color();
const mixc = (t, a, b, q) => { cA.setHex(a); cB.setHex(b); t.copy(cA).lerp(cB, q); };
const lerpn = (a, b, q) => a + (b - a) * q;

/* 從畫面目前的實際值出發，所以轉場途中再點也不會跳一下 */
function currentMood(){
  return {bg:scene.background.getHex(), fog:scene.fog ? scene.fog.color.getHex() : 0,
    hemiSky:hemi.color.getHex(), hemiGnd:hemi.groundColor.getHex(), hemiI:hemi.intensity,
    sun:sun.color.getHex(), sunI:sun.intensity,
    pos:[sun.position.x, sun.position.y, sun.position.z],
    sea:seaMat.color.getHex(), amb:amb.intensity, lit:moodTo.lit};
}
MOOD_KEYS.forEach(key => {
  const btn = document.getElementById('m-' + key);
  if (!btn) return;
  btn.onclick = () => {
    if (moodNow === key) return;
    moodFrom = currentMood(); moodTo = MOODS[key]; mk = 0; moodNow = key;
    MOOD_KEYS.forEach(k2 => {
      const b2 = document.getElementById('m-' + k2);
      if (b2) b2.setAttribute('aria-pressed', String(k2 === key));
    });
  };
});
function mood(q){
  mixc(scene.background, moodFrom.bg, moodTo.bg, q);
  if (scene.fog) mixc(scene.fog.color, moodFrom.fog, moodTo.fog, q);
  mixc(hemi.color, moodFrom.hemiSky, moodTo.hemiSky, q);
  mixc(hemi.groundColor, moodFrom.hemiGnd, moodTo.hemiGnd, q);
  mixc(sun.color, moodFrom.sun, moodTo.sun, q);
  mixc(seaMat.color, moodFrom.sea, moodTo.sea, q);
  sun.intensity = lerpn(moodFrom.sunI, moodTo.sunI, q);
  hemi.intensity = lerpn(moodFrom.hemiI, moodTo.hemiI, q);
  amb.intensity = lerpn(moodFrom.amb, moodTo.amb, q);
  sun.position.set(lerpn(moodFrom.pos[0], moodTo.pos[0], q),
                   lerpn(moodFrom.pos[1], moodTo.pos[1], q),
                   lerpn(moodFrom.pos[2], moodTo.pos[2], q));
  const lit = q > 0.5 ? moodTo.lit : moodFrom.lit;
  windows.forEach(w => w.material = mat(lit ? 0xFFD79A : 0x3E5260));
}

/* ── 雲 ─────────────────────────────────── */
const clouds = [];
const cloudMat = new THREE.MeshPhongMaterial({color:0xFFFFFF, flatShading:true,
  shininess:0, specular:0x000000, transparent:true, opacity:0.88});
for (let i = 0; i < 9; i++){
  const g = new THREE.Group();
  [[0,0,0,1.5],[1.3,.2,.3,1.1],[-1.2,.1,-.2,1.0],[.4,.6,-.4,0.9]].forEach(([x,y,z,r]) => {
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), cloudMat);
    b.position.set(x, y, z); g.add(b);
  });
  // 要夠高、夠小，不然從側面看會像海上多出一塊白色陸地
  g.position.set(-60 + Math.random() * 120, 17 + Math.random() * 8, -45 + Math.random() * 90);
  g.scale.setScalar(0.55 + Math.random() * 0.5);
  g.userData.s = 0.5 + Math.random() * 0.6;
  world.add(g); clouds.push(g);
}

/* ── 動畫 ───────────────────────────────── */
function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  applyCam();
}
addEventListener('resize', resize);

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(loop);
  if (mk < 1){ mk = Math.min(1, mk + dt * 1.1); mood(mk); }
  if (spinning){ CAM.theta -= dt * 0.045; applyCam(); }
  clouds.forEach(c => {
    c.position.x += c.userData.s * dt * 2.4;
    if (c.position.x > 70) c.position.x = -70;
  });
  pins.forEach(p => {
    p.head.position.y = 1.4 + Math.sin(now / 540 + p.n) * 0.06;
  });
  // 娃娃繞著自己的產地走，走路有上下晃
  folk.forEach(d => {
    const u = d.userData;
    u.a += u.sp * dt;
    /* 步頻跟著實際走的線速度走，不然會踩碎步滑過去，像幽靈 */
    u.ph = (u.ph || 0) + Math.abs(u.sp) * u.r * dt * 7;
    const sw = Math.sin(u.ph);
    /* 踩著地形走，不是浮在固定高度上——不然會穿進山裡 */
    const px = u.cx + Math.cos(u.a) * u.r, pz = u.cz + Math.sin(u.a) * u.r;
    const gy = inPoly(px, pz, MAIN) ? heightAt(px, pz) : u.h;
    u.y = u.y === undefined ? gy : u.y + (gy - u.y) * Math.min(1, dt * 9);
    d.position.set(px, u.y + Math.abs(sw) * 0.03, pz);
    d.rotation.y = -u.a + (u.sp > 0 ? Math.PI / 2 : -Math.PI / 2);
    if (d.__legs){ d.__legs[0].rotation.x = sw * 0.6;
                   d.__legs[1].rotation.x = -sw * 0.6; }
  });
  steams.forEach(s => s.puffs.forEach(p => {
    p.userData.t = (p.userData.t + dt * 0.34) % 1;
    const t = p.userData.t;
    p.position.set(s.at.x - 0.45 + Math.sin(t * 5) * 0.12, s.at.y + t * 1.5,
                   s.at.z + 0.6 + Math.cos(t * 4) * 0.1);
    p.scale.setScalar(0.5 + t * 1.3);
    p.material.opacity = 0.45 * (1 - t);
  }));
  boats.forEach(b => {
    const u = b.userData;
    u.a += u.sp * dt;
    b.position.set(Math.cos(u.a) * u.r, -1.0 + Math.sin(now / 700 + u.a) * 0.07, Math.sin(u.a) * u.r);
    b.rotation.y = -u.a;
  });
  placeTags();
  renderer.render(scene, camera);
}
resize(); applyCam(); mood(1);
requestAnimationFrame(loop);

})();
</script>
