<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>香氣島群</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Noto+Serif+TC:wght@400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap">
<style>
:root{
  --ink:#2A2724; --cream:#FFF8F0; --line:#E2D9C8; --gold:#B8965A;
  --muted:#7A756D; --faint:#A8A29A;
  --serif:"Noto Serif TC","Songti TC",serif;
  --latin:"Cormorant Garamond",Georgia,serif;
  --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --shadow:0 2px 10px rgba(42,39,36,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#BCDCE8;color:var(--ink);
  font-family:var(--serif);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

#scene{position:fixed;inset:0;touch-action:none;cursor:grab}
#scene.grabbing{cursor:grabbing}
canvas{display:block}

#tags{position:fixed;inset:0;pointer-events:none;z-index:2}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;
  background:var(--cream);border-radius:999px;padding:.34rem .76rem;
  box-shadow:var(--shadow);white-space:nowrap;cursor:pointer;
  font-family:var(--sans);font-size:.78rem;font-weight:500;letter-spacing:.04em;
  display:flex;align-items:center;gap:.4rem;transition:transform .16s,box-shadow .16s,opacity .2s}
.tag:hover,.tag.on{transform:translate(-50%,-100%) scale(1.07);
  box-shadow:0 5px 18px rgba(42,39,36,.22)}

.tag .no{font-family:var(--latin);font-size:.74rem;font-weight:500;color:var(--gold);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.card-h .eyebrow .no{font-family:var(--latin);letter-spacing:.2em;color:var(--gold);margin-right:.5rem}
.tag .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);flex:none}
.tag.low .dot{background:var(--faint)}
.tag.tw .dot{background:#D9663F}
.tag .n{font-family:var(--latin);font-size:.72rem;color:var(--faint)}
.tag::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--cream)}
.tag.off{opacity:0;pointer-events:none}
body.notags .tag{opacity:0;pointer-events:none}

.brand{position:fixed;top:0;left:0;z-index:3;padding:1.6rem 1.8rem;
  display:flex;flex-direction:column;gap:.4rem;pointer-events:none}
.brand .mk{font-family:var(--latin);letter-spacing:.34em;font-size:.72rem;
  text-transform:uppercase;color:#5E6B63}
.brand h1{margin:0;font-size:1.9rem;font-weight:500;letter-spacing:.14em;
  text-shadow:0 1px 10px rgba(255,255,255,.5)}
.brand p{margin:0;font-family:var(--sans);font-size:.76rem;letter-spacing:.07em;color:#5E6B63}

.views{position:fixed;left:50%;top:0;transform:translateX(-50%);z-index:3;
  margin-top:1.6rem;display:flex;gap:.2rem;background:var(--cream);
  border-radius:999px;padding:.28rem;box-shadow:var(--shadow);
  font-family:var(--sans);font-size:.75rem;letter-spacing:.06em}
.views a,.views span{padding:.3rem .78rem;border-radius:999px;text-decoration:none;
  color:var(--muted);white-space:nowrap}
.views a:hover{color:var(--ink);background:#EFE7D9}
.views [aria-current]{background:var(--ink);color:var(--cream)}

.tools{position:fixed;top:0;right:0;z-index:3;padding:1.6rem 1.8rem;
  display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}
.tool{background:var(--cream);border-radius:999px;padding:.4rem .85rem;
  box-shadow:var(--shadow);font-family:var(--sans);font-size:.75rem;
  letter-spacing:.06em;display:inline-flex;align-items:center;gap:.38rem;transition:transform .15s}
.tool:hover{transform:translateY(-1px)}
.tool[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.tool svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}


/* 四段光線 */
.seg{display:inline-flex;align-items:center;background:var(--cream);border-radius:999px;
  padding:.22rem;box-shadow:var(--shadow);gap:.08rem}
.seg button{width:2.15rem;height:1.75rem;border-radius:999px;display:grid;place-items:center;
  color:var(--muted);transition:background .18s,color .18s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--cream)}
.seg svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}

.hint{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);z-index:3;
  font-family:var(--sans);font-size:.74rem;letter-spacing:.07em;color:#5E6B63;
  background:rgba(255,248,240,.82);padding:.4rem .9rem;border-radius:999px;
  transition:opacity .4s;pointer-events:none}
.hint.gone{opacity:0}

.card{position:fixed;z-index:4;right:1.8rem;top:50%;transform:translateY(-50%);
  width:min(22rem,calc(100vw - 3.6rem));max-height:min(32rem,calc(100vh - 8rem));
  background:var(--cream);border-radius:14px;box-shadow:0 10px 40px rgba(42,39,36,.22);
  display:flex;flex-direction:column;overflow:hidden}
.card[hidden]{display:none}
.card-h{padding:1.4rem 1.4rem .95rem;border-bottom:1px solid var(--line);position:relative;flex:none}
.card-h .eyebrow{font-family:var(--latin);font-size:.72rem;letter-spacing:.22em;color:var(--gold)}
.card-h h2{margin:.28rem 0 .1rem;font-size:1.3rem;font-weight:500;letter-spacing:.08em}
.card-h .where{font-family:var(--sans);font-size:.76rem;color:var(--muted);letter-spacing:.05em}
.card-x{position:absolute;top:.9rem;right:.9rem;width:1.8rem;height:1.8rem;border-radius:50%;
  font-size:1.1rem;line-height:1;color:var(--muted)}
.card-x:hover{background:#EFE7D9}
.card-b{padding:1.1rem 1.4rem 1.5rem;overflow-y:auto}
.card-b p{margin:0 0 1rem;font-size:.88rem;line-height:1.9}
.card-b .note{padding-left:.85rem;border-left:2px solid var(--gold)}
.card-b ul.facts{margin:0 0 1rem;padding:0;list-style:none;font-family:var(--sans);
  font-size:.76rem;line-height:1.9;color:var(--muted)}
.card-b ul.facts li{padding-left:.9rem;position:relative}
.card-b ul.facts li::before{content:"·";position:absolute;left:.15rem;color:var(--gold)}
.sect{margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--line)}
.sect h3{margin:0 0 .55rem;font-family:var(--sans);font-size:.7rem;letter-spacing:.11em;
  color:var(--faint);font-weight:400}
.item{display:grid;grid-template-columns:1fr auto;gap:0 .8rem;align-items:baseline;
  padding:.5rem 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
a.item{text-decoration:none;color:inherit}
a.item .zh::after{content:"→";font-family:var(--latin);color:var(--gold);
  margin-left:.4rem;font-size:.85rem}
a.item:hover .zh{color:var(--gold)}
.item .zh{font-size:.88rem;letter-spacing:.03em}
.item .lat{display:block;font-family:var(--latin);font-style:italic;font-size:.74rem;
  letter-spacing:.08em;color:var(--muted)}
.item .part{font-family:var(--sans);font-size:.7rem;color:var(--faint);white-space:nowrap}
.go{display:inline-flex;align-items:center;gap:.4rem;margin-top:.3rem;
  font-family:var(--sans);font-size:.78rem;letter-spacing:.06em;color:var(--gold);
  text-decoration:none;border-bottom:1px solid transparent;padding-bottom:1px}
.go:hover{border-bottom-color:var(--gold)}

/* 第三層：品項卡 */
.back{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--sans);
  font-size:.72rem;letter-spacing:.08em;color:var(--muted);margin-bottom:.6rem}
.back:hover{color:var(--gold)}
button.item{width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:.5rem 0;border-bottom:1px solid var(--line);
  display:grid;grid-template-columns:1fr auto;gap:0 .8rem;align-items:baseline}
button.item:last-child{border-bottom:0}
button.item:hover .zh{color:var(--gold)}
.kinw{font-family:var(--sans);font-size:.66rem;letter-spacing:.06em;color:var(--faint);
  border:1px solid var(--line);border-radius:999px;padding:.08rem .45rem;margin-left:.4rem}
.flag{display:inline-block;font-family:var(--sans);font-size:.67rem;letter-spacing:.08em;
  border:1px solid var(--gold);color:var(--gold);border-radius:999px;
  padding:.16rem .55rem;margin-bottom:.8rem}
.verify{background:rgba(184,150,90,.12);border-left:2px solid var(--gold);
  padding:.75rem .9rem;margin:0 0 1rem;font-family:var(--sans);font-size:.76rem;line-height:1.8}

.sorry{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.sorry[hidden]{display:none}
.sorry-box{background:var(--cream);border-radius:14px;box-shadow:0 10px 40px rgba(42,39,36,.18);
  padding:2rem;max-width:30rem;width:100%}
.sorry-box h2{margin:0 0 .9rem;font-size:1.25rem;font-weight:500;letter-spacing:.08em}
.sorry-box p{margin:0 0 1rem;font-size:.88rem;line-height:1.9}
.sorry-box ol{margin:0 0 1rem;padding-left:1.2rem;font-family:var(--sans);
  font-size:.8rem;line-height:2;color:var(--muted)}
.sorry-box b{font-weight:500;color:var(--ink)}
.sorry-box a{font-family:var(--sans);font-size:.8rem;color:var(--gold);text-decoration:none;
  border-bottom:1px solid transparent}
.sorry-box a:hover{border-bottom-color:var(--gold)}

@media (max-width:760px){
  .brand{padding:1rem 1.1rem} .brand h1{font-size:1.35rem}
  .tools{padding:1rem 1.1rem}
  .views{top:auto;bottom:3.2rem;margin-top:0;font-size:.72rem}
  .card{right:0;left:0;bottom:0;top:auto;transform:none;width:100%;
    max-height:60vh;border-radius:14px 14px 0 0}
  .hint{bottom:.8rem}
}
</style>
</head>

/* 乾燥度與地中海性用「中心點 + 橢圓高斯」疊加，不是方框。
   方框寫出來的氣候帶長得就像方框——澳洲內陸會是一塊長方形。
   高斯是平滑的，交界會自然散開。                      */
function bell(lat, lng, clat, clng, rlat, rlng){
  let dl = lng - clng;
  while (dl > 180) dl -= 360;
  while (dl < -180) dl += 360;
  const a = (lat - clat) / rlat, b = dl / rlng;
  return Math.exp(-(a * a + b * b));
}
/* [緯度, 經度, 緯向半徑, 經向半徑, 強度（省略為 1）]
   強度 < 1 的是半乾燥帶，疊起來到不了沙漠的門檻 */
const DRY = [

  [-22,-69,  9, 3.5],  // 阿塔卡馬

  [36,-120,  4,  4],   // 加州

/* 大陸內部比海洋性氣候冷得多，針葉林往南伸。
   北美東部的針葉林到 47 度就開始（魁北克的膠冷杉、黑雲杉），
   西伯利亞也是；但同緯度的倫敦是溫帶。用兩個中心把界線往南拉。 */
const COLD = [
  [55,  -85, 12, 35],   // 北美東部—加拿大地盾
  [62,  100, 12, 45]    // 西伯利亞
];
const field = (list, lat, lng) => list.reduce(
  (s, d) => s + bell(lat, lng, d[0], d[1], d[2], d[3]) * (d[4] === undefined ? 1 : d[4]), 0);
const dryness  = (lat, lng) => field(DRY, lat, lng);
const medness  = (lat, lng) => field(MED, lat, lng);
const coldness = (lat, lng) => field(COLD, lat, lng);

function climateOf(lat, lng){
  const a = Math.abs(lat);
  // 格陵蘭是冰蓋，緯度雖然不到 72 也算極地
  if (lat > 59 && lng > -73 && lng < -12) return 'polar';
  if (a > 72) return 'polar';
  if (a > 54 - 10 * coldness(lat, lng)) return 'boreal';
  const d = dryness(lat, lng);
  if (d > 0.66) return 'desert';
  if (medness(lat, lng) > 0.55 && a > 27 && a < 48) return 'mediterran';
  if (d > 0.36) return 'steppe';
  if (a > 40) return 'temperate';
  if (a > 23.5) return 'subtropic';
  return 'tropic';
}
const clim = (lat, lng) => CLIMATE[climateOf(lat, lng)];

/* ── 投影：Equal Earth ─────────────────────────────────
   等距長方把高緯度的經線拉得跟赤道一樣寬，加拿大、俄羅斯、
   格陵蘭會被橫向撐開，看起來就扁。Equal Earth 會正確收窄，
   而且保持面積比例。底圖與產地共用同一個投影。      */
const RAD = Math.PI / 180, SQ3 = Math.sqrt(3);
const A1 = 1.340264, A2 = -0.081106, A3 = 0.000893, A4 = 0.003796;
const SCALE = 41.2;
function P(lng, lat){
  const th = Math.asin(SQ3 / 2 * Math.sin(lat * RAD));
  const t2 = th * th, t6 = t2 * t2 * t2;
  const den = A1 + 3 * A2 * t2 + t6 * (7 * A3 + 9 * A4 * t2);
  const x = 2 * SQ3 * (lng * RAD) * Math.cos(th) / (3 * den);
  const y = th * (A1 + A2 * t2 + t6 * (A3 + A4 * t2));
  return [x * SCALE, -y * SCALE];
}

const POLYS = [];
LAND.features.forEach(f => f.geometry.coordinates.forEach(ring => {
  let x0 = 180, y0 = 90, x1 = -180, y1 = -90;
  for (const [x, y] of ring){
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  POLYS.push({ring, bb:[x0, y0, x1, y1]});
}));
function onLand(lng, lat){
  for (const p of POLYS){
    const b = p.bb;
    if (lng < b[0] || lng > b[2] || lat < b[1] || lat > b[3]) continue;
    const r = p.ring;
    let hit = false;
    for (let i = 0, j = r.length - 1; i < r.length; j = i++){
      const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
      if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) hit = !hit;
    }
    if (hit) return true;
  }
  return false;
}

/* 緯度切掉南極與北極頂端：等距長方在那裡會被透視壓成橫條，
   而且那兩塊一個產地都沒有。 */
const LAT_N = 83, LAT_S = -58;
/* 用真實多邊形切出海岸線，再把內部的大三角形遞迴細分，
   每個小三角形取自己的重心判氣候。
   海岸是真的，氣候照樣分得出來——不必在兩者之間二選一。 */
/* 顏色給在「頂點」而不是「三角形」，再讓它內插。
   氣候交界本來就是漸變的，這樣既不會有鋸齒，
   三角形也能放大一倍，省一半的量。 */
const MAXEDGE = 4.5;
const mpos = [], mcol = [];
const cTmp = new THREE.Color();
let landTris = 0;

function emit(a, b, c){
  for (const p of [a, b, c]){
    const q = P(p[0], p[1]);
    mpos.push(q[0], 0.12, q[1]);
    cTmp.setHex(clim(p[1], p[0]).ground);
    mcol.push(cTmp.r, cTmp.g, cTmp.b);
  }
  landTris++;
}
/* 最長邊對切，直到夠細。用堆疊不用遞迴，免得爆堆疊。 */
function split(a, b, c){
  const stack = [[a, b, c]];
  let guard = 0;
  while (stack.length && guard++ < 400000){
    const [p, q, r] = stack.pop();
    const d1 = Math.hypot(q[0] - p[0], q[1] - p[1]);
    const d2 = Math.hypot(r[0] - q[0], r[1] - q[1]);
    const d3 = Math.hypot(p[0] - r[0], p[1] - r[1]);
    const m = Math.max(d1, d2, d3);
    if (m <= MAXEDGE){ emit(p, q, r); continue; }
    if (m === d1){ const h = [(p[0]+q[0])/2, (p[1]+q[1])/2];
      stack.push([p, h, r], [h, q, r]); }
    else if (m === d2){ const h = [(q[0]+r[0])/2, (q[1]+r[1])/2];
      stack.push([q, h, p], [h, r, p]); }
    else { const h = [(r[0]+p[0])/2, (r[1]+p[1])/2];
      stack.push([r, h, q], [h, p, q]); }
  }
}

LAND.features.forEach(f => {

  let y0 = 90, y1 = -90;
  for (const [, y] of rings[0]){ if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (y1 < LAT_S || y0 > LAT_N) return;          // 南極與北極頂端不畫
  const shape = new THREE.Shape();
  rings[0].forEach(([x, y], i) => i ? shape.lineTo(x, y) : shape.moveTo(x, y));
  for (let k = 1; k < rings.length; k++){
    const hole = new THREE.Path();
    rings[k].forEach(([x, y], i) => i ? hole.lineTo(x, y) : hole.moveTo(x, y));
    shape.holes.push(hole);
  }
  const g = new THREE.ShapeGeometry(shape);
  const pa = g.attributes.position, ix = g.index;
  const vert = i => [pa.getX(i), pa.getY(i)];
  if (ix) for (let i = 0; i < ix.count; i += 3)
    split(vert(ix.getX(i)), vert(ix.getX(i + 1)), vert(ix.getX(i + 2)));
  else for (let i = 0; i < pa.count; i += 3)
    split(vert(i), vert(i + 1), vert(i + 2));
  g.dispose();
});

/* ── 植被：少、大、看得出是一棵樹 ─────────────────────
   第一版撒了九千多棵小樹，在世界尺度下每棵只有幾個像素，

   三個 InstancedMesh：樹幹共用一個，樹冠分圓形與針葉。 */
/* instanceColor 是「乘」上光照的，不是最終顏色。
   直射 0.95 ＋ 天光 0.62 ＋ 環境 0.10 的受光面會放大到 1.4 倍以上，
   所以底色必須壓在中綠，太亮會整棵爆成白色。
   上一版從全黑一路衝過頭變成棉花，就是這個原因。 */
const VEG = {
  boreal:     {cone:true,  n:92, col:0x4E8A6E},
  tropic:     {cone:false, n:68, col:0x47934C},
  temperate:  {cone:false, n:48, col:0x639E52},
  subtropic:  {cone:false, n:38, col:0x56974E},
  mediterran: {cone:true,  n:16, col:0x74915A},
  steppe:     {cone:false, n:8,  col:0x7D8257},
  desert:     {cone:false, n:2,  col:0x8A8459},
  polar:      {n:0}
};
const need = {}; for (const k in VEG) need[k] = VEG[k].n || 0;
const trees = [];
for (let i = 0, guard = 0; guard < 260000; guard++){
  const lat = LAT_S + Math.random() * (LAT_N - LAT_S);
  const lng = -180 + Math.random() * 360;
  if (Math.random() > Math.cos(lat * RAD) * 0.72 + 0.28) continue;
  const key = climateOf(lat, lng);
  if (!need[key]) continue;
  if (!onLand(lng, lat)) continue;
  need[key]--;
  const v = VEG[key], q = P(lng, lat);
  trees.push({x:q[0], z:q[1], cone:!!v.cone, col:v.col, s:0.72 + Math.random() * 0.34});
  if (Object.values(need).every(n => n <= 0)) break;
}
/* r134 的 UMD 版沒有 mergeBufferGeometries（那在 examples/jsm），
   自己接 position/normal 就好——合併成一個幾何才能用 InstancedMesh，
   不然一棵三層的針葉樹就要三個 draw call。 */
function mergeGeos(list){
  const parts = list.map(g => g.index ? g.toNonIndexed() : g);
  let n = 0; parts.forEach(g => n += g.attributes.position.count);
  const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3);
  let o = 0;
  parts.forEach(g => {
    pos.set(g.attributes.position.array, o * 3);
    nor.set(g.attributes.normal.array, o * 3);
    o += g.attributes.position.count;
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  /* 要用 instanceColor 就得開 vertexColors，而開了之後著色器會去讀
     geometry 的 color 屬性。沒有這個屬性的話 WebGL 補 (0,0,0)，
     整棵樹會變全黑。填滿 1.0 當中性值，顏色才由 instanceColor 決定。 */
  const white = new Float32Array(n * 3).fill(1);
  out.setAttribute('color', new THREE.Float32BufferAttribute(white, 3));
  return out;
}
const TRUNK = new THREE.CylinderGeometry(0.11, 0.15, 0.72, 5);
/* 針葉樹：三層錐疊起來，一眼就認得出是針葉。
   段數 6 → 8，側面輪廓比較順。 */
const CONE = mergeGeos([
  new THREE.ConeGeometry(0.62, 0.95, 8, 1, true).translate(0, -0.42, 0),
  new THREE.ConeGeometry(0.47, 0.85, 8, 1, true).translate(0,  0.12, 0),
  new THREE.ConeGeometry(0.31, 0.72, 8, 1, true).translate(0,  0.62, 0)
]);
/* 闊葉樹的「漸層」其實是 flat shading：每個面接光角度不同，
   面越多階梯越細，就看起來像漸層。原本一瓣只有 20 面，
   階梯太粗；主瓣改成細分一階（80 面），再疊一顆小的。 */
const ROUND = mergeGeos([
  new THREE.IcosahedronGeometry(0.60, 1),
  new THREE.IcosahedronGeometry(0.36, 0).translate(0.38, 0.24, 0.10)
]);

function instance(geo, list, place, colored){
  const m = new THREE.InstancedMesh(geo,
    new THREE.MeshPhongMaterial({flatShading:true, shininess:0, specular:0x000000,
      vertexColors:!!colored, side:THREE.DoubleSide}), list.length);
  const cols = colored ? new Float32Array(list.length * 3) : null;
  const dum = new THREE.Object3D(), c = new THREE.Color();
  list.forEach((tr, i) => {
    place(dum, tr);
    dum.updateMatrix();
    m.setMatrixAt(i, dum.matrix);
    if (colored){ c.setHex(tr.col); cols[i*3] = c.r; cols[i*3+1] = c.g; cols[i*3+2] = c.b; }
  });
  if (colored) m.instanceColor = new THREE.InstancedBufferAttribute(cols, 3);
  m.instanceMatrix.needsUpdate = true;
  m.castShadow = false;   // 平面地圖上樹影會變成一塊塊黑斑
  world.add(m);
  return m;
}

function house(roof, s){
  const g = new THREE.Group();
  const w = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.7, 0.86), mat(0xFBF3E2));
  w.position.y = 0.35; w.castShadow = true;
  const r = new THREE.Mesh(new THREE.ConeGeometry(0.88, 0.56, 4), mat(roof));
  r.position.y = 0.98; r.rotation.y = Math.PI / 4; r.castShadow = true;
  const win = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.3, 0.06), mat(0x3E5260));
  win.position.set(0.2, 0.4, 0.44);
  windows.push(win);
  g.add(w, r, win); g.scale.setScalar(s || 1); return g;
}
function still(){
  const g = new THREE.Group();
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.56, 10), mat(0xCE8B4A));
  p.position.y = 0.28; p.castShadow = true;
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.34, 10), mat(0xCE8B4A));
  c.position.y = 0.73;
  const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.44, 6), mat(0xCE8B4A));
  pipe.position.set(0.22, 0.95, 0); pipe.rotation.z = -0.7;
  g.add(p, c, pipe); return g;
}
function patch(cols){
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.08, 0.8), mat(0xC9A878));
  b.position.y = 0.04; b.receiveShadow = true; g.add(b);
  for (let i = 0; i < 12; i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.095, 6, 5),
      mat(cols[i % cols.length]));
    s.position.set((i % 4 - 1.5) * 0.26, 0.15, (Math.floor(i / 4) - 1) * 0.26);
    g.add(s);
  }
  return g;
}
function tree(kind){
  const g = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.09, 0.42, 5), mat(0x8A6A4A));
  tr.position.y = 0.21; g.add(tr);
  let top;
  if (kind === 'cypress'){
    top = new THREE.Mesh(new THREE.ConeGeometry(0.22, 1.25, 6), mat(0x3F6B4A));
    top.position.y = 1.0;
  } else if (kind === 'resin'){
    top = new THREE.Mesh(new THREE.SphereGeometry(0.42, 7, 5), mat(0x8FA47A));
    top.position.y = 0.72; top.scale.y = 0.6;
  } else if (kind === 'snow'){
    top = new THREE.Mesh(new THREE.ConeGeometry(0.34, 0.8, 6), mat(0x4E7A5E));
    top.position.y = 0.72;
  } else if (kind === 'palm'){
    const g2 = new THREE.Group();
    for (let i = 0; i < 5; i++){
      const lf = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.7, 4), mat(0x4F9E55));
      lf.position.set(Math.cos(i * 1.26) * 0.26, 0.56, Math.sin(i * 1.26) * 0.26);
      lf.rotation.set(Math.cos(i * 1.26) * 0.95, 0, -Math.sin(i * 1.26) * 0.95);
      lf.castShadow = true; g2.add(lf);
    }
    tr.scale.y = 1.5; tr.position.y = 0.32;
    g.add(g2); return g;
  } else {
    top = new THREE.Mesh(
      Math.random() < 0.5 ? new THREE.ConeGeometry(0.38, 0.85, 7)
                          : new THREE.SphereGeometry(0.38, 8, 6),
      mat(Math.random() < 0.5 ? 0x4E8C5A : 0x6EA863));
    top.position.y = 0.76;
  }
  top.castShadow = true;
  g.add(top); return g;
}

/* ── 一座六邊形島 ───────────────────────── */
function hexIsland(r, t){
  const g = new THREE.Group();
  const top = new THREE.Mesh(new THREE.CylinderGeometry(r, r * 0.985, 1.1, 6), mat(t.ground));
  top.position.y = -0.55; top.rotation.y = Math.PI / 6;
  top.castShadow = true; top.receiveShadow = true;
  const soil = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.985, r * 0.78, 1.9, 6),
    mat(t.soil || 0xC9A878));
  soil.position.y = -2.05; soil.rotation.y = Math.PI / 6; soil.castShadow = true;
  const rock = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.78, r * 0.26, 3.4, 6), mat(0xBFB49C));
  rock.position.y = -4.7; rock.rotation.y = Math.PI / 6;
  const tip = new THREE.Mesh(new THREE.ConeGeometry(r * 0.26, 2.0, 6), mat(0xBFB49C));
  tip.position.y = -7.4; tip.rotation.y = Math.PI / 6; tip.rotation.x = Math.PI;
  g.add(top, soil, rock, tip);
  return g;
}

/* ── 台灣：真實輪廓的小島 ───────────────── */
function taiwanIsland(scale){
  const g = new THREE.Group();
  const LAT0 = 23.6, LNG0 = 120.98, COS0 = Math.cos(LAT0 * Math.PI / 180);
  const pts = TW.main.map(([lng, lat]) =>
    [(lng - LNG0) * COS0 * scale, -(lat - LAT0) * scale]);
  const s = new THREE.Shape();
  pts.forEach(([x, z], i) => i ? s.lineTo(x, z) : s.moveTo(x, z));
  s.closePath();
  const slab = new THREE.Mesh(
    new THREE.ExtrudeGeometry(s, {depth:3.0, bevelEnabled:false}),
    mat(0x9BC47E, {side:THREE.DoubleSide}));
  slab.rotation.x = Math.PI / 2;
  slab.castShadow = true; slab.receiveShadow = true;
  g.add(slab);
  const base = new THREE.Mesh(
    new THREE.ExtrudeGeometry(s, {depth:3.4, bevelEnabled:false}),
    mat(0xC2A87E, {side:THREE.DoubleSide}));
  base.rotation.x = Math.PI / 2; base.position.y = -3.0; base.scale.set(0.94, 1, 0.94);
  g.add(base);
  // 中央山脈，一排由北到南的小山
  for (let i = 0; i < 9; i++){
    const t = i / 8;
    const lat = 24.8 - t * 2.5, lng = 121.6 - t * 0.75;
    const hh = 1.1 + 2.3 * Math.sin(Math.PI * Math.min(1, Math.max(0, (t - 0.02) / 0.96)));
    const m = new THREE.Mesh(new THREE.ConeGeometry(1.5 + hh * 0.22, hh, 6),
      mat(t > 0.3 && t < 0.7 ? 0x6E8A5C : 0x62A05C));
    m.position.set((lng - LNG0) * COS0 * scale, hh / 2, -(lat - LAT0) * scale);
    m.rotation.y = i * 0.7;
    m.castShadow = true;
    g.add(m);
  }
  return g;
}

/* ── 位置：直接用真實經緯度。新增產地給座標就落對地方 ── */
const nodes = OVERSEAS.map(o => ({

  tx:P(120.98, 23.6)[0], tz:P(120.98, 23.6)[1], lat:23.6, lng:120.98,

/* ── 推開：方位不能被推翻 ──────────────────────────────
   日本六處真實相距不到 1 單位，島半徑卻有 1.84。原本兩兩
   對推，結果把方位推翻了——青森被推到富良野東邊 3.9 單位，
   實際上它在西南。改成：先找出擠在一起的群，整群連形狀一起
   等比放大、島一起縮小（形狀完全保留，所以誰在誰的哪一邊
   永遠是對的），群與群之間才當剛體互推。 */
const KMAX = 2.4, SMIN = 0.48;
const trueD = (a, b) => Math.hypot(b.tx - a.tx, b.tz - a.tz) || 0.01;

const par = nodes.map((_, i) => i);
const find = i => par[i] === i ? i : (par[i] = find(par[i]));
for (let i = 0; i < nodes.length; i++)
  for (let j = i + 1; j < nodes.length; j++)
    if (trueD(nodes[i], nodes[j]) < nodes[i].r + nodes[j].r + 0.8)
      par[find(i)] = find(j);

const groups = {};
nodes.forEach((n, i) => { const k = find(i); (groups[k] = groups[k] || []).push(n); });

const clusters = Object.keys(groups).map(key => {
  const mem = groups[key];
  const cx = mem.reduce((s, n) => s + n.tx, 0) / mem.length;
  const cz = mem.reduce((s, n) => s + n.tz, 0) / mem.length;
  let need1 = 0;                       /* s=1 時要放大幾倍才不疊 */
  for (let i = 0; i < mem.length; i++)
    for (let j = i + 1; j < mem.length; j++)
      need1 = Math.max(need1,
        (mem[i].r + mem[j].r + 0.8) / trueD(mem[i], mem[j]));
  const s = need1 > 0 ? Math.max(SMIN, Math.min(1, KMAX / need1)) : 1;
  const k = Math.max(1, Math.min(KMAX, need1 * s));
  mem.forEach(n => {
    n.r *= s;
    n.x = cx + (n.tx - cx) * k;
    n.z = cz + (n.tz - cz) * k;
  });
  const c = {mem, k, s};
  c.x = mem.reduce((a, n) => a + n.x, 0) / mem.length;
  c.z = mem.reduce((a, n) => a + n.z, 0) / mem.length;
  c.R = Math.max.apply(null, mem.map(n => Math.hypot(n.x - c.x, n.z - c.z) + n.r));
  return c;
});

for (let pass = 0; pass < 120; pass++)
  for (let i = 0; i < clusters.length; i++)
    for (let j = i + 1; j < clusters.length; j++){
      const a = clusters[i], b = clusters[j];
      const dx = b.x - a.x, dz = b.z - a.z;
      const d = Math.hypot(dx, dz) || 0.01;
      const need = a.R + b.R + 0.8;
      if (d < need){
        const push = (need - d) / 2 / d;
        a.x -= dx * push; a.z -= dz * push;
        b.x += dx * push; b.z += dz * push;
      }
    }
clusters.forEach(c => {
  const ox = c.mem.reduce((a, n) => a + n.x, 0) / c.mem.length;
  const oz = c.mem.reduce((a, n) => a + n.z, 0) / c.mem.length;
  c.mem.forEach(n => { n.x += c.x - ox; n.z += c.z - oz; });
});

let maxShift = 0;
nodes.forEach(n => {
  maxShift = Math.max(maxShift, Math.hypot(n.x - n.tx, n.z - n.tz));
});

/* 地中海一帶擠了七個產地，真實距離只有幾百公里，島一定畫不下。
   作法照製圖慣例：島讓開，真實座標留一個釘點，中間拉一條線。
   不把位置悄悄改掉當作沒事。 */
const PINMAT = mat(0x8C8578);
nodes.forEach(n => {
  const d = Math.hypot(n.x - n.tx, n.z - n.tz);
  if (d < 0.6) return;
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.14, 12), PINMAT);
  dot.position.set(n.tx, 0.2, n.tz);
  world.add(dot);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.07, 6, 18), PINMAT);
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(n.tx, 0.2, n.tz);
  world.add(ring);
  const line = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, d, 6), PINMAT);
  line.position.set((n.x + n.tx) / 2, 0.2, (n.z + n.tz) / 2);
  line.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
    new THREE.Vector3(n.x - n.tx, 0, n.z - n.tz).normalize());
  world.add(line);
});

/* ── 蓋島 ───────────────────────────────── */
const pins = [], folk = [], steams = [];
nodes.forEach((nd, n) => {
  const g = new THREE.Group();
  g.position.set(nd.x, 0, nd.z);

  if (nd.tw){
    // 台灣真實比例只有 2 單位高，看不見。放大 3.4 倍當地圖上的標記
    g.add(taiwanIsland(2.3));
    for (let i = 0; i < 10; i++){
      const t = tree();
      t.position.set(-3 + Math.random() * 5, 0, -6 + Math.random() * 12);
      t.scale.setScalar(0.9 + Math.random() * 0.4);
      g.add(t);
    }
    for (let i = 0; i < 3; i++){
      const h = house(ROOFS[i % ROOFS.length], 0.9);
      h.position.set(-2.2 + i * 1.3, 0, -2 + i * 3.2);
      h.rotation.y = i; g.add(h);
    }
    const st = still(); st.position.set(-1.6, 0, 2.6); g.add(st);
    steams.push({at:new THREE.Vector3(nd.x - 1.6, 1.0, nd.z + 2.6), puffs:[]});
    for (let i = 0; i < 5; i++){
      const d = doll(SHIRTS[i % SHIRTS.length]);
      d.userData = {cx:nd.x - 1 + Math.random() * 2, cz:nd.z - 3 + Math.random() * 6, h:0,
        a:Math.random() * 6.28, r:1.1 + Math.random() * 0.8,
        sp:(0.35 + Math.random() * 0.4) * (i % 2 ? 1 : -1)};
      world.add(d); folk.push(d);
    }
    world.add(g);
    pins.push({tw:true, g, n, at:new THREE.Vector3(nd.x, 5.6, nd.z)});
    return;
  }

  const o = nd.o, c = nd.c;
  /* 地貌從氣候來；只有「這個產地特有的東西」才個別指定 */
  const t = {
    ground:c.ground, soil:c.soil,
    trees:c.sparse ? 3 : 6,
    houses:o.items.length > 1 ? 2 : 1,
    dolls:Math.min(4, 2 + Math.floor(o.items.length / 2)),
    still:o.items.some(it => it.type !== 'essential_oil'),
    crop:c.key === 'desert' ? null : [0xBFD16B, 0x9B8EC4],
    pond:o.items.some(it => it.part === 'flower' && /lotus|Nymphaea/i.test(it.latin || '')),
    resin:o.items.some(it => it.part === 'resin'),
    snow:climateOf(o.lat, o.lng) === 'polar'
  };
  if (o.id === 'kazanlak') t.crop = [0xD98BA8, 0xC9719B];       // 玫瑰田
  if (o.id === 'andalusia') t.crop = [0xE8DCC0, 0xC9B38A];      // 岩玫瑰
  g.add(hexIsland(nd.r, t));

  for (let i = 0; i < t.houses; i++){
    const h = house(ROOFS[(n + i) % ROOFS.length], 1);
    h.position.set(-nd.r * 0.42 + i * 1.5, 0, -nd.r * 0.3);
    h.rotation.y = 0.4 + i; h.castShadow = true;
    g.add(h);
  }
  if (t.crop){
    for (let i = 0; i < 2; i++){
      const p = patch(t.crop);
      p.position.set(nd.r * 0.34, 0, -0.6 + i * 1.1);
      g.add(p);
    }
  }
  if (t.still){
    const s = still(); s.position.set(-nd.r * 0.3, 0, nd.r * 0.36); g.add(s);
    steams.push({at:new THREE.Vector3(nd.x - nd.r * 0.3, 1.0, nd.z + nd.r * 0.36), puffs:[]});
  }
  if (t.pond){
    const pd = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.4, 0.4, 14), mat(0x4A8CA6));
    pd.position.set(-nd.r * 0.28, -0.14, nd.r * 0.3); g.add(pd);
    for (let i = 0; i < 5; i++){
      const lp = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.05, 9), mat(0x6FA86B));
      lp.position.set(-nd.r * 0.28 + Math.cos(i * 1.3) * 0.85, 0.08,
                      nd.r * 0.3 + Math.sin(i * 1.3) * 0.85);
      g.add(lp);
      if (i % 2 === 0){
        const fl = new THREE.Mesh(new THREE.ConeGeometry(0.14, 0.3, 6), mat(0x8E9BE0));
        fl.position.copy(lp.position); fl.position.y = 0.25;
        g.add(fl);
      }
    }
  }
  const kind = t.resin ? 'resin' : c.tree;
  for (let i = 0; i < t.trees; i++){
    const tr = tree(kind);
    const a = (i / t.trees) * 6.28 + n;
    tr.position.set(Math.cos(a) * nd.r * 0.72, 0, Math.sin(a) * nd.r * 0.72);
    tr.scale.setScalar(0.9 + Math.random() * 0.45);
    g.add(tr);
  }
  if (t.snow){
    const cap = new THREE.Mesh(new THREE.SphereGeometry(nd.r * 0.42, 9, 6), mat(0xF2EFE6));
    cap.scale.y = 0.35; cap.position.y = 0.2; g.add(cap);
  }

  const col = low(o) ? 0xA8A29A : 0xB8965A;
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.5, 6), mat(0xFFF8F0));
  post.position.y = 0.75;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), mat(col));
  head.position.y = 1.62;
  g.add(post, head);

  world.add(g);
  pins.push({o, g, head, n, at:new THREE.Vector3(nd.x, 3.2, nd.z)});

  for (let i = 0; i < t.dolls; i++){
    const d = doll(SHIRTS[(n + i) % SHIRTS.length]);
    d.userData = {cx:nd.x, cz:nd.z, h:0, a:Math.random() * 6.28,
      r:nd.r * 0.5 + Math.random() * nd.r * 0.25,
      sp:(0.3 + Math.random() * 0.35) * (i % 2 ? 1 : -1)};
    world.add(d); folk.push(d);
  }
});

/* 小船 */
const boats = [];
const BB = nodes.reduce((a, n) => ({
  x0:Math.min(a.x0, n.x), x1:Math.max(a.x1, n.x),
  z0:Math.min(a.z0, n.z), z1:Math.max(a.z1, n.z)
}), {x0:1e9, x1:-1e9, z0:1e9, z1:-1e9});
const CX = (BB.x0 + BB.x1) / 2, CZ = (BB.z0 + BB.z1) / 2;
const RSPAN = Math.max(BB.x1 - BB.x0, BB.z1 - BB.z0);
for (let i = 0; i < 7; i++){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.26, 0.5), mat(0xFBF3E2));
  hull.position.y = 0.13;
  const sail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.72, 4), mat(ROOFS[i % ROOFS.length]));
  sail.position.y = 0.62; sail.rotation.y = Math.PI / 4;
  g.add(hull, sail);
  g.userData = {a:i / 7 * 6.28, r:RSPAN * 0.42 + Math.random() * RSPAN * 0.2,
    sp:0.035 + Math.random() * 0.03};
  world.add(g); boats.push(g);
}

/* ── 卡片 ───────────────────────────────── */
const card = document.getElementById('card');
const PARTS = DATA.parts || {};
function itemRows(items){

/* ── 第三層：品項卡 ─────────────────────────────────
   原本點產地只到「列出品項」就停了，品項點不下去。
   補上之後層次和 puma 一樣深：產地 → 品項 → 親緣。
   親緣從學名自動算，不是手填。                   */
function binomial(lat){
  if (!lat) return [null, null];
  const k = String(lat).trim().split(/\s+/);
  const g = (k[0] || '').replace(/[^A-Za-z]/g, '') || null;
  let s = null;
  if (k[1] === '×' || k[1] === 'x'){ if (k[2]) s = '× ' + k[2]; }
  else if (k[1] && !/^sp+\.$/i.test(k[1])) s = k[1];
  return [g, s];
}
const ALL = DATA.items, byGenus = {}, bySpecies = {};
ALL.forEach(it => {
  const [g, s] = binomial(it.latin);
  it.__g = g; it.__s = s;
  if (g) (byGenus[g] = byGenus[g] || []).push(it);
  if (g && s){ const k = g + ' ' + s; (bySpecies[k] = bySpecies[k] || []).push(it); }
});
const kinOf = it => {
  const same = (bySpecies[it.__g + ' ' + it.__s] || []).filter(x => x.id !== it.id);
  const gen = (byGenus[it.__g] || []).filter(x => x.id !== it.id && !same.some(y => y.id === x.id));
  return {same, gen};
};
const TYPE_ZH = {hydrosol:'純露', essential_oil:'精油', both:'純露 · 精油'};
let cameFrom = null;

function itemBtns(items){
  if (!items.length) return '<p style="color:var(--faint);font-size:.82rem">還沒有品項掛在這裡。</p>';
  return items.map(it => {
    const k = kinOf(it), n = k.same.length + k.gen.length;
    return `<button class="item" data-item="${it.id}">
      <span><span class="zh">${txt(it.name)}</span>
      <span class="lat">${it.latin || ''}</span></span>
      <span class="part">${PARTS[it.part] ? txt(PARTS[it.part]) : ''}${
        n ? `<span class="kinw">親緣 ${n}</span>` : ''}</span>
    </button>`;
  }).join('');
}
function showItem(id){
  const it = ALL.find(x => x.id === id); if (!it) return;
  const origins = (it.originIds || []).map(i => byOrigin[i]).filter(Boolean);
  const k = kinOf(it);
  const kv = [];
  if (origins.length) kv.push(['產地', origins.map(o =>
    `${txt(o.name)}<span style="color:var(--faint)">　${txt(o.where)}</span>`).join('<br>')]);
  if (PARTS[it.part]) kv.push(['萃取', txt(PARTS[it.part])]);
  if (it.type) kv.push(['型態', TYPE_ZH[it.type] || it.type]);
  if (it.season && txt(it.season)) kv.push(['時節', txt(it.season)]);
  if (it.aroma && txt(it.aroma)) kv.push(['氣味', txt(it.aroma)]);
  const links = [];
  if (it.articleUrl) links.push(`<a class="go" href="${it.articleUrl}" target="_blank" rel="noopener">讀這一篇 →</a>`);
  if (it.videoId) links.push(`<a class="go" href="https://www.youtube.com/watch?v=${it.videoId}" target="_blank" rel="noopener">${it.series || '影片'} →</a>`);
  document.getElementById('c-eyebrow').textContent = it.latin || '品項';
  document.getElementById('c-title').textContent = txt(it.name);
  document.getElementById('c-where').textContent =
    origins.map(o => txt(o.name)).join('、') || '尚無產地';
  document.getElementById('c-body').innerHTML = `
    ${cameFrom ? `<button class="back" data-back="1">← 回到 ${txt(byOrigin[cameFrom].name)}</button>` : ''}
    ${it.confidence !== 'high' ? `<span class="flag">${it.confidence === 'low' ? '產地待確認' : '細節待確認'}</span>` : ''}
    ${it.verify ? `<p class="verify">${it.verify}</p>` : ''}
    <dl class="kv">${kv.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
    ${it.story && txt(it.story) ? `<p class="note">${txt(it.story)}</p>` : ''}
    ${k.same.length ? `<div class="sect"><h3>同一個種 · ${it.__g} ${it.__s}</h3>${itemBtns(k.same)}</div>` : ''}
    ${k.gen.length ? `<div class="sect"><h3>同屬 · ${it.__g}</h3>${itemBtns(k.gen)}</div>` : ''}
    ${links.length ? `<div class="sect"><h3>延伸</h3>${links.join('<br>')}</div>` : ''}`;
  document.getElementById('c-body').scrollTop = 0;
  card.hidden = false;
}
document.getElementById('c-body').addEventListener('click', e => {
  const b = e.target.closest('[data-item]');
  if (b){ showItem(b.dataset.item); return; }
  if (e.target.closest('[data-back]') && cameFrom) open(cameFrom, false);

function open(id, fly){
  const o = byOrigin[id]; if (!o) return;
  cameFrom = id;
  document.getElementById('c-eyebrow').innerHTML =

  document.getElementById('c-title').textContent = txt(o.name);
  const c = clim(o.lat, o.lng);
  document.getElementById('c-where').textContent =
    `${txt(o.where)}　${o.lat.toFixed(2)}° ${o.lng.toFixed(2)}°　${c.zh}`;
  document.getElementById('c-body').innerHTML = `
    ${o.confidence !== 'high' ? `<span class="flag">${low(o) ? '產地待確認' : '細節待確認'}</span>` : ''}
    ${o.verify ? `<p class="verify">${o.verify}</p>` : ''}
    ${o.note && txt(o.note) ? `<p class="note">${txt(o.note)}</p>` : ''}
    ${o.facts ? `<ul class="facts">${o.facts.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
    <div class="sect"><h3>這裡來的 ${o.items.length} 項</h3>${itemBtns(o.items)}</div>`;

}
function openTW(){

    <p class="note">從深根大地的實驗田，到大武山入夜後才開始的採花，到新竹五峰一百一十四年的柳杉。</p>
    <a class="go" href="taiwan.html">進入台灣島，看 ${TWSITES.length} 處產地的實際位置 →</a>
    <div class="sect"><h3>台灣來的 ${twItems.size} 項</h3>${itemBtns(all)}</div>`;
  document.getElementById('c-body').scrollTop = 0;
  card.hidden = false;
  pins.forEach(p => p.tag.classList.toggle('on', !!p.tw));
  hideHint();
  flyTo(twNode);
}
document.getElementById('card-x').onclick = () => {
  card.hidden = true; pins.forEach(p => p.tag.classList.remove('on'));

addEventListener('keydown', e => { if (e.key === 'Escape') card.hidden = true; });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.addEventListener('click', e => {
  if (moved) return;
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  for (const p of pins)
    if (ray.intersectObject(p.g, true).length){
      p.tw ? openTW() : open(p.o.id, true);
      return;
    }
});

/* ── 鏡頭 ───────────────────────────────── */
const HOME = {theta:-0.05, phi:0.40, dist:RSPAN * 2.75 + 50, tx:CX, tz:CZ};
const CAM = Object.assign({}, HOME);
const TARGET = new THREE.Vector3(CX, 1.5, CZ);
let anim = null;
let BIRD_MIN = 0.16;
const HOME_PHI_MIN = 0.16;
function applyCam(){
  CAM.phi = Math.max(BIRD_MIN, Math.min(1.40, CAM.phi));
  CAM.dist = Math.max(20, Math.min(RSPAN * 5, CAM.dist));
  TARGET.set(CAM.tx, 1.5, CAM.tz);
  camera.position.set(
    TARGET.x + CAM.dist * Math.sin(CAM.phi) * Math.sin(CAM.theta),
    TARGET.y + CAM.dist * Math.cos(CAM.phi),
    TARGET.z + CAM.dist * Math.sin(CAM.phi) * Math.cos(CAM.theta));
  camera.lookAt(TARGET);
}
/* 飛到一座島：這是「親民」的關鍵，一鍵就站到島邊 */
function flyTo(nd){
  const a = {tx:CAM.tx, tz:CAM.tz, d:CAM.dist, phi:CAM.phi};
  // 長焦之後要拉遠兩倍才是同樣的取景
  const b = {tx:nd.x, tz:nd.z, d:nd.r * 6.9 + 16, phi:0.95};
  const t0 = performance.now(), me = anim = {};
  (function step(now){
    if (anim !== me) return;
    const k = Math.min(1, (now - t0) / 950);
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    CAM.tx = a.tx + (b.tx - a.tx) * e;
    CAM.tz = a.tz + (b.tz - a.tz) * e;
    CAM.dist = a.d + (b.d - a.d) * e;
    CAM.phi = a.phi + (b.phi - a.phi) * e;
    applyCam();
    if (k < 1) requestAnimationFrame(step); else if (anim === me) anim = null;
  })(t0);
}

let dragging = false, moved = false, lx = 0, ly = 0;
const tp = new Map();
const gap = () => { const [a, b] = [...tp.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
let gap0 = 0, d0 = 0;
host.addEventListener('pointerdown', e => {
  tp.set(e.pointerId, {x:e.clientX, y:e.clientY});
  host.setPointerCapture(e.pointerId);
  moved = false; anim = null;
  if (tp.size === 1){ dragging = true; lx = e.clientX; ly = e.clientY; host.classList.add('grabbing'); }
  else if (tp.size === 2){ dragging = false; host.classList.remove('grabbing'); gap0 = gap(); d0 = CAM.dist; }
});
host.addEventListener('pointermove', e => {
  if (!tp.has(e.pointerId)) return;
  tp.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (tp.size === 2){ if (gap0 > 0){ CAM.dist = d0 * gap0 / gap(); applyCam(); moved = true; } return; }
  if (!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  CAM.theta -= dx * 0.005; CAM.phi -= dy * 0.004;
  lx = e.clientX; ly = e.clientY;
  applyCam(); hideHint();
});
['pointerup','pointercancel'].forEach(t => host.addEventListener(t, e => {
  tp.delete(e.pointerId);
  if (tp.size < 2) gap0 = 0;
  if (tp.size === 0){ dragging = false; host.classList.remove('grabbing'); }
}));
host.addEventListener('wheel', e => {
  e.preventDefault(); CAM.dist *= 1 + e.deltaY * 0.0014; applyCam(); hideHint();
}, {passive:false});


/* 鳥瞰：不是另一個場景，只是把相機搬到正上方。
   puma 的作法一樣——相機移到目標上空、放寬垂直角下限、補間飛過去。 */
const tBird = document.getElementById('t-bird');
let birdOn = false;
function glideCam(toPhi, toDist, ms){
  const a = {phi:CAM.phi, dist:CAM.dist}, t0 = performance.now(), me = anim = {};
  (function step(now){
    if (anim !== me) return;
    const k = Math.min(1, (now - t0) / (ms || 850));
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    CAM.phi = a.phi + (toPhi - a.phi) * e;
    CAM.dist = a.dist + (toDist - a.dist) * e;
    applyCam();
    if (k < 1) requestAnimationFrame(step); else if (anim === me) anim = null;
  })(t0);
}
if (tBird) tBird.onclick = () => {
  birdOn = !birdOn;
  tBird.setAttribute('aria-pressed', String(birdOn));
  BIRD_MIN = birdOn ? 0.06 : HOME_PHI_MIN;
  glideCam(birdOn ? 0.07 : HOME.phi, birdOn ? CAM.dist * 0.92 : HOME.dist);
};

/* ── 工具列 ─────────────────────────────── */
const hint = document.getElementById('hint');
let hintGone = false;
function hideHint(){ if (!hintGone){ hintGone = true; hint.classList.add('gone'); } }
setTimeout(hideHint, 8000);

const tTags = document.getElementById('t-tags');
tTags.onclick = () => {
  const on = tTags.getAttribute('aria-pressed') === 'true';
  tTags.setAttribute('aria-pressed', String(!on));
  document.body.classList.toggle('notags', on);
};
document.getElementById('t-reset').onclick = () => {
  anim = null; Object.assign(CAM, HOME); applyCam();
  card.hidden = true; pins.forEach(p => p.tag.classList.remove('on'));
};

let mk = 1;
const MOOD_KEYS = ['dawn', 'day', 'dusk', 'night'];
let moodNow = 'day', moodFrom = MOODS.day, moodTo = MOODS.day;
const cA = new THREE.Color(), cB = new THREE.Color();
const mixc = (t, a, b, q) => { cA.setHex(a); cB.setHex(b); t.copy(cA).lerp(cB, q); };
const lerpn = (a, b, q) => a + (b - a) * q;

/* 從畫面目前的實際值出發，所以轉場途中再點也不會跳一下 */
function currentMood(){
  return {bg:scene.background.getHex(), fog:scene.fog ? scene.fog.color.getHex() : 0,
    hemiSky:hemi.color.getHex(), hemiGnd:hemi.groundColor.getHex(), hemiI:hemi.intensity,
    sun:sun.color.getHex(), sunI:sun.intensity,
    pos:[sun.position.x, sun.position.y, sun.position.z],
    sea:seaMat.color.getHex(), amb:amb.intensity, lit:moodTo.lit};
}
MOOD_KEYS.forEach(key => {
  const btn = document.getElementById('m-' + key);
  if (!btn) return;
  btn.onclick = () => {
    if (moodNow === key) return;
    moodFrom = currentMood(); moodTo = MOODS[key]; mk = 0; moodNow = key;
    MOOD_KEYS.forEach(k2 => {
      const b2 = document.getElementById('m-' + k2);
      if (b2) b2.setAttribute('aria-pressed', String(k2 === key));
    });
  };
});
function mood(q){
  mixc(scene.background, moodFrom.bg, moodTo.bg, q);
  if (scene.fog) mixc(scene.fog.color, moodFrom.fog, moodTo.fog, q);
  mixc(hemi.color, moodFrom.hemiSky, moodTo.hemiSky, q);
  mixc(hemi.groundColor, moodFrom.hemiGnd, moodTo.hemiGnd, q);
  mixc(sun.color, moodFrom.sun, moodTo.sun, q);
  mixc(seaMat.color, moodFrom.sea, moodTo.sea, q);
  sun.intensity = lerpn(moodFrom.sunI, moodTo.sunI, q);
  hemi.intensity = lerpn(moodFrom.hemiI, moodTo.hemiI, q);
  amb.intensity = lerpn(moodFrom.amb, moodTo.amb, q);
  sun.position.set(lerpn(moodFrom.pos[0], moodTo.pos[0], q),
                   lerpn(moodFrom.pos[1], moodTo.pos[1], q),
                   lerpn(moodFrom.pos[2], moodTo.pos[2], q));
  const lit = q > 0.5 ? moodTo.lit : moodFrom.lit;
  windows.forEach(w => w.material = mat(lit ? 0xFFD79A : 0x3E5260));
}

/* ── 動畫 ───────────────────────────────── */
function resize(){
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  applyCam();
}
addEventListener('resize', resize);

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  requestAnimationFrame(loop);
  if (mk < 1){ mk = Math.min(1, mk + dt * 1.1); mood(mk); }
  folk.forEach(d => {
    const u = d.userData;
    u.a += u.sp * dt;
    d.position.set(u.cx + Math.cos(u.a) * u.r,
                   u.h + Math.abs(Math.sin(u.a * 20)) * 0.04,
                   u.cz + Math.sin(u.a) * u.r);
    d.rotation.y = -u.a + (u.sp > 0 ? Math.PI / 2 : -Math.PI / 2);
  });
  steams.forEach(s => s.puffs.forEach(p => {
    p.userData.t = (p.userData.t + dt * 0.32) % 1;
    const t = p.userData.t;
    p.position.set(s.at.x + Math.sin(t * 5) * 0.14, s.at.y + t * 1.8,
                   s.at.z + Math.cos(t * 4) * 0.12);
    p.scale.setScalar(0.5 + t * 1.4);
    p.material.opacity = 0.45 * (1 - t);
  }));
  boats.forEach(b => {
    const u = b.userData;
    u.a += u.sp * dt;
    b.position.set(CX + Math.cos(u.a) * u.r, -1.6 + Math.sin(now / 700 + u.a) * 0.08,
                   CZ + Math.sin(u.a) * u.r);
    b.rotation.y = -u.a;
  });
  clouds.forEach(c => {
    c.position.x += c.userData.s * dt * 2.2;
    if (c.position.x > BB.x1 + 24) c.position.x = BB.x0 - 24;
  });
  pins.forEach(p => {
    if (p.head) p.head.position.y = 1.62 + Math.sin(now / 560 + p.n) * 0.06;
  });
  placeTags();
  renderer.render(scene, camera);
}
resize(); applyCam(); mood(1);
requestAnimationFrame(loop);

})();
</script>
